<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f5f7fb;color:#172033}.wrap{max-width:440px;margin:60px auto;padding:16px}.card{background:#fff;border:1px solid #e2e8f0;border-radius:16px;padding:22px}input,button{width:100%;padding:13px;border-radius:10px;font-size:15px}input{border:1px solid #cbd5e1;margin:7px 0}button{border:0;background:#1769aa;color:#fff;font-weight:700;cursor:pointer;margin-top:8px}.msg{margin-top:10px}</style></head><body><div class="wrap"><div class="card"><h1>ফেইসবুক পাঠশালা</h1><p>Admin Panel</p><input id="email" type="email" placeholder="Admin Email"><input id="password" type="password" placeholder="Password"><button id="login">লগ ইন</button><div id="msg"></div></div></div><script>const sb=supabase.createClient("https://ydvbnalhcnfqpxkkmywr.supabase.co","sb_publishable_xCbSWDkASsbUPl-WmygyMw_eVrJY_9a");login.onclick=async()=>{msg.textContent="লগ ইন হচ্ছে...";const r=await sb.auth.signInWithPassword({email:email.value.trim(),password:password.value});if(r.error)msg.textContent=r.error.message;else location.href="dashboard.html"};</script></body></html>
