<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>নতুন পরীক্ষা তৈরি</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><link rel="stylesheet" href="css/admin.css"><style>body{font-family:Arial,sans-serif;background:#f2f5f9;padding:14px}.wrap{max-width:900px;margin:auto}.card{background:white;padding:18px;border-radius:12px;margin:12px 0}label{display:block;margin:10px 0}input,select,button{font:inherit;padding:10px;border-radius:7px;border:1px solid #ccd3dd;max-width:100%}input,select{width:100%}button{background:#1769aa;color:white;cursor:pointer;margin:5px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.question{display:flex;gap:10px;padding:10px;border-bottom:1px solid #ddd}.question input{width:auto}.msg{white-space:pre-wrap;overflow-wrap:anywhere}@media(max-width:600px){.grid{grid-template-columns:1fr}}</style></head><body><main class="wrap"><section class="card"><h1>নতুন পরীক্ষা তৈরি</h1><p>এখানে শুধু নতুন পরীক্ষা তৈরি হবে। পরে পরিবর্তন করবেন পরীক্ষা ব্যবস্থাপনা থেকে।</p><label>পরীক্ষার নাম<input id="examName" maxlength="180"></label><div class="grid"><label>সময় (মিনিট)<input id="duration" type="number" min="1" value="20"></label><label>প্রতি প্রশ্নের নম্বর<input id="marks" type="number" min="0" step=".01" value="1"></label><label>নেগেটিভ মার্ক<input id="negative" type="number" min="0" step=".01" value="0"></label><label>পাস নম্বর<input id="passMark" type="number" min="0" step=".01" value="0"></label></div></section><section class="card"><h2>প্রশ্ন নির্বাচন</h2><div class="grid"><label>ফোল্ডার<select id="folderSelect"><option value="">ফোল্ডার নির্বাচন করুন</option></select></label><label>সেট<select id="setSelect" disabled><option value="">সেট নির্বাচন করুন</option></select></label></div><button id="loadQuestions">প্রশ্ন দেখুন</button><p id="questionCount">প্রশ্নের সেট নির্বাচন করুন।</p><div id="questionList"></div><button id="selectAll">সব নির্বাচন</button> <button id="clearAll">সব অনির্বাচিত</button><p id="questionMessage" class="msg"></p></section><section class="card"><button id="createExam">পরীক্ষা তৈরি করুন</button><p id="createMessage" class="msg"></p><button onclick="location.href='exam-manager.html'">পরীক্ষা ব্যবস্থাপনায় যান</button></section></main><script src="js/supabase.js"></script><script src="js/create-exam.js"></script></body></html>
