<!doctype html>
<html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>স্টাডি ম্যাটেরিয়াল — ফেসবুক পাঠশালা</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>*{box-sizing:border-box}body{margin:0;background:#f3f6fb;color:#102a43;font-family:"Noto Sans Bengali",Arial,sans-serif}.hero{padding:24px 16px;background:linear-gradient(135deg,#173f5f,#0f766e);color:white;text-align:center}.wrap{max-width:900px;margin:22px auto;padding:0 14px}.item{background:white;border:1px solid #dbe4ef;border-radius:14px;padding:18px;margin:14px 0;box-shadow:0 4px 14px #00000008}.item h2{margin:0 0 8px;font-size:21px}.meta{font-size:13px;color:#52677d;margin-bottom:10px}.content{white-space:pre-wrap;line-height:1.8;overflow-wrap:anywhere}.filelink{display:inline-block;margin-top:10px;padding:10px 15px;border-radius:8px;background:#1d4ed8;color:white;text-decoration:none;font-weight:700}.search{width:100%;padding:12px;border:1px solid #cbd5e1;border-radius:9px;font-size:16px}.empty{padding:20px;background:#fff;border-radius:12px}@media(max-width:600px){.item{padding:15px}}</style></head>
<body><header class="hero"><h1>📚 স্টাডি ম্যাটেরিয়াল</h1><p>ফেসবুক পাঠশালা • পড়ুন, শিখুন, প্রস্তুতি নিন</p></header><main class="wrap"><p><a href="index.html">← মূল ওয়েবসাইটে ফিরে যান</a></p><input class="search" id="search" placeholder="শিরোনাম বা বিভাগ দিয়ে খুঁজুন"><div id="status" class="empty">স্টাডি ম্যাটেরিয়াল লোড হচ্ছে...</div><div id="list"></div></main>
<script>
const sb=supabase.createClient('https://ydvbnalhcnfqpxkkmywr.supabase.co','sb_publishable_xCbSWDkASsbUPl-WmygyMw_eVrJY_9a');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let items=[];
function render(){const q=document.getElementById('search').value.trim().toLowerCase();const list=items.filter(x=>(x.title+' '+(x.category||'')+' '+(x.description||'')).toLowerCase().includes(q));document.getElementById('status').textContent=list.length?'মোট '+list.length+'টি উপকরণ':'কোনো উপকরণ পাওয়া যায়নি।';document.getElementById('list').innerHTML=list.map(x=>'<article class="item"><h2>'+esc(x.title)+'</h2><div class="meta">'+esc(x.category||'সাধারণ')+(x.description?' · '+esc(x.description):'')+'</div>'+(x.material_type==='text'?'<div class="content">'+esc(x.content_text)+'</div>':(x.material_type==='image'?'<a href="'+esc(x.file_path)+'" target="_blank" rel="noopener"><img src="'+esc(x.file_path)+'" alt="'+esc(x.title)+'" style="display:block;max-width:100%;max-height:650px;object-fit:contain;border-radius:8px;margin-top:12px"></a>':'')+'<a class="filelink" href="'+esc(x.file_path)+'" target="_blank" rel="noopener">📄 PDF খুলুন / দেখুন</a>')+'</article>').join('')}
document.getElementById('search').addEventListener('input',render);
(async()=>{const {data,error}=await sb.from('study_materials').select('id,title,description,material_type,file_path,content_text,category,display_order,created_at').eq('published',true).order('display_order',{ascending:true}).order('created_at',{ascending:false});if(error){document.getElementById('status').textContent='লোড করা যায়নি। পরে আবার চেষ্টা করুন।';return}items=data||[];render()})();
</script></body></html>
