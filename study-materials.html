<body><header class="hero"><h1>📚 স্টাডি ম্যাটেরিয়াল</h1><p>ফেসবুক পাঠশালা • পড়ুন, শিখুন, প্রস্তুতি নিন</p></header><main class="wrap"><p><a href="https://fbpathshala.github.io/">← মূল ওয়েবসাইটে ফিরে যান</a></p>
<section class="item"><h2>💼 জব কেয়ার — স্টাডি ম্যাটেরিয়াল</h2><p>অ্যাডমিন প্যানেলে প্রকাশিত উপকরণ এখানে স্বয়ংক্রিয়ভাবে দেখা যাবে।</p>
<div class="filters"><div><label for="categoryFilter">ক্যাটাগরি</label><select id="categoryFilter"><option value="">সব ক্যাটাগরি</option></select></div><div><label for="subcategoryFilter">সাব-ক্যাটাগরি</label><select id="subcategoryFilter"><option value="">সব সাব-ক্যাটাগরি</option></select></div><div><label for="setFilter">সেট / ফোল্ডার</label><select id="setFilter"><option value="">সব সেট / ফোল্ডার</option></select></div></div>

<div id="status" class="empty">স্টাডি ম্যাটেরিয়াল লোড হচ্ছে...</div><div id="list"></div></section></main>
<script>
const sb=supabase.createClient('https://ydvbnalhcnfqpxkkmywr.supabase.co','sb_publishable_xCbSWDkASsbUPl-WmygyMw_eVrJY_9a');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let items=[],taxonomyNodes=[];
const $=id=>document.getElementById(id);
function fillSelect(id,values,placeholder,selected=''){const el=$(id);el.innerHTML='<option value="">'+placeholder+'</option>'+values.map(v=>'<option value="'+esc(v.value)+'">'+esc(v.label)+'</option>').join('');el.value=selected}
function nodeName(id){return taxonomyNodes.find(n=>String(n.id)===String(id))?.name||''}
function updateSubcategoryOptions(){const cat=$('categoryFilter').value;const vals=taxonomyNodes.filter(n=>n.node_type==='subcategory'&&(!cat||String(n.parent_id)===cat)).map(n=>({value:String(n.id),label:n.name}));fillSelect('subcategoryFilter',vals,'সব সাব-ক্যাটাগরি');updateSetOptions()}
function updateSetOptions(){const sub=$('subcategoryFilter').value;const vals=taxonomyNodes.filter(n=>n.node_type==='set'&&(!sub||String(n.parent_id)===sub)).map(n=>({value:String(n.id),label:n.name}));const folders=[...new Set(items.map(x=>(x.folder_name||'সাধারণ').trim()||'সাধারণ'))].map(name=>({value:'folder:'+name,label:'📁 '+name}));const combined=[...vals,...folders.filter(f=>!vals.some(v=>v.label===f.label))];fillSelect('setFilter',combined,'সব সেট / ফোল্ডার')}
function matches(x){const q=$('search').value.trim().toLowerCase();const cat=$('categoryFilter').value,sub=$('subcategoryFilter').value,set=$('setFilter').value;const folder=(x.folder_name||'সাধারণ').trim()||'সাধারণ';return(!cat||String(x.category_id||'')===cat)&&(!sub||String(x.subcategory_id||'')===sub)&&(!set||(set.startsWith('folder:')?folder===set.slice(7):String(x.set_id||'')===set))&&(!q||(x.title+' '+(x.taxonomyPath||'')+' '+(x.category||'')+' '+(x.description||'')).toLowerCase().includes(q))}
function cleanBatchCaption(value){return String(value||'').replace(/\s*•\s*ছবি\s*\d+\s*\/\s*\d+\s*$/,'').replace(/ছবি\s*\d+\s*\/\s*\d+\s*$/,'').trim()}
function imageGroupKey(x){return [x.department||'',x.title||'',(x.folder_name||'সাধারণ').trim(),x.category_id||'',x.subcategory_id||'',x.chapter_id||'',x.set_id||'',x.created_at||'',cleanBatchCaption(x.description)].join('¦')}
function bnNumber(value){return String(value??'').replace(/\d/g,d=>'০১২৩৪৫৬৭৮৯'[Number(d)])}
function compareNewest(a,b){const ta=Date.parse(a.created_at||'')||0,tb=Date.parse(b.created_at||'')||0;return tb-ta||String(b.id).localeCompare(String(a.id))}
function buildMaterialGroups(source){const map=new Map();for(const x of source){const key=x.material_type==='image'?'image¦'+imageGroupKey(x):'single¦'+x.id;if(!map.has(key))map.set(key,{kind:x.material_type==='image'?'image':'single',rows:[],first:x});map.get(key).rows.push(x)}const groups=[...map.values()];for(const g of groups){g.rows.sort((a,b)=>{const ai=Number((String(a.description||'').match(/ছবি\s*(\d+)\s*\//)||[])[1]||0),bi=Number((String(b.description||'').match(/ছবি\s*(\d+)\s*\//)||[])[1]||0);return ai&&bi?ai-bi:(a.display_order||0)-(b.display_order||0)});g.first=g.rows[0]}return groups.sort((a,b)=>compareNewest(a.first,b.first))}
function assignPostNumbers(source){const groups=buildMaterialGroups(source),counts=new Map();for(const g of groups){const key=String(g.first.subcategory_id||g.first.category_id||'uncategorized'),number=(counts.get(key)||0)+1;counts.set(key,number);g.postNumber=number;for(const row of g.rows)row.postNumber=number}return groups}
function render(){
 const groups=assignPostNumbers(items).filter(g=>matches(g.first));
 const hashId=location.hash?decodeURIComponent(location.hash.slice(1)):'';
 const detailGroup=hashId.startsWith('material-')?groups.find(g=>'material-'+String(g.first.id)===hashId):null;
 if(detailGroup){
  const x=detailGroup.first,meta=x.taxonomyPath||x.category||'সাধারণ',caption=cleanBatchCaption(x.description);
  const captionHtml=caption?'<div class="content image-caption">'+esc(caption)+'</div>':'';
  let body='';
  if(detailGroup.kind==='image')body='<div class="image-gallery">'+detailGroup.rows.map(img=>'<figure class="image-entry"><img src="'+esc(img.file_path)+'" alt="'+esc(x.title)+'" loading="lazy" draggable="false" oncontextmenu="return false"></figure>').join('')+'</div>';
  else if(x.material_type==='text')body='<div class="content">'+esc(x.content_text)+'</div>';
  else body='<button class="filelink pdf-open" type="button" data-pdf-url="'+esc(x.file_path)+'">📖 PDF পড়ুন</button>';
  $('status').textContent='নির্বাচিত উপকরণ';
  $('list').innerHTML='<a class="backbtn" href="'+esc(location.pathname)+'">← সূচিপত্রে ফিরে যান</a><article class="item detail-view" id="'+esc(hashId)+'"><h2>'+esc(x.title)+'</h2><div class="meta">'+esc(meta)+'</div>'+captionHtml+body+'</article>';
  return;
 }
 $('status').textContent=groups.length?'মোট '+groups.length+'টি উপকরণ • সূচিপত্র':'কোনো উপকরণ পাওয়া যায়নি।';
 $('list').innerHTML='<div class="materials-index-wrap"><table class="materials-index"><thead><tr><th scope="col">ক্রমিক</th><th scope="col">স্টাডি ম্যাটেরিয়ালের নাম</th><th scope="col">বিস্তারিত</th></tr></thead><tbody>'+groups.map(g=>{
  const x=g.first,number=bnNumber(x.postNumber||1),url=new URL(location.pathname,location.href);url.hash='material-'+x.id;
  return '<tr><td class="index-number">'+number+'</td><td class="index-title">'+esc(x.title)+'</td><td class="index-action"><a class="toc-open" href="'+esc(url.href)+'">বিস্তারিত</a></td></tr>';
 }).join('')+'</tbody></table></div>';
}
async function init(){const {data,error}=await sb.from('study_materials').select('id,title,description,material_type,file_path,content_text,category,department,folder_name,display_order,created_at,category_id,subcategory_id,chapter_id,set_id,published').eq('published',true).eq('department','job_care').order('created_at',{ascending:false}).order('id',{ascending:false});if(error){$('status').textContent='স্টাডি ম্যাটেরিয়াল লোড করা যায়নি। পরে আবার চেষ্টা করুন।';return}const tax=await sb.from('study_material_taxonomy').select('id,name,parent_id,node_type,display_order').eq('department','job_care').order('display_order').order('name');taxonomyNodes=tax.data||[];const byId=id=>taxonomyNodes.find(n=>String(n.id)===String(id));items=(data||[]).map(x=>({...x,taxonomyPath:[x.category_id,x.subcategory_id,x.set_id].filter(Boolean).map(byId).filter(Boolean).map(n=>n.name).join(' › ')}));assignPostNumbers(items);fillSelect('categoryFilter',taxonomyNodes.filter(n=>n.node_type==='category').map(n=>({value:String(n.id),label:n.name})),'সব ক্যাটাগরি');updateSubcategoryOptions();render()}
$('categoryFilter').addEventListener('change',()=>{updateSubcategoryOptions();render()});$('subcategoryFilter').addEventListener('change',()=>{updateSetOptions();render()});$('setFilter').addEventListener('change',render);$('search').addEventListener('input',render);window.addEventListener('hashchange',render);

 init();
