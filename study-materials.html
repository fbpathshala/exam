<style>*{box-sizing:border-box}body{margin:0;background:#f3f6fb;color:#102a43;font-family:"Noto Sans Bengali",Arial,sans-serif}.hero{padding:24px 16px;background:linear-gradient(135deg,#173f5f,#0f766e);color:white;text-align:center}.wrap{max-width:900px;margin:22px auto;padding:0 14px}.item{background:white;border:1px solid #dbe4ef;border-radius:14px;padding:18px;margin:14px 0;box-shadow:0 4px 14px #00000008}.item h2{margin:0 0 8px;font-size:21px}.meta{font-size:13px;color:#52677d;margin-bottom:10px}.content{white-space:pre-wrap;line-height:1.8;overflow-wrap:anywhere}.filelink{display:inline-block;margin-top:10px;padding:10px 15px;border-radius:8px;background:#1d4ed8;color:white;text-decoration:none;font-weight:700}.search{width:100%;padding:12px;border:1px solid #cbd5e1;border-radius:9px;font-size:16px}.empty{padding:20px;background:#fff;border-radius:12px}.filters{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:14px 0}.filters label{display:block;font-weight:700;font-size:14px;margin-bottom:5px}.filters select{width:100%;padding:11px;border:1px solid #cbd5e1;border-radius:9px;background:white;font:inherit}.folder-heading{margin:20px 0 6px;padding:10px 12px;border-radius:9px;background:#e8f1f8;color:#173f5f;font-size:16px}.image-gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;margin-top:12px}.image-gallery a{display:block;border:1px solid #dbe4ef;border-radius:9px;overflow:hidden;background:#f8fafc}.image-gallery img{display:block;width:100%;height:220px;object-fit:contain;background:#f8fafc}@media(max-width:600px){.image-gallery{grid-template-columns:repeat(2,minmax(0,1fr))}.image-gallery img{height:180px}}.department-grid strong{font-size:18px}.department-grid span{font-size:13px;color:#52677d}.backbtn{margin:0 0 12px;padding:9px 12px;border:1px solid #cbd5e1;border-radius:8px;background:#fff;color:#102a43;font:inherit;font-weight:700;cursor:pointer}#materialsSection[hidden]{display:none}@media(max-width:600px){.item{padding:15px}.filters{grid-template-columns:1fr}}</style><style id="site-copy-deterrent">html,body{-webkit-user-select:none!important;user-select:none!important;-webkit-touch-callout:none!important}input,textarea,select,[contenteditable="true"],[contenteditable=""]{-webkit-user-select:text!important;user-select:text!important;-webkit-touch-callout:default!important}html.admin-copy-enabled,html.admin-copy-enabled body,html.admin-copy-enabled body *{-webkit-user-select:text!important;user-select:text!important;-webkit-touch-callout:default!important}</style><style id="central-section-return-style">.central-section-return{max-width:1000px;margin:24px auto 0;padding:0 14px 20px}.central-section-return a{display:flex;align-items:center;justify-content:center;min-height:48px;padding:11px 16px;border:1px solid #c2d5e6;border-radius:10px;background:#e8f1f8;color:#173f5f;text-decoration:none;font-weight:750;font-size:14px}.central-section-return a:hover{background:#dce8f1}@media(max-width:650px){.central-section-return{padding:0 10px 18px}.central-section-return a{width:100%;min-height:48px}}</style></head>
<body><header class="hero"><h1>📚 স্টাডি ম্যাটেরিয়াল</h1><p>ফেসবুক পাঠশালা • পড়ুন, শিখুন, প্রস্তুতি নিন</p></header><main class="wrap"><p><a href="https://fbpathshala.github.io/">← মূল ওয়েবসাইটে ফিরে যান</a></p>
<section class="item"><h2>💼 জব কেয়ার — স্টাডি ম্যাটেরিয়াল</h2><p>অ্যাডমিন প্যানেলে প্রকাশিত উপকরণ এখানে স্বয়ংক্রিয়ভাবে দেখা যাবে।</p>
<div class="filters"><div><label for="categoryFilter">ক্যাটাগরি</label><select id="categoryFilter"><option value="">সব ক্যাটাগরি</option></select></div><div><label for="subcategoryFilter">সাব-ক্যাটাগরি</label><select id="subcategoryFilter"><option value="">সব সাব-ক্যাটাগরি</option></select></div><div><label for="setFilter">সেট / ফোল্ডার</label><select id="setFilter"><option value="">সব সেট / ফোল্ডার</option></select></div></div>
<input class="search" id="search" placeholder="শিরোনাম, বিষয় বা বিবরণ দিয়ে খুঁজুন" aria-label="স্টাডি ম্যাটেরিয়াল খুঁজুন">
<div id="status" class="empty">স্টাডি ম্যাটেরিয়াল লোড হচ্ছে...</div><div id="list"></div></section></main>
<script>
const sb=supabase.createClient('https://ydvbnalhcnfqpxkkmywr.supabase.co','sb_publishable_xCbSWDkASsbUPl-WmygyMw_eVrJY_9a');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let items=[],taxonomyNodes=[];
const $=id=>document.getElementById(id);
function fillSelect(id,values,placeholder,selected=''){const el=$(id);el.innerHTML='<option value="">'+placeholder+'</option>'+values.map(v=>'<option value="'+esc(v.value)+'">'+esc(v.label)+'</option>').join('');el.value=selected}
function nodeName(id){return taxonomyNodes.find(n=>String(n.id)===String(id))?.name||''}
function updateSubcategoryOptions(){const cat=$('categoryFilter').value;const vals=taxonomyNodes.filter(n=>n.node_type==='subcategory'&&(!cat||String(n.parent_id)===cat)).map(n=>({value:String(n.id),label:n.name}));fillSelect('subcategoryFilter',vals,'সব সাব-ক্যাটাগরি');updateSetOptions()}
function updateSetOptions(){const sub=$('subcategoryFilter').value;const vals=taxonomyNodes.filter(n=>n.node_type==='set'&&(!sub||String(n.parent_id)===sub)).map(n=>({value:String(n.id),label:n.name}));const folders=[...new Set(items.map(x=>(x.folder_name||'সাধারণ').trim()||'সাধারণ'))].map(name=>({value:'folder:'+name,label:'📁 '+name}));const combined=[...vals,...folders.filter(f=>!vals.some(v=>v.label===f.label))];fillSelect('setFilter',combined,'সব সেট / ফোল্ডার')}
function matches(x){const q=$('search').value.trim().toLowerCase();const cat=$('categoryFilter').value,sub=$('subcategoryFilter').value,set=$('setFilter').value;const folder=(x.folder_name||'সাধারণ').trim()||'সাধারণ';return(!cat||String(x.category_id||'')===cat)&&(!sub||String(x.subcategory_id||'')===sub)&&(!set||(set.startsWith('folder:')?folder===set.slice(7):String(x.set_id||'')===set))&&(!q||(x.title+' '+(x.taxonomyPath||'')+' '+(x.category||'')+' '+(x.description||'')).toLowerCase().includes(q))}
function render(){const rows=items.filter(matches);$('status').textContent=rows.length?'মোট '+rows.length+'টি প্রকাশিত উপকরণ':'কোনো উপকরণ পাওয়া যায়নি।';const folders=new Map();for(const x of rows){const folder=(x.folder_name||'সাধারণ').trim()||'সাধারণ';if(!folders.has(folder))folders.set(folder,[]);folders.get(folder).push(x)}$('list').innerHTML=[...folders].map(([folder,folderRows])=>'<h3 class="folder-heading">📁 '+esc(folder)+' ('+folderRows.length+'টি)</h3>'+folderRows.map(x=>{const meta=x.taxonomyPath||x.category||'সাধারণ';if(x.material_type==='image')return '<article class="item"><h2>'+esc(x.title)+'</h2><div class="meta">'+esc(meta)+(x.description?' · '+esc(x.description):'')+'</div><div class="image-gallery"><a href="'+esc(x.file_path)+'" target="_blank" rel="noopener"><img src="'+esc(x.file_path)+'" alt="'+esc(x.title)+'" loading="lazy"></a></div></article>';return '<article class="item"><h2>'+esc(x.title)+'</h2><div class="meta">'+esc(meta)+(x.description?' · '+esc(x.description):'')+'</div>'+(x.material_type==='text'?'<div class="content">'+esc(x.content_text)+'</div>':'<a class="filelink" href="'+esc(x.file_path)+'" target="_blank" rel="noopener">📄 PDF খুলুন / দেখুন</a>')+'</article>'}).join('')).join('')}
async function init(){const {data,error}=await sb.from('study_materials').select('id,title,description,material_type,file_path,content_text,category,department,folder_name,display_order,created_at,category_id,subcategory_id,chapter_id,set_id,published').eq('published',true).eq('department','job_care').order('folder_name').order('display_order').order('created_at',{ascending:false});if(error){$('status').textContent='স্টাডি ম্যাটেরিয়াল লোড করা যায়নি। পরে আবার চেষ্টা করুন।';return}const tax=await sb.from('study_material_taxonomy').select('id,name,parent_id,node_type,display_order').eq('department','job_care').order('display_order').order('name');taxonomyNodes=tax.data||[];const byId=id=>taxonomyNodes.find(n=>String(n.id)===String(id));items=(data||[]).map(x=>({...x,taxonomyPath:[x.category_id,x.subcategory_id,x.set_id].filter(Boolean).map(byId).filter(Boolean).map(n=>n.name).join(' › ')}));fillSelect('categoryFilter',taxonomyNodes.filter(n=>n.node_type==='category').map(n=>({value:String(n.id),label:n.name})),'সব ক্যাটাগরি');updateSubcategoryOptions();render()}
$('categoryFilter').addEventListener('change',()=>{updateSubcategoryOptions();render()});$('subcategoryFilter').addEventListener('change',()=>{updateSetOptions();render()});$('setFilter').addEventListener('change',render);$('search').addEventListener('input',render);init();
</script><script id="site-copy-deterrent-script">(function(){var admin=false;function stop(e){if(!admin&&!(e.target&&e.target.closest&&e.target.closest('input,textarea,select,[contenteditable="true"],[contenteditable=""]'))){e.preventDefault();e.stopPropagation()}}document.addEventListener('contextmenu',stop,true);document.addEventListener('selectstart',stop,true);document.addEventListener('copy',stop,true);document.addEventListener('cut',stop,true);document.addEventListener('keydown',function(e){if(admin)return;var k=(e.key||'').toLowerCase();if((e.ctrlKey||e.metaKey)&&['c','x','u','s','p'].includes(k)){e.preventDefault();e.stopPropagation()}if(e.key==='PrintScreen')e.preventDefault()},true);(async function(){try{var client=window.db;if(!client&&typeof db!=='undefined')client=db;if(!client&&typeof sb!=='undefined')client=sb;if(client&&client.auth){var r=await client.auth.getSession();admin=!!(r&&r.data&&r.data.session&&r.data.session.user)}}catch(_){admin=false}document.documentElement.classList.toggle('admin-copy-enabled',admin)})();})();</script><div class="central-section-return"><a href="https://fbpathshala.github.io/home.html">⌂ মূল মেনু / হোম পেইজে ফিরুন</a></div>
