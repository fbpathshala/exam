<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ফেইসবুক পাঠশালা — Question Bank</title><link rel="stylesheet" href="css/admin.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>.qb-filters{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.qb-actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}.qb-source,.qb-explanation{font-size:13px;color:#64748b;margin-top:6px}.qb-answer{font-weight:600;margin-top:6px}.qb-edit-grid,.qb-move-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}@media(max-width:760px){.qb-filters,.qb-edit-grid,.qb-move-grid{grid-template-columns:1fr}}</style></head><body>
<div id="login" class="center"><div class="card login"><h1>ফেইসবুক পাঠশালা</h1><h2>Question Bank</h2><input id="email" type="email" placeholder="Admin Email"><input id="password" type="password" placeholder="Password"><button onclick="login()">Login</button><p id="loginMsg" class="msg"></p></div></div>
<div id="app" class="hidden"><header class="dashboard-top"><div class="dashboard-brand"><h1>ফেইসবুক পাঠশালা</h1><p>Question Bank</p></div><div class="admin-menu"><button type="button" class="admin-menu-btn" id="adminMenuBtn">☰</button><div class="admin-menu-panel hidden" id="adminMenuPanel"><button onclick="location.href='dashboard.html'">🏠 ড্যাশবোর্ড</button><button onclick="location.href='question_create.html'">➕ প্রশ্ন তৈরি</button><button onclick="location.href='question_bank.html'">🗂️ প্রশ্ন ব্যাংক</button><button onclick="location.href='admin_dashboard_split.html?section=exam'">📋 পরীক্ষা পরিচালনা</button><button class="logout" onclick="logout()">🚪 লগ আউট</button></div></div></header>
<main><div class="card"><h2>প্রশ্ন ফিল্টারিং</h2><div class="qb-filters"><select id="filterCategory"><option value="">সব ক্যাটাগরি</option><option>নিয়োগ পরীক্ষা</option><option>যাচাই পরীক্ষা</option><option>সাম্প্রতিক প্রশ্ন</option></select><select id="filterFolder"><option value="">সব ফোল্ডার</option></select><select id="filterSet"><option value="">সব সেট</option></select><select id="filterSubject"><option value="">সব বিষয়</option></select></div><input id="search" style="width:100%;margin-top:10px" placeholder="প্রশ্ন খুঁজুন"><p id="filterMsg" class="msg"></p></div>
<div id="moveBox" class="card hidden"><h2>📁 প্রশ্ন মুভ করুন</h2><input id="moveQuestionId" type="hidden"><div class="qb-move-grid"><div><label>বর্তমান Folder</label><select id="currentMoveFolder"></select></div><div><label>বর্তমান Set</label><select id="currentMoveSet"></select></div><div><label>Destination Folder</label><select id="moveFolder"></select></div><div><label>Destination Set</label><select id="moveSet"></select></div></div><button onclick="moveQuestion()">মুভ করুন</button><button class="secondary" onclick="closeMove()">বাতিল</button><p id="moveMsg" class="msg"></p></div>
<div id="editBox" class="card hidden"><h2>✏️ প্রশ্ন Edit করুন</h2><input id="editId" type="hidden"><div class="qb-edit-grid"><input id="editQuestionNumber" type="number" placeholder="প্রশ্ন নম্বর"><select id="editCategory"></select><select id="editFolder"></select><select id="editSet"></select><select id="editSubject"></select></div><textarea id="editQuestion" placeholder="প্রশ্ন"></textarea><div class="qb-edit-grid"><input id="editA" placeholder="ক. অপশন"><input id="editB" placeholder="খ. অপশন"><input id="editC" placeholder="গ. অপশন"><input id="editD" placeholder="ঘ. অপশন"></div><div class="qb-edit-grid"><select id="editCorrect"><option value="">সঠিক উত্তর</option><option value="A">ক</option><option value="B">খ</option><option value="C">গ</option><option value="D">ঘ</option></select><input id="editExplanation" placeholder="ব্যাখ্যা"></div><button onclick="saveEdit()">সংরক্ষণ করুন</button><button class="secondary" onclick="closeEdit()">বাতিল</button><p id="editMsg" class="msg"></p></div>
<div class="card"><h2>Question Bank</h2><div id="questions"></div></div></main></div><script src="js/supabase.js"></script><script src="js/question_bank.js"></script></body></html>
