<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Question Bank — ফেইসবুক পাঠশালা</title><link rel="stylesheet" href="css/admin.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{padding:16px}.wrap{max-width:1100px;margin:auto}.top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:16px}.nav{display:flex;gap:8px;flex-wrap:wrap}.card{margin-bottom:16px}.filters{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.q{border:1px solid #e5e7eb;border-radius:14px;padding:16px;margin:12px 0;background:#fff}.qtop{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.qtop b{font-size:17px;line-height:1.55}.opts{line-height:1.8;margin-top:10px}.correct{font-weight:700;margin-top:8px}.source{display:block;margin-top:8px;text-decoration:none;color:#2563eb}.subject{color:#64748b;margin-top:6px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.danger{background:#fee2e2!important;color:#991b1b!important}.copy{white-space:nowrap}.hidden{display:none!important}.msg{min-height:22px}.modal{position:fixed;inset:0;background:rgba(15,23,42,.5);display:flex;align-items:center;justify-content:center;padding:16px}.modalbox{background:#fff;border-radius:16px;padding:18px;max-width:760px;width:100%;max-height:90vh;overflow:auto}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}textarea{width:100%;min-height:100px}@media(max-width:700px){.filters,.grid{grid-template-columns:1fr}.top{flex-direction:column;align-items:flex-start}.qtop{flex-direction:column}}</style></head><body><div id="login" class="center"><div class="card login"><h1>ফেইসবুক পাঠশালা</h1><h2>Admin Login</h2><input id="email" type="email" placeholder="Admin Email"><input id="password" type="password" placeholder="Password"><button onclick="login()">Login</button><p id="loginMsg" class="msg"></p></div></div><div id="app" class="hidden"><div class="wrap"><div class="top"><div><h1>🗂️ Question Bank</h1><p class="muted" id="count">প্রশ্ন লোড হচ্ছে...</p></div><div class="nav"><button onclick="location.href='question_create.html'">➕ প্রশ্ন তৈরি</button><button onclick="location.href='admin_dashboard_split.html?section=exam'">📋 পরীক্ষা পরিচালনা</button><button onclick="logout()">🚪 লগ আউট</button></div></div><div class="card"><h2>Filter / Search</h2><div class="filters"><select id="folder"></select><select id="set"></select><select id="subject"></select></div><div class="filters" style="margin-top:10px"><input id="search" placeholder="প্রশ্ন খুঁজুন"><button onclick="loadQuestions()">🔄 Refresh</button><div></div></div><p id="msg" class="msg"></p></div><div id="questions"></div></div></div><div id="editModal" class="modal hidden"><div class="modalbox"><h2>✏️ প্রশ্ন সম্পাদনা</h2><input id="editId" type="hidden"><div class="grid"><input id="editQno" type="number" placeholder="প্রশ্ন নম্বর"><select id="editCorrect"><option value="A">ক</option><option value="B">খ</option><option value="C">গ</option><option value="D">ঘ</option></select></div><textarea id="editQuestion" placeholder="প্রশ্ন"></textarea><div class="grid"><input id="editA" placeholder="ক. অপশন"><input id="editB" placeholder="খ. অপশন"><input id="editC" placeholder="গ. অপশন"><input id="editD" placeholder="ঘ. অপশন"></div><textarea id="editExplanation" placeholder="ব্যাখ্যা (ঐচ্ছিক)"></textarea><div class="actions"><button onclick="saveEdit()">💾 Save Changes</button><button onclick="document.getElementById('editModal').classList.add('hidden')">Cancel</button></div></div></div><script src="js/supabase.js"></script><script src="question_bank.js"></script><script>async function login(){const m=document.getElementById('loginMsg');m.textContent='Login হচ্ছে...';const{error}=await db.auth.signInWithPassword({email:document.getElementById('email').value.trim(),password:document.getElementById('password').value});if(error){m.textContent=error.message;return}location.reload()}async function logout(){await db.auth.signOut();location.reload()}</script></body></html>
