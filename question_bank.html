<div id="login" class="center"><div class="card login"><h1>ফেইসবুক পাঠশালা</h1><h2>Question Bank</h2><input id="email" type="email" placeholder="Admin Email"><input id="password" type="password" placeholder="Password"><button onclick="login()">Login</button><p id="loginMsg" class="msg"></p></div></div>

<main><div class="card"><h2>প্রশ্ন ফিল্টারিং</h2><div class="qb-filters"><select id="filterType"><option value="">সব ধরন</option><option value="mcq">MCQ</option><option value="cq">CQ</option></select><select id="filterCategory"><option value="">সব ক্যাটাগরি</option><option>নিয়োগ পরীক্ষা</option><option>যাচাই পরীক্ষা</option><option>সাম্প্রতিক প্রশ্নোত্তর</option></select><select id="filterFolder"><option value="">সব ফোল্ডার</option></select><select id="filterSet"><option value="">সব সেট</option></select><select id="filterSubject"><option value="">সব বিষয়</option></select></div><input id="search" style="width:100%;margin-top:10px" placeholder="প্রশ্ন খুঁজুন"><p id="filterMsg" class="msg"></p></div>
