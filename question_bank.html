<!doctype html>
<html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ফেইসবুক পাঠশালা — Question Bank</title><link rel="stylesheet" href="css/admin.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head>
<body>
<div id="login" class="center"><div class="card login"><h1>ফেইসবুক পাঠশালা</h1><h2>Question Bank</h2><input id="email" type="email" placeholder="Admin Email"><input id="password" type="password" placeholder="Password"><button onclick="login()">Login</button><p id="loginMsg" class="msg"></p></div></div>
<div id="app" class="hidden"><header class="dashboard-top"><div class="dashboard-brand"><h1>ফেইসবুক পাঠশালা</h1><p>Question Bank</p></div><div class="admin-menu"><button type="button" class="admin-menu-btn" id="adminMenuBtn">☰</button><div class="admin-menu-panel hidden" id="adminMenuPanel"><button onclick="location.href='dashboard.html'">🏠 ড্যাশবোর্ড</button><button onclick="location.href='question_create.html'">➕ প্রশ্ন তৈরি</button><button onclick="location.href='question_bank.html'">🗂️ প্রশ্ন ব্যাংক</button><button onclick="location.href='admin_dashboard_split.html?section=exam'">📋 পরীক্ষা পরিচালনা</button><button class="logout" onclick="logout()">🚪 লগ আউট</button></div></div></header>
<main><div class="card"><h2>Category → Folder → Set</h2><div class="cats"><button id="cat-recruitment" onclick="selectCategory('recruitment')">নিয়োগ পরীক্ষা</button><button id="cat-verification_test" onclick="selectCategory('verification_test')">যাচাই পরীক্ষা</button><button id="cat-recent" onclick="selectCategory('recent')">সাম্প্রতিক প্রশ্ন</button></div><div id="currentCat" class="notice"></div><div class="grid"><select id="filterFolder"></select><select id="filterSet"></select></div><div class="grid"><select id="filterSubject"></select><input id="search" placeholder="প্রশ্ন খুঁজুন"></div><button onclick="loadQuestions()">Refresh</button></div><div class="card"><h2>Question Bank</h2><div id="questions"></div></div></main></div>
<script src="js/supabase.js"></script><script src="js/question_bank.js"></script></body></html>
