<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ফেইসবুক পাঠশালা — Exam Management</title>
<link rel="stylesheet" href="css/admin.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<div id="login" class="center">
  <div class="card login">
    <h1>ফেইসবুক পাঠশালা</h1><h2>Admin Panel</h2>
    <input id="email" type="email" placeholder="Admin Email">
    <input id="password" type="password" placeholder="Password">
    <button onclick="login()">Login</button>
    <p id="loginMsg" class="msg"></p>
  </div>
</div>
<div id="app" class="hidden">
<header class="dashboard-top">
  <div class="dashboard-brand"><h1>ফেইসবুক পাঠশালা</h1><p>Exam Management</p></div>
  <div class="admin-menu">
    <button type="button" class="admin-menu-btn" id="adminMenuBtn" aria-label="মেনু">☰</button>
    <div class="admin-menu-panel hidden" id="adminMenuPanel">
      <button type="button" onclick="location.href='dashboard.html'">🏠 ড্যাশবোর্ড</button>
      <button type="button" onclick="location.href='question_create.html'">➕ প্রশ্ন তৈরি</button>
      <button type="button" onclick="location.href='question_bank.html'">🗂️ প্রশ্ন ব্যাংক</button>
      <button type="button" onclick="location.href='admin_dashboard_split.html?section=exam'">📋 পরীক্ষা পরিচালনা</button>
      <button type="button" class="logout" onclick="logout()">🚪 লগ আউট</button>
    </div>
  </div>
</header>
<main>
<section id="exam" class="page">
  <div class="card">
    <h2>Exam Management</h2>
    <div class="grid">
      <input id="examName" placeholder="পরীক্ষার নাম">
      <select id="examStatus"><option value="active">Active</option><option value="inactive">Inactive</option></select>
    </div>
    <button onclick="createExam()">＋ নতুন Exam তৈরি</button>
    <p id="examMsg" class="msg"></p>
  </div>
  <div class="card">
    <h2>Exam Settings</h2>
    <select id="examSelect" onchange="loadSettings()"></select>
    <div class="grid"><input id="totalQ" type="number" placeholder="Total Questions"><input id="totalMarks" type="number" placeholder="Total Marks"></div>
    <div class="grid"><input id="pass" type="number" placeholder="Pass Mark"><input id="duration" type="number" placeholder="Duration (minutes)"></div>
    <div class="grid"><input id="marks" type="number" step="0.01" placeholder="Marks / Question"><input id="negative" type="number" step="0.01" placeholder="Negative Mark"></div>
    <input id="examiner" placeholder="পরীক্ষকের নাম">
    <textarea id="syllabus" placeholder="সিলেবাস"></textarea>
    <div class="checks">
      <label><input id="showAnswers" type="checkbox"> উত্তর দেখাবে</label>
      <label><input id="multiple" type="checkbox"> Multiple Attempt</label>
      <label><input id="device" type="checkbox" checked> Device Protection</label>
      <label><input id="randomQ" type="checkbox"> Random Questions</label>
      <label><input id="randomO" type="checkbox"> Random Options</label>
    </div>
    <div class="grid"><input id="startDate" type="date"><input id="startTime" type="time"></div>
    <div class="grid"><input id="endDate" type="date"><input id="endTime" type="time"></div>
    <button onclick="saveSettings()">Settings Save</button>
    <p id="settingsMsg" class="msg"></p>
  </div>
  <div class="card">
    <h2>Exam-এ Question Bank থেকে প্রশ্ন নিন</h2>
    <select id="mapExam"></select>
    <div class="grid"><select id="mapFolder"></select><select id="mapSet"></select></div>
    <button onclick="loadPool()">প্রশ্ন দেখুন</button>
    <div id="pool"></div><p id="mapMsg" class="msg"></p>
  </div>
  <div class="card">
    <h2>Exam List / Link</h2>
    <a href="results.html" target="_blank" class="result-link">📊 Result দেখুন</a>
    <div id="exams"></div>
  </div>
</section>
</main>
</div>
<script src="js/supabase.js"></script>
<script src="js/admin_dashboard_split.js"></script>
</body>
</html>
