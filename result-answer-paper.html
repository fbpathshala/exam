<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>পরীক্ষার্থীর উত্তরপত্র</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/docx@8.5.0/build/index.umd.js"></script>
<style>
body{margin:0;background:#eee;font-family:Arial,sans-serif;color:#172033}
.toolbar{text-align:center;background:#183c63;padding:12px;position:sticky;top:0;z-index:5}
.toolbar button{padding:10px;margin:4px;cursor:pointer}
.paper{width:210mm;min-height:297mm;background:white;margin:16px auto;padding:15mm;box-sizing:border-box}
.head{text-align:center;border-bottom:1px solid #555;padding-bottom:10px}
.meta{display:flex;justify-content:space-between;gap:8px;font-size:12px;flex-wrap:wrap}
.questions{column-count:2;column-gap:9mm;column-rule:1px solid #ddd;font-size:12px;line-height:1.5}
.q{break-inside:avoid;margin:0 0 12px}
.qt{font-weight:bold}
.opt{padding:0;margin:0}
.selected{font-weight:700;background:#eef6ff;border-radius:3px}.correct{font-weight:700;background:#e9f8ef;border-radius:3px}.selected::after{content:" ✓";font-weight:700}.correct::before{content:"✓ ";font-weight:700;color:#087443}
.detail,.expl{margin-top:4px;font-size:11px}
@page{size:A4;margin:0}
@media(max-width:800px){.paper{width:100%;padding:18px}.questions{column-gap:16px}}
@media print{.toolbar,#status{display:none}.paper{margin:0;width:auto;min-height:0;box-shadow:none;padding:15mm}.questions{column-count:2;font-size:11pt}}
</style>
<style id="direct-dashboard-navigation">.direct-dashboard-nav{position:fixed;right:16px;bottom:16px;z-index:9999;display:inline-flex;align-items:center;gap:8px;padding:11px 16px;border-radius:999px;background:#1d4ed8;color:#fff!important;text-decoration:none!important;font:700 15px/1.2 Arial,sans-serif;box-shadow:0 5px 18px #0003;border:2px solid #fff}.direct-dashboard-nav:hover{background:#1e40af;transform:translateY(-1px)}@media print{.direct-dashboard-nav{display:none!important}}</style><style id="site-copy-deterrent">html,body{-webkit-user-select:none!important;user-select:none!important;-webkit-touch-callout:none!important}input,textarea,select,[contenteditable="true"],[contenteditable=""]{-webkit-user-select:text!important;user-select:text!important;-webkit-touch-callout:default!important}@media print{body{display:none!important}}</style></head>
<body>
<div class="toolbar"><button onclick="history.back()">← ফিরে যান</button><button onclick="downloadDocx()">📝 DOCX ডাউনলোড</button><button onclick="downloadPDF()">PDF ডাউনলোড</button><button onclick="window.print()">প্রিন্ট</button></div>
<p id="status" style="text-align:center">উত্তরপত্র লোড হচ্ছে…</p>
<main class="paper"><header class="head"><h2 id="title">পরীক্ষার্থীর উত্তরপত্র</h2><div class="meta"><span id="student"></span><span id="score"></span><span id="submitted"></span></div></header><section id="questions" class="questions"></section></main>
<script src="js/supabase.js"></script>
<script>
const $=id=>document.getElementById(id),BN='০১২৩৪৫৬৭৮৯',LET={A:'ক',B:'খ',C:'গ',D:'ঘ'};
const bn=x=>String(x??'').replace(/\d/g,d=>BN[+d]);
const esc=x=>String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
let data=null;
async function init(){
 try{
  const session=await db.auth.getSession();if(!session.data.session){location.href='admin.html';return}
  const id=Number(new URLSearchParams(location.search).get('attempt'));if(!id)throw Error('Attempt ID পাওয়া যায়নি।');
  const ar=await db.from('exam_attempts').select('id,exam_id,student_id,score,total_questions,submitted_at').eq('id',id).single();if(ar.error)throw ar.error;
  const a=ar.data;
  const [er,sr,cr,ansr]=await Promise.all([
   db.from('exams').select('id,exam_name').eq('id',a.exam_id).single(),
   db.from('students').select('id,name,facebook_name,district').eq('id',a.student_id).single(),
   db.from('exam_settings').select('total_marks,marks_per_question,show_answers').eq('exam_id',a.exam_id).maybeSingle(),
   db.from('attempt_answers').select('id,question_id,selected_option,is_correct,marks_awarded,exam_question_id').eq('attempt_id',id).order('id',{ascending:true})
  ]);
  for(const r of [er,sr,cr,ansr])if(r.error)throw r.error;
  if(cr.data?.show_answer_paper===false)throw Error('এই পরীক্ষার সেটিংসে উত্তরপত্র দেখার অনুমতি নেই।');
  const answers=ansr.data||[];
  const itemIds=[...new Set(answers.map(x=>x.exam_question_id).filter(x=>x!=null))];
  const qids=[...new Set(answers.map(x=>x.question_id).filter(x=>x!=null))];
  let items=[],source=[];
  if(itemIds.length){const r=await db.from('exam_question_items').select('id,source_question_id,question_order,question_text,option_a,option_b,option_c,option_d,correct_answer,explanation,marks').in('id',itemIds);if(r.error)throw r.error;items=r.data||[]}
  if(qids.length){const r=await db.from('questions').select('id,question_text,option_a,option_b,option_c,option_d,correct_answer,explanation').in('id',qids);if(r.error)throw r.error;source=r.data||[]}
  const itemMap=new Map(items.map(x=>[String(x.id),x])),sourceMap=new Map(source.map(x=>[String(x.id),x]));
  data={exam:er.data,student:sr.data,settings:cr.data||{},attempt:a,questions:answers.map((aa,i)=>{
   const it=itemMap.get(String(aa.exam_question_id)),q=sourceMap.get(String(aa.question_id));
   const base=it||q||{};
   return {number:i+1,question_text:base.question_text||'প্রশ্নের লেখা পাওয়া যায়নি',option_a:base.option_a||'',option_b:base.option_b||'',option_c:base.option_c||'',option_d:base.option_d||'',correct_answer:String(base.correct_answer||q?.correct_answer||'').trim().toUpperCase().charAt(0),explanation:base.explanation||q?.explanation||'',selected_option:String(aa.selected_option||'').trim().toUpperCase().charAt(0),is_correct:!!aa.is_correct,marks_awarded:aa.marks_awarded,question_marks:base.marks};
  })};
  render();
 }catch(e){$('status').textContent='উত্তরপত্র লোড হয়নি: '+(e.message||e);$('status').style.color='#b42318'}
}
function render(){
 const d=data,a=d.attempt,st=d.student,exam=d.exam,revealAnswers=d.settings.show_answers!==false;
 $('title').textContent=exam.exam_name+' — উত্তরপত্র';
 document.title=exam.exam_name+' — '+(st.name||'শিক্ষার্থী')+' — উত্তরপত্র';
 $('student').textContent='শিক্ষার্থী: '+(st.name||'—')+(st.facebook_name?' | '+st.facebook_name:'');
 const total=Number(d.settings.total_marks)>0?Number(d.settings.total_marks):Number(a.total_questions)*(Number(d.settings.marks_per_question)||1);
 $('score').textContent='নম্বর: '+bn(a.score)+' / '+bn(total);
 $('submitted').textContent='জমা: '+(a.submitted_at?new Intl.DateTimeFormat('bn-BD',{dateStyle:'short',timeStyle:'short'}).format(new Date(a.submitted_at)):'—');
 $('questions').innerHTML=d.questions.map(q=>{
  const opts=['A','B','C','D'].map(k=>{const selected=q.selected_option===k,correct=revealAnswers&&q.correct_answer===k;let cls='opt';if(selected)cls+=' selected';if(correct)cls+=' correct';return '<div class="'+cls+'"><b>'+LET[k]+'.</b> '+esc(q['option_'+k.toLowerCase()])+'</div>'}).join('');
  const selectedText=q.selected_option?LET[q.selected_option]+'. '+esc(q['option_'+q.selected_option.toLowerCase()]||''):'উত্তর দেওয়া হয়নি';const correctText=revealAnswers?(q.correct_answer?LET[q.correct_answer]+'. '+esc(q['option_'+q.correct_answer.toLowerCase()]||''):'—'):'';const awarded=q.marks_awarded==null?'—':bn(q.marks_awarded);const exp=revealAnswers&&q.explanation?'<div class="expl"><b>ব্যাখ্যা:</b> '+esc(q.explanation)+'</div>':'';return '<article class="q"><div class="qt">'+bn(q.number)+'. '+esc(q.question_text)+'</div>'+opts+'<div class="detail"><b>আপনার উত্তর:</b> '+selectedText+(revealAnswers?'<br><b>সঠিক উত্তর:</b> '+correctText:'')+'<br><b>প্রাপ্ত নম্বর:</b> '+awarded+'</div>'+exp+'</article>';
 }).join('');
 $('status').textContent='উত্তরপত্র প্রস্তুত';
}
function print(){window.print()}
async function loadScript(src){return new Promise((resolve,reject)=>{const s=document.createElement('script');s.src=src;s.onload=resolve;s.onerror=reject;document.head.appendChild(s)})}
async function downloadPDF(){try{if(!window.html2canvas)await loadScript('https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js');if(!window.jspdf)await loadScript('https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js');const canvas=await html2canvas(document.querySelector('.paper'),{scale:2,backgroundColor:'#ffffff'});const{jsPDF}=window.jspdf;const pdf=new jsPDF('p','mm','a4');const pageH=Math.floor(canvas.width*297/210);let y=0,n=0;while(y<canvas.height){const h=Math.min(pageH,canvas.height-y),slice=document.createElement('canvas');slice.width=canvas.width;slice.height=h;slice.getContext('2d').drawImage(canvas,0,y,canvas.width,h,0,0,canvas.width,h);if(n)pdf.addPage();pdf.addImage(slice.toDataURL('image/png'),'PNG',0,0,210,h*210/canvas.width);y+=h;n++}pdf.save((document.title||'answer-paper')+'.pdf')}catch(e){alert('PDF তৈরি করা যায়নি: '+e.message)}}
async function downloadDocx(){try{if(!data)return;const{Document,Packer,Paragraph,TextRun,AlignmentType}=window.docx;const d=data,children=[new Paragraph({text:d.exam.exam_name,heading:'Heading1',alignment:AlignmentType.CENTER}),new Paragraph({text:'পরীক্ষার্থীর উত্তরপত্র',alignment:AlignmentType.CENTER}),new Paragraph({text:'শিক্ষার্থী: '+(d.student.name||'')+' | নম্বর: '+d.attempt.score,alignment:AlignmentType.CENTER})];d.questions.forEach(q=>{children.push(new Paragraph({spacing:{before:140,after:60},children:[new TextRun({text:bn(q.number)+'. '+q.question_text,bold:true})]}));['A','B','C','D'].forEach(k=>{const selected=q.selected_option===k,correct=revealAnswers&&q.correct_answer===k;children.push(new Paragraph({children:[new TextRun({text:LET[k]+'. '+(q['option_'+k.toLowerCase()]||'')+(selected?' [আপনার উত্তর]':'')+(correct?' ✓':''),bold:selected||correct})]}));});children.push(new Paragraph({text:'আপনার উত্তর: '+(q.selected_option?LET[q.selected_option]+'. '+(q['option_'+q.selected_option.toLowerCase()]||''):'দেওয়া হয়নি')+(revealAnswers?' | সঠিক উত্তর: '+(q.correct_answer?LET[q.correct_answer]+'. '+(q['option_'+q.correct_answer.toLowerCase()]||''):'—'):'')+' | প্রাপ্ত নম্বর: '+(q.marks_awarded??'—')}));if(revealAnswers&&q.explanation)children.push(new Paragraph({text:'ব্যাখ্যা: '+q.explanation}));});const doc=new Document({sections:[{properties:{page:{size:{width:11906,height:16838},margin:{top:720,right:720,bottom:720,left:720}},columns:{count:2,space:360}},children}]});const blob=await Packer.toBlob(doc),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=(document.title||'answer-paper')+'.docx';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}catch(e){alert('DOCX তৈরি করা যায়নি: '+e.message)}}
init();
</script><a class="direct-dashboard-nav" href="dashboard.html" aria-label="ড্যাশবোর্ডে ফিরে যান">🏠 ড্যাশবোর্ড</a><script id="site-copy-deterrent-script">(function(){function editable(t){return !!(t&&t.closest&&t.closest('input,textarea,select,[contenteditable="true"],[contenteditable=""]'))}document.addEventListener('contextmenu',function(e){if(!editable(e.target))e.preventDefault()});document.addEventListener('selectstart',function(e){if(!editable(e.target))e.preventDefault()});document.addEventListener('copy',function(e){if(!editable(e.target))e.preventDefault()});document.addEventListener('cut',function(e){if(!editable(e.target))e.preventDefault()});document.addEventListener('keydown',function(e){if(editable(e.target))return;var k=(e.key||'').toLowerCase();if((e.ctrlKey||e.metaKey)&&['c','x','u','s','p'].includes(k)){e.preventDefault();e.stopPropagation()}if(e.key==='PrintScreen')e.preventDefault()},true)})();</script></body></html>
