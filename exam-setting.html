<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>পরীক্ষার Settings</title><link rel="stylesheet" href="css/admin.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>.wrap{max-width:850px;margin:auto;padding:18px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.checks{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}.checks label{padding:10px;background:#f5f8fc;border-radius:8px}@media(max-width:650px){.grid2,.checks{grid-template-columns:1fr}}</style></head><body><main class="wrap"><div class="card"><h1>⚙️ পরীক্ষার Settings</h1><h2 id="title">লোড হচ্ছে...</h2><div class="grid2"><label>মোট প্রশ্ন<input id="totalQ" type="number"></label><label>মোট নম্বর<input id="totalMarks" type="number"></label><label>পাস নম্বর<input id="pass" type="number"></label><label>সময় (মিনিট)<input id="duration" type="number"></label><label>প্রতি প্রশ্নের নম্বর<input id="marks" type="number" step="0.01"></label><label>Negative Mark<input id="negative" type="number" step="0.01"></label><label>পরীক্ষকের নাম<input id="examiner"></label><label>Exam Date<input id="examDate" type="date"></label><label>Start Time<input id="startTime" type="time"></label><label>End Date<input id="endDate" type="date"></label><label>End Time<input id="endTime" type="time"></label></div><label>সিলেবাস<textarea id="syllabus"></textarea></label><div class="checks"><label><input id="showAnswers" type="checkbox"> শিক্ষার্থীকে উত্তর দেখাবে</label><label><input id="multiple" type="checkbox"> Multiple Attempt</label><label><input id="device" type="checkbox"> Device Protection</label><label><input id="randomQ" type="checkbox"> Random Questions</label><label><input id="randomO" type="checkbox"> Random Options</label><label><input id="showResult" type="checkbox"> Result দেখাবে</label><label><input id="showRank" type="checkbox"> Position/Rank দেখাবে</label></div><label>Thank-you Message<textarea id="thankYou"></textarea></label><div class="grid2"><label>Facebook Page URL<input id="fbPage"></label><label>Facebook Group URL<input id="fbGroup"></label></div><label>Question Display<select id="displayMode"><option value="all">সব প্রশ্ন একসাথে</option><option value="single">একটি করে প্রশ্ন</option></select></label><button id="save">Settings Save</button><button class="secondary" onclick="location.href='exam-manager.html'">← পরীক্ষা পরিচালনায় ফিরুন</button><p id="msg" class="msg"></p></div></main><script src="js/supabase.js"></script><script src="js/exam-setting.js"></script></body></html>
