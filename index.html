<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ফেসবুক পাঠশালা — পরীক্ষা</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,"Noto Sans Bengali",sans-serif;background:#f5f7fb;color:#172033;line-height:1.55}header{background:#173b72;color:#fff;padding:16px 20px;text-align:center}main{max-width:900px;margin:24px auto;padding:0 14px}.card{background:#fff;border-radius:14px;padding:20px;margin-bottom:18px;box-shadow:0 3px 14px #00000012}h1,h2,h3{margin-top:0}label{display:block;font-weight:700;margin:12px 0 6px}input,select,button{font:inherit}input,select{width:100%;padding:11px;border:1px solid #ccd3df;border-radius:8px;background:#fff}button{border:0;border-radius:8px;padding:11px 16px;cursor:pointer;font-weight:700}.primary{background:#1769e0;color:#fff}.muted{color:#687386}.hidden{display:none!important}.exam-card{cursor:pointer;border:2px solid transparent}.exam-card:hover{border-color:#1769e0}.meta{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}.tag{background:#eef3fb;padding:4px 9px;border-radius:20px;font-size:13px}.question{padding:16px 0;border-bottom:1px solid #e6e9ef}.question:last-child{border-bottom:0}.qtext{font-weight:800;margin-bottom:12px}.option{display:block;padding:11px 12px;border:1px solid #d9dee8;border-radius:9px;margin:8px 0;background:#fff;cursor:pointer}.option:hover{background:#f5f8ff}.option input{width:auto;margin-right:8px}.topbar{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}.timer{font-size:20px;font-weight:800;color:#b42318}.progress{height:8px;background:#e7ebf2;border-radius:99px;overflow:hidden;margin:10px 0 16px}.progress>div{height:100%;background:#1769e0;width:0}.result-score{font-size:28px;font-weight:900}.review-item{border:1px solid #dfe4ec;border-left:5px solid #64748b;border-radius:10px;padding:14px;margin:14px 0}.review-correct{border-left-color:#16a34a}.review-wrong{border-left-color:#dc2626}.review-options{margin-top:12px}.review-option{padding:10px 12px;margin:7px 0;border-radius:8px;background:#fff;border:1px solid #e5e7eb;line-height:1.5}.review-option.selected{border:2px solid #2563eb;background:#eff6ff}.review-option.correct-answer{border:2px solid #16a34a;background:#f0fdf4}.review-option.selected.wrong-answer{border:2px solid #dc2626;background:#fef2f2}.review-option-label{font-weight:800}.review-badge{font-size:12px;font-weight:800;margin-left:6px}.notice{padding:11px 13px;background:#fff7d6;border-radius:8px;border:1px solid #f0d66b}.fb{display:block;background:#1877f2;color:#fff;text-decoration:none;text-align:center;padding:13px;border-radius:9px;font-weight:800;margin-top:10px}
</style>
</head>
<body>
<header><h2>ফেসবুক পাঠশালা</h2></header>
<main>
<section id="startCard" class="card">
<h1>অনলাইন পরীক্ষা</h1><div id="examList"></div>
<div id="studentForm" class="hidden"><h2 id="examTitle"></h2><div id="examInfo" class="meta"></div>
<label>আপনার নাম</label><input id="name" autocomplete="name"><label>ফেসবুক নাম</label><input id="facebookName"><label>জেলা</label><input id="district"><label>মোবাইল নম্বর</label><input id="mobile" inputmode="tel"><br><br><button id="startBtn" class="primary">পরীক্ষা শুরু করুন</button></div>
</section>
<section id="examCard" class="card hidden"><div class="topbar"><h2 id="liveTitle"></h2><div class="timer" id="timer"></div></div><div class="progress"><div id="progressBar"></div></div><div id="questions"></div><button id="submitBtn" class="primary">পরীক্ষা জমা দিন</button></section>
<section id="resultCard" class="card hidden"><h2 id="resultTitle"></h2><div id="resultBody"></div><div id="review"></div></section>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL="https://ydvbnalhcnfqpxkkmywr.supabase.co";
const SUPABASE_KEY="sb_publishable_xCbSWDkASsbUPl-WmygyMw_eVrJY_9a";
const supabaseClient=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const BN="০১২৩৪৫৬৭৮৯",optionLetters={A:"ক",B:"খ",C:"গ",D:"ঘ"};
let exam=null,settings={question_display_mode:"all",random_questions:false,random_options:false,show_answers:false,show_result:true,show_rank:true};
let questions=[],answers={},optionMaps={},student={},remaining=0,timerHandle=null,resultData=null;
function bn(n){return String(n).replace(/\d/g,d=>BN[d])}function esc(v){return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function getParam(){return new URLSearchParams(location.search).get("exam")}
async function load(){const id=getParam();if(id){await loadExam(id);return}const {data,error}=await supabaseClient.from("exams").select("*").eq("is_active",true).order("id",{ascending:false});if(error){document.getElementById("examList").innerHTML='<div class="notice">পরীক্ষার তালিকা লোড করা যায়নি।</div>';return}if(!data?.length){document.getElementById("examList").innerHTML='<div class="muted">কোনো সক্রিয় পরীক্ষা পাওয়া যায়নি।</div>';return}document.getElementById("examList").innerHTML=data.map(e=>`<div class="card exam-card" data-id="${e.id}"><h3>${esc(e.title||e.name||"পরীক্ষা")}</h3><div class="muted">${esc(e.description||"পরীক্ষায় অংশ নিতে ক্লিক করুন।")}</div></div>`).join("");document.querySelectorAll(".exam-card").forEach(x=>x.onclick=()=>location.href="?exam="+x.dataset.id)}
async function loadExam(id){const {data:e,error}=await supabaseClient.from("exams").select("*").eq("id",id).maybeSingle();if(error||!e){document.getElementById("examList").innerHTML='<div class="notice">পরীক্ষাটি পাওয়া যায়নি।</div>';return}exam=e;const {data:s}=await supabaseClient.from("exam_settings").select("*").eq("exam_id",exam.id).maybeSingle();settings={...settings,...(s||{})};document.getElementById("examList").classList.add("hidden");document.getElementById("studentForm").classList.remove("hidden");document.getElementById("examTitle").textContent=exam.title||exam.name||"পরীক্ষা";document.getElementById("examInfo").innerHTML=[settings.total_questions?`প্রশ্ন: ${bn(settings.total_questions)}`:"",settings.duration_minutes?`সময়: ${bn(settings.duration_minutes)} মিনিট`:"",settings.total_marks?`পূর্ণমান: ${bn(settings.total_marks)}`:""].filter(Boolean).map(x=>`<span class="tag">${x}</span>`).join("")}
async function start(){student={name:document.getElementById("name").value.trim(),facebookName:document.getElementById("facebookName").value.trim(),district:document.getElementById("district").value.trim(),mobile:document.getElementById("mobile").value.trim()};if(!student.name){alert("আপনার নাম লিখুন।");return}const {data,error}=await supabaseClient.rpc("get_public_exam_questions",{p_exam_id:exam.id});if(error||!data?.length){alert("প্রশ্ন লোড করা যায়নি।");return}questions=data.map(q=>({...q}));if(settings.random_questions)questions=shuffle(questions);optionMaps={};questions.forEach(q=>{let arr=["A","B","C","D"];if(settings.random_options)arr=shuffle(arr);optionMaps[q.id]=arr});answers={};document.getElementById("startCard").classList.add("hidden");document.getElementById("examCard").classList.remove("hidden");document.getElementById("liveTitle").textContent=exam.title||exam.name||"পরীক্ষা";renderQuestions();remaining=(Number(settings.duration_minutes)||20)*60;updateTimer();timerHandle=setInterval(()=>{remaining--;updateTimer();if(remaining<=0){clearInterval(timerHandle);submit(true)}},1000)}
function updateTimer(){const m=Math.max(0,Math.floor(remaining/60)),s=Math.max(0,remaining%60);document.getElementById("timer").textContent=`সময়: ${bn(String(m).padStart(2,"0"))}:${bn(String(s).padStart(2,"0"))}`}
function renderQuestions(){const box=document.getElementById("questions");box.innerHTML=questions.map((q,i)=>{const opts=optionMaps[q.id]||["A","B","C","D"];return `<section class="question" data-q="${q.id}"><div class="qtext">${bn(i+1)}. ${esc(q.question_text)}</div><div>${opts.map(k=>`<label class="option"><input type="radio" name="q_${q.id}" value="${k}"> ${optionLetters[k]}. ${esc(q["option_"+k.toLowerCase()])}</label>`).join("")}</div></section>`}).join("");box.querySelectorAll("input[type=radio]").forEach(r=>r.onchange=()=>{answers[r.name.slice(2)]=r.value;const done=Object.keys(answers).length;document.getElementById("progressBar").style.width=(done/questions.length*100)+"%"})}
function buildAttemptReview(){return questions.map(q=>{const map=(optionMaps[q.id]||["A","B","C","D"]).slice(),selected=String(answers[q.id]||"").toUpperCase(),correct=String(q.correct_answer||"").toUpperCase();return{question_id:q.id,question_text:q.question_text,options:map.map((originalLetter,displayIndex)=>({display_letter:optionLetters[String.fromCharCode(65+displayIndex)],original_letter:originalLetter,text:q["option_"+originalLetter.toLowerCase()]||"",selected:originalLetter===selected,correct:originalLetter===correct})),selected_option:selected||null,correct_option:correct||null,selected_text:selected?(q["option_"+selected.toLowerCase()]||""):null,correct_text:correct?(q["option_"+correct.toLowerCase()]||""):"",explanation:q.explanation||"",is_correct:!!selected&&selected===correct}})}
function saveAttemptViewLocal(attemptId){try{localStorage.setItem("mcq_attempt_view_"+attemptId,JSON.stringify({question_order:questions.map(q=>q.id),option_maps:optionMaps,review:buildAttemptReview()}))}catch(_){} }
async function persistAttemptView(attemptId){saveAttemptViewLocal(attemptId);try{await supabaseClient.from("exam_attempts").update({question_order:questions.map(q=>q.id),option_maps:optionMaps}).eq("id",attemptId)}catch(_){} }
async function submit(auto=false){if(timerHandle)clearInterval(timerHandle);if(!auto&&!confirm("আপনি কি পরীক্ষা জমা দিতে চান?")){timerHandle=setInterval(()=>{remaining--;updateTimer();if(remaining<=0){clearInterval(timerHandle);submit(true)}},1000);return}const payload=questions.map(q=>({question_id:q.id,selected_option:answers[q.id]||null}));const rpc=await supabaseClient.rpc("submit_exam",{p_exam_id:exam.id,p_name:student.name,p_facebook_name:student.facebookName,p_district:student.district,p_mobile:student.mobile,p_device_token:localStorage.getItem("mcq_device_token")||null,p_answers:payload});if(rpc.error){alert("পরীক্ষা জমা দেওয়া যায়নি: "+rpc.error.message);return}resultData=rpc.data||{};resultData.review=buildAttemptReview();if(resultData.attempt_id)await persistAttemptView(resultData.attempt_id);await showResult()}
async function showResult(){document.getElementById("examCard").classList.add("hidden");document.getElementById("resultCard").classList.remove("hidden");document.getElementById("resultTitle").textContent=exam.title||exam.name||"পরীক্ষার ফলাফল";let score=Number(resultData.score||0),total=Number(resultData.total_questions||questions.length||0),answered=Object.keys(answers).length,correct=resultData.correct_answers;if(correct==null)correct=resultData.review.filter(x=>x.is_correct).length;let pct=total?score/(Number(settings.marks_per_question)||1)/total*100:0;let html=`<div class="result-score">প্রাপ্ত নম্বর: ${bn(score.toFixed(2))}</div><p>মোট প্রশ্ন: ${bn(total)} &nbsp; | &nbsp; উত্তর দিয়েছেন: ${bn(answered)} &nbsp; | &nbsp; সঠিক: ${bn(correct)}</p><p>শতকরা: ${bn(pct.toFixed(0))}%</p>`;if(settings.thank_you_message)html+=`<div class="notice">${esc(settings.thank_you_message)}</div>`;if(settings.show_rank!==false&&resultData.rank)html+=`<p><b>বর্তমান অবস্থান: ${bn(resultData.rank)}</b></p>`;document.getElementById("resultBody").innerHTML=html;if(settings.show_answers===true)renderReview(resultData.review);if(settings.facebook_group_url||settings.facebook_page_url){const r=document.getElementById("resultBody");if(settings.facebook_group_url)r.insertAdjacentHTML("beforeend",`<a class="fb" href="${esc(settings.facebook_group_url)}" target="_blank" rel="noopener">📘 ফেসবুক গ্রুপে যোগ দিন</a>`);if(settings.facebook_page_url)r.insertAdjacentHTML("beforeend",`<a class="fb" href="${esc(settings.facebook_page_url)}" target="_blank" rel="noopener">📘 ফেসবুক পেজ দেখুন</a>`)}}
function renderReview(items){const box=document.getElementById("review");box.classList.remove("hidden");box.innerHTML=`<h3>📋 আপনার উত্তরপত্র ও সঠিক উত্তর</h3><p><b>পরীক্ষার সময় আপনি যে প্রশ্নের ক্রম ও অপশন দেখেছিলেন, সেই ক্রমেই উত্তরপত্র দেখানো হচ্ছে।</b></p><p class="muted">সবুজ = সঠিক উত্তর, নীল = আপনার নির্বাচিত উত্তর, লাল = ভুল নির্বাচিত উত্তর।</p>`;(items||[]).forEach((r,i)=>{const div=document.createElement("div");div.className="review-item "+(r.is_correct?"review-correct":"review-wrong");const optionsHtml=(r.options||[]).map(o=>{const classes=["review-option",o.correct?"correct-answer":"",o.selected?"selected":"",o.selected&&!o.correct?"wrong-answer":""].filter(Boolean).join(" ");const badges=[];if(o.selected)badges.push(`<span class="review-badge">${o.correct?"আপনার উত্তর ✓":"আপনার উত্তর"}</span>`);if(o.correct)badges.push(`<span class="review-badge">সঠিক উত্তর ✓</span>`);return `<div class="${classes}"><span class="review-option-label">${esc(o.display_letter)}.</span> ${esc(o.text)} ${badges.join(" ")}</div>`}).join("");div.innerHTML=`<div class="qtext">${bn(i+1)}. ${esc(r.question_text)}</div><div class="review-options">${optionsHtml}</div>${r.explanation?`<div class="notice"><b>ব্যাখ্যা:</b> ${esc(r.explanation)}</div>`:""}`;box.appendChild(div)})}
document.getElementById("startBtn").onclick=start;document.getElementById("submitBtn").onclick=()=>submit(false);load();
</script></body></html>
