<!doctype html><html lang="bn"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ফেইসবুক পাঠশালা — পরীক্ষা</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,"Noto Sans Bengali",sans-serif;background:#f4f7fb;color:#172033}.top{background:linear-gradient(135deg,#0f3d91,#2563eb);color:#fff;padding:18px 16px}.topbar,.wrap{max-width:900px;margin:auto}.brand{font-size:24px;font-weight:800}.slogan{font-size:13px;margin-top:4px}.wrap{padding:20px 14px}.card{background:#fff;border:1px solid #e2e8f0;border-radius:18px;padding:20px;box-shadow:0 5px 20px #0000000d;margin-top:16px}.hidden{display:none!important}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}input{width:100%;padding:12px;border:1px solid #cbd5e1;border-radius:11px;font-size:15px}.btn{display:inline-block;border:0;background:#2563eb;color:#fff;padding:11px 16px;border-radius:11px;font-weight:800;text-decoration:none;cursor:pointer;margin-top:12px}.full{width:100%}.secondary{background:#e8eef8;color:#172033}.error{background:#fee2e2;color:#991b1b;padding:12px;border-radius:10px}.status{background:#f1f5f9;padding:12px;border-radius:10px;margin-top:12px}.progress{display:flex;justify-content:space-between}.timer{font-size:21px;font-weight:900;color:#b91c1c}.question{font-size:20px;font-weight:800;line-height:1.6}.option{display:block;border:1px solid #dbe3ef;border-radius:12px;padding:13px;margin:9px 0;cursor:pointer}.option input{width:auto}.resultScore{text-align:center;font-size:34px;font-weight:900;color:#2563eb}.resultGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.resultBox{background:#f8fafc;border-radius:12px;padding:13px;text-align:center}.thankYou{background:#eff6ff;border:1px solid #bfdbfe;border-radius:12px;padding:14px;text-align:center;margin:12px 0}.socialLinks{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:10px 0}.reviewItem{border:1px solid #e2e8f0;border-radius:12px;padding:13px;margin-top:10px}.correct{color:#166534}.wrong{color:#b91c1c}@media(max-width:600px){.grid,.resultGrid{grid-template-columns:1fr}}footer{text-align:center;color:#94a3b8;font-size:12px;padding:15px}</style></head><body><header class="top"><div class="topbar"><div class="brand">📚 ফেইসবুক পাঠশালা</div><div class="slogan">তোমার জ্ঞানের আলোয় আলোকিত হোক চারপাশ</div></div></header><main class="wrap"><section id="startPage" class="card hidden"><a href="exam-list.html">← পরীক্ষার তালিকায় ফিরুন</a><h2 id="examName">পরীক্ষা</h2><div class="grid"><div>প্রশ্ন: <b id="totalQ">০</b></div><div>মোট নম্বর: <b id="totalM">০</b></div><div>সময়: <b id="duration">২০ মিনিট</b></div></div><hr><div class="grid"><div><label>নাম</label><input id="sName"></div><div><label>ফেইসবুক আইডির নাম</label><input id="sFb"></div><div><label>জেলা</label><input id="sDistrict"></div><div><label>মোবাইল নম্বর</label><input id="sMobile" inputmode="numeric"></div></div><button class="btn full" onclick="startExam()">পরীক্ষা শুরু করুন</button><div id="startStatus"></div></section><section id="examPage" class="card hidden"><div class="progress"><b id="progress">প্রশ্ন ১ / ১</b><span class="timer" id="timer">20:00</span></div><hr><div id="question" class="question"></div><div id="options"></div><div style="display:flex;justify-content:space-between;gap:8px"><button id="prevBtn" class="btn secondary" onclick="prevQ()">← পূর্বের</button><button id="nextBtn" class="btn" onclick="nextQ()">পরের →</button><button id="submitBtn" class="btn hidden" onclick="submitExam(false)">পরীক্ষা জমা দিন</button></div></section><section id="resultPage" class="card hidden"><h2>🎉 পরীক্ষা সম্পন্ন</h2><p id="resultMessage"></p><div id="thankYou" class="thankYou hidden"></div><div id="socialLinks" class="socialLinks hidden"></div><div id="score" class="resultScore">০ / ০</div><div class="resultGrid"><div class="resultBox">প্রাপ্ত নম্বর<br><b id="marks">০</b></div><div class="resultBox">শতকরা<br><b id="percentage">০%</b></div><div class="resultBox">অবস্থান<br><b id="rank">—</b> / <span id="rankTotal">—</span></div></div><p id="passStatus"></p><div id="review"></div><a class="btn" href="exam-list.html">অন্য পরীক্ষা দেখুন</a></section></main><footer>© ফেইসবুক পাঠশালা</footer><script>const sb=supabase.createClient("https://ydvbnalhcnfqpxkkmywr.supabase.co","sb_publishable_xCbSWDkASsbUPl-WmygyMw_eVrJY_9a"),BN="০১২৩৪৫৬৭৮৯",LET={A:"ক",B:"খ",C:"গ",D:"ঘ"};let questions=[],answers={},idx=0,time=0,timer=null,current=null,settings=null;const bn=x=>String(x??"").replace(/\d/g,d=>BN[d]),esc=x=>String(x??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[m]));function idFromUrl(){const m=location.search.match(/[?&]exam=(\d+)/);return m?Number(m[1]):null}function savedResultKey(id){return "fp_result_"+id}function saveResultToken(id,token){if(token)localStorage.setItem(savedResultKey(id),String(token))}function getSavedResultToken(id){return localStorage.getItem(savedResultKey(id))}async function showPreviousResult(token){const st=document.getElementById("startStatus");try{st.className="status";st.textContent="আগের ফলাফল ও উত্তরপত্র লোড হচ্ছে...";const r=await sb.rpc("get_attempt_review",{p_result_token:token});if(r.error)throw r.error;if(!r.data||!Array.isArray(r.data.review))throw new Error("আগের ফলাফল পাওয়া যায়নি।");startPage.classList.add("hidden");resultPage.classList.remove("hidden");resultMessage.textContent="📌 আপনি এই পরীক্ষাটি আগে দিয়েছেন। নিচে আপনার আগের ফলাফল ও উত্তরপত্র দেখানো হচ্ছে।";const total=Number(settings?.total_marks||current.total_questions||r.data.total_questions||0);score.textContent=bn(r.data.score??0)+" / "+bn(total);marks.textContent=bn(r.data.score??0);percentage.textContent=bn(total?Math.round(Number(r.data.score||0)/total*100):0)+"%";rank.textContent="—";rankTotal.textContent="—";passStatus.textContent=settings?.pass_mark!=null?((Number(r.data.score||0)>=Number(settings.pass_mark)?"✅ উত্তীর্ণ":"❌ অনুত্তীর্ণ")+" — পাস নম্বর "+bn(settings.pass_mark)):"";renderThankYou(false);renderSocialLinks();renderReview(r.data.review);return true}catch(e){localStorage.removeItem(savedResultKey(current.id));st.className="status";st.textContent="";return false}}async function loadExam(id){try{const a=await sb.from("exams").select("*").eq("id",id).eq("status","active").maybeSingle();if(a.error)throw a.error;if(!a.data)throw new Error("পরীক্ষাটি পাওয়া যায়নি বা সক্রিয় নয়।");const b=await sb.from("exam_settings").select("*").eq("exam_id",id).maybeSingle();if(b.error)throw b.error;current=a.data;settings=b.data||{};document.getElementById("startPage").classList.remove("hidden");examName.textContent=current.exam_name||"পরীক্ষা";totalQ.textContent=bn(settings.total_questions||current.total_questions||0);totalM.textContent=bn(settings.total_marks||0);duration.textContent=bn(settings.duration_minutes||20)+" মিনিট";const token=getSavedResultToken(id);if(token&&settings.multiple_attempts!==true){await showPreviousResult(token)}}catch(e){document.querySelector("main").innerHTML='<div class="card error">❌ '+esc(e.message||"পরীক্ষাটি লোড করা যায়নি।")+'</div>'}}async function startExam(){const name=sName.value.trim(),fb=sFb.value.trim(),district=sDistrict.value.trim(),mobile=sMobile.value.trim(),st=document.getElementById("startStatus");if(!name||!fb||!district||!/^(01[3-9]\d{8})$/.test(mobile)){st.className="status error";st.textContent="নাম, ফেইসবুক আইডির নাম, জেলা ও সঠিক ১১ সংখ্যার মোবাইল দিন।";return}st.className="status";st.textContent="প্রশ্নপত্র লোড হচ্ছে...";try{const r=await sb.rpc("get_public_exam_questions",{p_exam_id:current.id});if(r.error)throw r.error;if(!Array.isArray(r.data)||!r.data.length)throw new Error("এই পরীক্ষায় কোনো প্রশ্ন পাওয়া যায়নি।");questions=r.data;answers={};idx=0;time=Number(settings.duration_minutes||20)*60;startPage.classList.add("hidden");examPage.classList.remove("hidden");renderQ();clearInterval(timer);timer=setInterval(()=>{time--;renderTimer();if(time<=0)submitExam(true)},1000)}catch(e){st.className="status error";st.textContent="❌ প্রশ্নপত্র লোড হয়নি: "+(e.message||"অজানা সমস্যা")}}function renderTimer(){const timerEl=document.getElementById("timer");timerEl.textContent=String(Math.max(0,Math.floor(time/60))).padStart(2,"0")+":"+String(Math.max(0,time%60)).padStart(2,"0")}function renderQ(){const q=questions[idx];progress.textContent=`প্রশ্ন ${bn(idx+1)} / ${bn(questions.length)}`;question.textContent=q.question_text||"";options.innerHTML=["A","B","C","D"].map(k=>`<label class="option"><input type="radio" name="ans" value="${k}" ${answers[q.id]===k?"checked":""} onchange="answers[${q.id}]=this.value"><b>${LET[k]}.</b> ${esc(q["option_"+k.toLowerCase()])}</label>`).join("");prevBtn.disabled=idx===0;nextBtn.classList.toggle("hidden",idx===questions.length-1);submitBtn.classList.toggle("hidden",idx!==questions.length-1);renderTimer()}function prevQ(){if(idx>0){idx--;renderQ()}}function nextQ(){if(idx<questions.length-1){idx++;renderQ()}}async function submitExam(auto){clearInterval(timer);submitBtn.disabled=true;try{const payload={};questions.forEach(q=>{if(answers[q.id])payload[String(q.id)]=answers[q.id]});const deviceToken=localStorage.getItem("fp_device")||crypto.randomUUID();localStorage.setItem("fp_device",deviceToken);const r=await sb.rpc("submit_exam",{p_exam_id:current.id,p_name:sName.value.trim(),p_facebook_name:sFb.value.trim(),p_district:sDistrict.value.trim(),p_mobile:sMobile.value.trim(),p_device_token:deviceToken,p_answers:payload});if(r.error)throw r.error;if(!r.data?.success)throw new Error(r.data?.message||"পরীক্ষা জমা হয়নি।");const resultToken=r.data?.result_token||r.data?.resultToken||r.data?.token;if(resultToken)saveResultToken(current.id,resultToken);examPage.classList.add("hidden");resultPage.classList.remove("hidden");resultMessage.textContent=auto?"⏰ সময় শেষ হওয়ায় পরীক্ষা জমা হয়েছে।":"🎉 আপনার পরীক্ষা সফলভাবে জমা হয়েছে।";score.textContent=bn(r.data.score??0)+" / "+bn(r.data.total_marks??settings.total_marks??questions.length);marks.textContent=bn(r.data.marks_awarded??r.data.score??0);percentage.textContent=bn(Math.round(Number(r.data.percentage??0)))+"%";rank.textContent=bn(r.data.rank??"—");rankTotal.textContent=bn(r.data.rank_total??r.data.total_participants??"—");passStatus.textContent=r.data.pass_mark?((Number(r.data.pass_mark)<=Number(r.data.score)?"✅ উত্তীর্ণ":"❌ অনুত্তীর্ণ")+" — পাস নম্বর "+bn(r.data.pass_mark)):"";renderThankYou(auto);renderSocialLinks();renderReview(r.data.review||[])}catch(e){alert(e.message||"পরীক্ষা জমা দিতে সমস্যা হয়েছে।");submitBtn.disabled=false}}function renderThankYou(auto){const el=document.getElementById("thankYou");el.classList.remove("hidden");el.innerHTML="<div>🙏 পরীক্ষায় অংশগ্রহণ করার জন্য ধন্যবাদ।</div>"+(settings?.examiner_name?`<div style="margin-top:6px;font-weight:600">পরীক্ষক: ${esc(settings.examiner_name)}</div>`:"")+(auto?"<div style=\"margin-top:6px;font-weight:600\">⏰ সময় শেষ হওয়ায় আপনার উত্তরপত্র স্বয়ংক্রিয়ভাবে জমা হয়েছে।</div>":"")}function renderSocialLinks(){const box=document.getElementById("socialLinks"),links=[];if(settings?.facebook_page_url)links.push(`<a class="btn" href="${esc(settings.facebook_page_url)}" target="_blank" rel="noopener">📘 ফেইসবুক পেইজ</a>`);if(settings?.facebook_group_url)links.push(`<a class="btn" href="${esc(settings.facebook_group_url)}" target="_blank" rel="noopener">👥 ফেইসবুক গ্রুপে যোগ দিন</a>`);if(links.length){box.innerHTML=links.join("");box.classList.remove("hidden")}else{box.innerHTML="";box.classList.add("hidden")}}function renderReview(rows){if(!settings||settings.show_answers===false||!Array.isArray(rows)||!rows.length){review.innerHTML="";return}review.innerHTML='<h3>📝 উত্তর পর্যালোচনা</h3>'+rows.map((x,i)=>`<div class="reviewItem"><b>${bn(i+1)}. ${esc(x.question_text||"")}</b><div>আপনার উত্তর: <span class="${x.is_correct?"correct":"wrong"}">${x.selected_option?LET[x.selected_option]+". "+esc(x.selected_text||""):"দেওয়া হয়নি"}</span></div><div>সঠিক উত্তর: <span class="correct"><b>${x.correct_option?LET[x.correct_option]+". ":""}${esc(x.correct_text||"")}</b></span></div></div>`).join("")}const id=idFromUrl();if(id)loadExam(id);else location.replace("exam-list.html");</script></body></html>
