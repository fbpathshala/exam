<style>
*{box-sizing:border-box}body{margin:0;font-family:"Noto Sans Bengali",Arial,sans-serif;background:#f4f7fb;color:#172033}.top{background:linear-gradient(135deg,#0f3d91,#2563eb);color:#fff;padding:22px 16px;text-align:center}.top h1{margin:0;font-size:28px}.top p{margin:6px 0 0}.wrap{max-width:1050px;margin:22px auto;padding:0 14px}.card{background:#fff;border:1px solid #e2e8f0;border-radius:18px;padding:20px;box-shadow:0 8px 28px rgba(15,23,42,.07);margin-bottom:18px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.field{display:block;font-weight:700;margin:10px 0 6px}input,select,textarea{width:100%;padding:11px 12px;border:1px solid #cbd5e1;border-radius:10px;font-size:15px;background:#fff}textarea{min-height:90px;resize:vertical}.btn{border:0;border-radius:10px;padding:11px 15px;font-size:15px;cursor:pointer}.primary{background:#2563eb;color:#fff}.secondary{background:#e2e8f0;color:#172033}.danger{background:#dc2626;color:#fff}.success{background:#16a34a;color:#fff}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}.tab{background:#e8eef9;color:#17356f}.tab.active{background:#2563eb;color:#fff}.hidden{display:none!important}.muted{color:#64748b}.status{padding:11px 13px;border-radius:10px;margin-top:12px;background:#eff6ff;color:#1d4ed8}.status.error{background:#fef2f2;color:#b91c1c}.status.success{background:#f0fdf4;color:#15803d}.exam-item,.q-item{border:1px solid #e2e8f0;border-radius:12px;padding:14px;margin:9px 0}.exam-item{display:flex;justify-content:space-between;gap:12px;align-items:center}.question-row{display:grid;grid-template-columns:1fr 120px 120px 110px;gap:8px;align-items:start}.small{font-size:13px}.pill{display:inline-block;padding:4px 8px;border-radius:999px;background:#eef2ff;color:#3730a3;font-size:12px}.exam-info{background:#f8fbff;border:1px solid #dbeafe;border-radius:14px;padding:15px}.question{font-size:21px;font-weight:800;line-height:1.55;margin:20px 0}.option{display:flex;gap:9px;align-items:flex-start;padding:13px;border:1px solid #e2e8f0;border-radius:10px;margin:9px 0;background:#f8fafc}.option input{width:auto;margin-top:4px}.nav{display:flex;gap:10px;margin-top:18px}.nav .btn{flex:1}.result{text-align:center}.score{font-size:42px;font-weight:900;color:#2563eb}.resultgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.resultbox{background:#f8fafc;border-radius:10px;padding:13px}.resultbox strong{display:block;font-size:22px}.center{text-align:center}.csv-note{background:#fffbeb;border:1px solid #fde68a;border-radius:10px;padding:11px;margin-top:10px}.right{display:flex;justify-content:flex-end;gap:8px}@media(max-width:700px){.grid,.grid3,.question-row{grid-template-columns:1fr}.exam-item{display:block}.top h1{font-size:22px}}
 .syllabus-box{font-size:15px;line-height:1.6} </style>

<body><div class="wrap"><section id="studentApp" class="hidden">
<div class="card" id="startCard"><div class="exam-info"><h2 id="studentExamName">পরীক্ষা</h2><div id="studentSyllabus" class="syllabus-box" style="margin:12px 0;padding:12px;border-radius:10px;background:#f0f7ff;border:1px solid #cfe3ff"><b>📚 সিলেবাস</b><div id="sSyllabus" style="margin-top:6px">—</div></div><div class="grid3"><div><b>মোট প্রশ্ন</b><div id="sTotalQ">—</div></div><div><b>মোট নম্বর</b><div id="sTotalM">—</div></div><div><b>সময়</b><div id="sDuration">—</div></div></div></div>
<h3>পরীক্ষার্থী তথ্য</h3><label class="field">আপনার নাম</label><input id="sName"><label class="field">ফেইসবুক আইডির নাম</label><input id="sFb"><label class="field">জেলা</label><input id="sDistrict"><label class="field">মোবাইল নম্বর</label><input id="sMobile" inputmode="numeric" maxlength="11"><button class="btn primary" style="width:100%;margin-top:18px" onclick="startStudentExam()">🚀 পরীক্ষা শুরু করুন</button><div id="studentStatus"></div></div>
<div id="examCard" class="card hidden"><div class="syllabus-box" style="margin-bottom:12px;padding:10px;border-radius:10px;background:#f0f7ff;border:1px solid #cfe3ff"><b>📚 সিলেবাস:</b> <span id="paperSyllabus">—</span></div><div class="right"><span id="sProgress">প্রশ্ন</span><span id="sTimer" style="color:#dc2626;font-weight:800"></span></div><div id="sQuestion" class="question"></div><div id="sOptions"></div><div class="nav"><button id="prevStudentBtn" class="btn secondary" onclick="prevStudentQuestion()">← পূর্বের</button><button id="nextStudentBtn" class="btn primary" onclick="nextStudentQuestion()">পরের →</button><button id="sSubmit" class="btn success hidden" onclick="submitStudentExam(false)">জমা দিন</button></div></div>
<div id="studentResult" class="card result hidden"><h2>🎉 পরীক্ষা সম্পন্ন</h2><div class="score" id="rScore">—</div><div class="resultgrid"><div class="resultbox">প্রাপ্ত নম্বর<strong id="rMarks">—</strong></div><div class="resultbox">শতকরা<strong id="rPct">—</strong></div><div class="resultbox">অবস্থান<strong id="rRank">—</strong></div><div class="resultbox">মোট পরীক্ষার্থী<strong id="rTotal">—</strong></div></div><p id="rPass"></p></div>
</div><script>
const CFG=window.FACEBOOK_PATHSHALA_CONFIG; const client=supabase.createClient(CFG.SUPABASE_URL,CFG.SUPABASE_KEY);
const BN="০১২৩৪৫৬৭৮৯", LETTER={A:"ক",B:"খ",C:"গ",D:"ঘ"};
let draft=[],sstudentQuestions=[],studentAnswers={},studentIndex=0,studentTimer=null,studentTime=0,currentExam=null;
const SUBJECTS={1:"বাংলা সাহিত্য",2:"বাংলা ব্যাকরণ",3:"গণিত",4:"ইংরেজি সাহিত্য",5:"ইংরেজি ব্যাকরণ",6:"বাংলাদেশ",7:"আন্তর্জাতিক",8:"বিজ্ঞান",9:"কম্পিউটার ও তথ্য প্রযুক্তি",10:"ভূগোল",11:"সাম্প্রতিক প্রশ্নোত্তর"};
function bn(x){return String(x).replace(/\d/g,d=>BN[d])}
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function sourceLabel(v){return {verification_test:"যাচাই পরীক্ষা",job_solution:"জব সলিউশন",current_affairs:"সাম্প্রতিক প্রশ্নোত্তর"}[v]||v}
function getExamId(){const m=location.search.match(/[?&]exam=(\d+)/);return m?Number(m[1]):null}
async function doAdminLogin(){const email=loginEmail.value.trim(),password=loginPassword.value;loginStatus.textContent="প্রবেশ করা হচ্ছে...";const {error}=await client.auth.signInWithPassword({email,password});if(error){loginStatus.className="status error";loginStatus.textContent="❌ "+error.message}else{loginStatus.className="status success";loginStatus.textContent="সফল";await init()}}
async function logout(){await client.auth.signOut();location.reload()}
async function init(){const id=getExamId();if(id){await loadStudentExam(id)}else{studentStatus.textContent="পরীক্ষার লিংক পাওয়া যায়নি। সরাসরি পরীক্ষার লিংক ব্যবহার করুন।"}}
function showAdminTab(t){examTab.classList.toggle("hidden",t!=="exam");bankTab.classList.toggle("hidden",t!=="bank");tabExam.classList.toggle("active",t==="exam");tabBank.classList.toggle("active",t==="bank");if(t==="bank")loadBank()}
function addManualQuestion(){const q=manualQuestion.value.trim();if(!q||!manualA.value.trim()||!manualB.value.trim()||!manualC.value.trim()||!manualD.value.trim()){draftStatus.className="status error";draftStatus.textContent="প্রশ্ন ও চারটি অপশন পূরণ করুন।";return}draft.push({question_text:q,option_a:manualA.value.trim(),option_b:manualB.value.trim(),option_c:manualC.value.trim(),option_d:manualD.value.trim(),correct_answer:manualCorrect.value,subject_id:manualSubject.value?Number(manualSubject.value):null});manualQuestion.value=manualA.value=manualB.value=manualC.value=manualD.value="";renderDraft();draftStatus.className="status success";draftStatus.textContent="প্রশ্ন যোগ হয়েছে।"}
function renderDraft(){draftList.innerHTML=draft.map((q,i)=>`<div class="q-item"><b>${bn(i+1)}.</b> ${esc(q.question_text)} <span class="pill">${sourceLabel(sourceType.value)}</span> ${q.subject_id?`<span class="pill">${SUBJECTS[q.subject_id]}</span>`:""}<button class="btn danger" style="float:right;padding:5px 8px" onclick="draft.splice(${i},1);renderDraft()">বাদ</button></div>`).join("")||'<p class="muted">এখনও কোনো প্রশ্ন যোগ হয়নি।</p>'}
function parseCSV(text){const rows=[];let row=[],cell="",quote=false;for(let i=0;i<text.length;i++){const c=text[i],n=text[i+1];if(c==='"'){if(quote&&n==='"'){cell+='"';i++}else quote=!quote}else if(c===','&&!quote){row.push(cell);cell=""}else if((c==='\n'||c==='\r')&&!quote){if(c==='\r'&&n==='\n')i++;row.push(cell);if(row.some(x=>x.trim()!==""))rows.push(row);row=[];cell=""}else cell+=c}row.push(cell);if(row.some(x=>x.trim()!==""))rows.push(row);return rows}
async function importCSV(){const f=csvFile.files[0];if(!f){draftStatus.className="status error";draftStatus.textContent="CSV ফাইল নির্বাচন করুন।";return}const text=await f.text();const rows=parseCSV(text);if(rows.length<2){draftStatus.className="status error";draftStatus.textContent="CSV-তে প্রশ্ন পাওয়া যায়নি।";return}const head=rows[0].map(x=>x.trim().toLowerCase());const idx=n=>head.indexOf(n);const need=["question","option_a","option_b","option_c","option_d","correct_answer"];if(need.some(n=>idx(n)<0)){draftStatus.className="status error";draftStatus.textContent="CSV header হতে হবে: question, option_a, option_b, option_c, option_d, correct_answer, subject_id";return}for(const r of rows.slice(1)){const q=r[idx("question")]?.trim();if(!q)continue;draft.push({question_text:q,option_a:r[idx("option_a")]?.trim()||"",option_b:r[idx("option_b")]?.trim()||"",option_c:r[idx("option_c")]?.trim()||"",option_d:r[idx("option_d")]?.trim()||"",correct_answer:(r[idx("correct_answer")]||"").trim().toUpperCase(),subject_id:idx("subject_id")>=0&&r[idx("subject_id")]?.trim()?Number(r[idx("subject_id")]):null})}renderDraft();draftStatus.className="status success";draftStatus.textContent=bn(rows.length-1)+"টি CSV প্রশ্ন যোগ করা হয়েছে।"}
async function nextId(table){const {data,error}=await client.from(table).select("id").order("id",{ascending:false}).limit(1);if(error)throw error;return (data?.[0]?.id||0)+1}
async function createExamAndSave(){const name=examName.value.trim();if(!name){saveStatus.className="status error";saveStatus.textContent="পরীক্ষার নাম দিন।";return}if(!draft.length){saveStatus.className="status error";saveStatus.textContent="কমপক্ষে একটি প্রশ্ন যোগ করুন।";return}if(draft.some(q=>!q.question_text||!q.option_a||!q.option_b||!q.option_c||!q.option_d||!["A","B","C","D"].includes(q.correct_answer))){saveStatus.className="status error";saveStatus.textContent="প্রতিটি প্রশ্নে চার অপশন ও সঠিক উত্তর ঠিক আছে কি না দেখুন।";return}saveStatus.className="status";saveStatus.textContent="সংরক্ষণ হচ্ছে...";try{const {data:{user}}=await client.auth.getUser();if(!user)throw new Error("প্রশাসক লগইন নেই।");const examId=await nextId("exams");const token=crypto.randomUUID();const {error:e1}=await client.from("exams").insert({id:examId,exam_name:name,examiner_id:user.id,total_questions:draft.length,marks_per_question:Number(marksPerQuestion.value),negative_mark:Number(negativeMark.value),pass_mark:Number(passMark.value),start_at:new Date().toISOString(),end_at:new Date(Date.now()+365*24*3600*1000).toISOString(),exam_token:token,status:"active"});if(e1)throw e1;const {error:e2}=await client.from("exam_settings").insert({exam_id:examId,total_questions:draft.length,total_marks:Number(totalMarks.value),pass_mark:Number(passMark.value),duration_minutes:Number(duration.value),marks_per_question:Number(marksPerQuestion.value),negative_mark:Number(negativeMark.value),examiner_name:examinerName.value.trim(),show_answers:showAnswers.checked,multiple_attempts:multipleAttempts.checked,device_attempt_protection:true});if(e2)throw e2;const startQ=await nextId("questions");const qs=draft.map((q,i)=>({id:startQ+i,question_text:q.question_text,option_a:q.option_a,option_b:q.option_b,option_c:q.option_c,option_d:q.option_d,correct_answer:q.correct_answer,subject_id:q.subject_id,source_type:sourceType.value,source_name:name}));const {error:e3}=await client.from("questions").insert(qs);if(e3)throw e3;const links=qs.map((q,i)=>({exam_id:examId,question_id:q.id,question_order:i+1}));const {error:e4}=await client.from("exam_questions").insert(links);if(e4)throw e4;saveStatus.className="status success";saveStatus.innerHTML=`পরীক্ষা তৈরি হয়েছে। শিক্ষার্থীর লিংক: <b>?exam=${examId}</b>`;draft=[];renderDraft();await loadExams();}catch(e){saveStatus.className="status error";saveStatus.textContent="❌ "+(e.message||e)} }
async function loadExams(){const box=document.getElementById("examList");const {data,error}=await client.from("exams").select("id,exam_name,status,created_at,total_questions").order("id",{ascending:false});if(error){box.textContent="❌ "+error.message;return}box.innerHTML=(data||[]).map(e=>`<div class="exam-item"><div><b>${esc(e.exam_name)}</b><div class="small muted">ID: ${bn(e.id)} · ${e.status}</div></div><div><a class="btn secondary" href="?exam=${e.id}" target="_blank">পরীক্ষার লিংক</a></div></div>`).join("")||'<p class="muted">কোনো পরীক্ষা নেই।</p>'}
async function loadBank(){const box=document.getElementById("bankList");let q=client.from("questions").select("id,question_text,source_type,source_name,subject_id,created_at").order("id",{ascending:false}).limit(100);if(filterSource.value)q=q.eq("source_type",filterSource.value);if(filterSubject.value)q=q.eq("subject_id",Number(filterSubject.value));if(filterSourceName.value.trim())q=q.ilike("source_name",`%${filterSourceName.value.trim()}%`);const {data,error}=await q;if(error){box.textContent="❌ "+error.message;return}box.innerHTML=(data||[]).map(x=>`<div class="q-item"><b>${bn(x.id)}.</b> ${esc(x.question_text)}<div class="small muted">${sourceLabel(x.source_type)} · ${esc(x.source_name||"")} ${x.subject_id?"· "+SUBJECTS[x.subject_id]:""}</div></div>`).join("")||'<p class="muted">কোনো প্রশ্ন পাওয়া যায়নি।</p>'}
async function loadStudentExam(id){studentStatus.textContent="পরীক্ষার তথ্য লোড হচ্ছে...";try{const {data:e,error:ee}=await client.from("exams").select("*").eq("id",id).eq("status","active").maybeSingle();if(ee)throw ee;if(!e)throw new Error("পরীক্ষাটি পাওয়া যায়নি বা সক্রিয় নয়।");const {data:s,error:se}=await client.from("exam_settings").select("*").eq("exam_id",id).maybeSingle();if(se)throw se;currentExam=e;sSyllabus.textContent=s.syllabus||"সিলেবাস উল্লেখ করা হয়নি।";paperSyllabus.textContent=s.syllabus||"সিলেবাস উল্লেখ করা হয়নি।";studentQuestions=[];studentExamName.textContent=e.exam_name;sTotalQ.textContent=bn(s?.total_questions||e.total_questions||0);sTotalM.textContent=bn(s?.total_marks||0);sDuration.textContent=bn(s?.duration_minutes||20)+" মিনিট";studentStatus.className="status success";studentStatus.textContent="পরীক্ষার তথ্য প্রস্তুত। তথ্য পূরণ করে পরীক্ষা শুরু করুন।"}catch(err){studentStatus.className="status error";studentStatus.textContent="❌ "+err.message}}
async function startStudentExam(){const name=sName.value.trim(),fb=sFb.value.trim(),district=sDistrict.value.trim(),mobile=sMobile.value.trim();if(!name||!fb||!district||!/^01[3-9]\d{8}$/.test(mobile)){studentStatus.className="status error";studentStatus.textContent="নাম, ফেইসবুক আইডির নাম, জেলা ও সঠিক ১১ সংখ্যার মোবাইল দিন।";return}studentStatus.textContent="প্রশ্নপত্র লোড হচ্ছে...";try{const {data,error}=await client.rpc("get_public_exam_questions",{p_exam_id:currentExam.id});if(error)throw error;if(!Array.isArray(data)||!data.length)throw new Error("এই পরীক্ষায় কোনো প্রশ্ন পাওয়া যায়নি।");studentQuestions=data;studentAnswers={};studentIndex=0;studentTime=Number((await client.from("exam_settings").select("duration_minutes").eq("exam_id",currentExam.id).maybeSingle()).data?.duration_minutes||20)*60;startCard.classList.add("hidden");examCard.classList.remove("hidden");studentStatus.textContent="";renderStudentQuestion();clearInterval(studentTimer);studentTimer=setInterval(()=>{studentTime--;renderTimer();if(studentTime<=0)submitStudentExam(true)},1000);renderTimer()}catch(e){studentStatus.className="status error";studentStatus.textContent="❌ প্রশ্নপত্র লোড হয়নি: "+e.message}}
function renderTimer(){const m=Math.floor(studentTime/60),s=studentTime%60;sTimer.textContent=`${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`}
function renderStudentQuestion(){const q=studentQuestions[studentIndex];sProgress.textContent=`প্রশ্ন ${bn(studentIndex+1)} / ${bn(studentQuestions.length)}`;sQuestion.textContent=q.question_text;sOptions.innerHTML=["A","B","C","D"].map(k=>`<label class="option"><input type="radio" name="ans" value="${k}" ${studentAnswers[q.id]===k?"checked":""} onchange="studentAnswers[${q.id}]=this.value"> <span><b>${LETTER[k]}.</b> ${esc(q["option_"+k.toLowerCase()])}</span></label>`).join("");document.getElementById("prevStudentBtn").disabled=studentIndex===0;document.getElementById("nextStudentBtn").classList.toggle("hidden",studentIndex===studentQuestions.length-1);sSubmit.classList.toggle("hidden",studentIndex!==studentQuestions.length-1)}
function prevStudentQuestion(){if(studentIndex>0){studentIndex--;renderStudentQuestion()}}function nextStudentQuestion(){if(studentIndex<studentQuestions.length-1){studentIndex++;renderStudentQuestion()}}
async function submitStudentExam(auto){if(Object.keys(studentAnswers).length!==studentQuestions.length){if(!auto){alert("সব প্রশ্নের উত্তর দিতে হবে।");return}}clearInterval(studentTimer);sSubmit.disabled=true;try{const payload={};studentQuestions.forEach(q=>{if(studentAnswers[q.id])payload[String(q.id)]=studentAnswers[q.id]});const deviceToken=localStorage.getItem("fp_device")||crypto.randomUUID();localStorage.setItem("fp_device",deviceToken);const {data,error}=await client.rpc("submit_exam",{p_exam_id:currentExam.id,p_name:sName.value.trim(),p_facebook_name:sFb.value.trim(),p_district:sDistrict.value.trim(),p_mobile:sMobile.value.trim(),p_device_token:deviceToken,p_answers:payload});if(error)throw error;if(!data?.success)throw new Error(data?.message||"পরীক্ষা জমা হয়নি।");examCard.classList.add("hidden");studentResult.classList.remove("hidden");rScore.textContent=bn(data.score??"—");rMarks.textContent=bn(data.marks_awarded??data.score??"—");rPct.textContent=bn(data.percentage??"—")+"%";rRank.textContent=bn(data.rank??"—");rTotal.textContent=bn(data.rank_total??data.total_participants??"—");rPass.textContent=data.passed===true?"পাস করেছেন।":data.passed===false?"পাস করেননি.":""}catch(e){alert(e.message||"পরীক্ষা জমা দিতে সমস্যা হয়েছে।");sSubmit.disabled=false}}
window.addEventListener("DOMContentLoaded",init);
</script>
