<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ফেইসবুক পাঠশালা — Exam Results</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>
*{box-sizing:border-box}body{margin:0;background:#f4f7fb;color:#172033;font-family:Arial,"Noto Sans Bengali",sans-serif}header{background:#123a63;color:#fff;padding:16px 20px;display:flex;justify-content:space-between;align-items:center;gap:12px}main{max-width:1200px;margin:20px auto;padding:0 12px}.card{background:#fff;border-radius:14px;padding:18px;margin-bottom:16px;box-shadow:0 3px 14px #00000010}.hidden{display:none!important}.grid{display:grid;grid-template-columns:1fr auto;gap:12px}input,select,button{font:inherit;padding:11px;border:1px solid #ccd5e1;border-radius:8px}button{background:#1769aa;color:#fff;border:0;cursor:pointer;margin:4px 4px 4px 0}.secondary{background:#53657a}.login{max-width:420px;margin:80px auto}.login input,.login button{width:100%;margin:6px 0}.msg{min-height:22px}.error{color:#b42318}.success{color:#087443}.actions{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}.tableWrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:1000px}th,td{padding:10px 8px;border-bottom:1px solid #e4e8ee;text-align:center;white-space:nowrap}th{background:#edf3f9;position:sticky;top:0}td.name,td.fb{text-align:left}.badge{display:inline-block;padding:4px 9px;border-radius:999px;font-size:13px}.pass{background:#dff5e8;color:#087443}.fail{background:#fde4e4;color:#a51d1d}.summary{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0}.stat{background:#f5f8fc;padding:12px 18px;border-radius:10px}.stat b{display:block;font-size:20px}.paper{background:#fff;padding:12mm}.paperHeader{text-align:center;border-bottom:2px solid #111;padding-bottom:10px;margin-bottom:15px}.paperHeader h1{margin:0 0 6px;font-size:22px}.paperHeader p{margin:3px 0}.questionGrid,.answerGrid{column-count:2;column-gap:25px}.paperQuestion{break-inside:avoid;margin-bottom:12px;font-size:11px;line-height:1.5}.paperOptions{display:grid;grid-template-columns:1fr 1fr;gap:2px 10px;padding-left:7px;margin-top:3px}.answerItem{break-inside:avoid;padding:7px 5px;border-bottom:1px solid #ddd;font-size:12px}.correctAnswer{font-weight:700}.paperActions{text-align:center;margin:10px}.paperActions button{padding:9px 15px}@media(max-width:700px){.grid{grid-template-columns:1fr}header{align-items:flex-start;flex-direction:column}main{margin-top:10px}.card{padding:13px}}@media print{body{background:#fff}header,.noPrint,#login{display:none!important}main{max-width:none;margin:0;padding:0}.card{box-shadow:none;border:0}.tableWrap{overflow:visible}table{min-width:0;font-size:9px}th{position:static}.paper{padding:0}.paperQuestion{font-size:11px}.paperOptions{font-size:10px}}
</style></head><body>
<div id="login" class="card login"><h2>ফেইসবুক পাঠশালা</h2><h3>Admin Result</h3><input id="email" type="email" placeholder="Admin Email"><input id="password" type="password" placeholder="Password"><button onclick="loginAdmin()">Login</button><p id="loginMsg" class="msg"></p></div>
<div id="app" class="hidden"><header><b>ফেইসবুক পাঠশালা — Exam Result</b><button class="secondary noPrint" onclick="logoutAdmin()">Logout</button></header><main>
<div class="card noPrint"><h2>পরীক্ষার ফলাফল</h2><div class="grid"><select id="examSelect" onchange="loadResults()"><option value="">Exam নির্বাচন করুন</option></select><button onclick="loadResults()">Result Refresh</button></div><p id="msg" class="msg"></p></div>
<div id="resultBox" class="card hidden"><div class="actions"><div><h2 id="examTitle">Result</h2><div id="generated"></div></div><div class="noPrint"><button onclick="window.print()">🖨️ Result Print / PDF</button><button onclick="openQuestionPaper()">📝 Question Paper</button><button onclick="openAnswerSheet()">📋 Answer Sheet</button></div></div><div class="summary" id="summary"></div><div class="tableWrap"><table><thead><tr><th>মেধা</th><th>নাম</th><th>ফেইসবুক নাম</th><th>জেলা</th><th>মোট প্রশ্ন</th><th>সঠিক</th><th>ভুল</th><th>উত্তরহীন</th><th>নম্বর</th><th>শতকরা</th><th>ফলাফল</th><th>জমাদানের সময়</th></tr></thead><tbody id="rows"></tbody></table></div></div>
</main></div>
<script>
const db=window.supabase.createClient('https://ydvbnalhcnfqpxkkmywr.supabase.co','sb_publishable_xCbSWDkASsbUPl-WmygyMw_eVrJY_9a'),BN='০১২৩৪৫৬৭৮৯',LET={A:'ক',B:'খ',C:'গ',D:'ঘ'};const bn=x=>String(x??'').replace(/\d/g,d=>BN[d]);const esc=x=>String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
function setMsg(t,e=false){const x=document.getElementById('msg');x.textContent=t;x.className='msg '+(e?'error':'success')}function setLoginMsg(t,e=false){const x=document.getElementById('loginMsg');x.textContent=t;x.className='msg '+(e?'error':'success')}
async function loginAdmin(){setLoginMsg('Login হচ্ছে...');const{error}=await db.auth.signInWithPassword({email:email.value.trim(),password:password.value});if(error)return setLoginMsg(error.message,true);await init()}async function logoutAdmin(){await db.auth.signOut();location.reload()}
async function init(){const{data,error}=await db.auth.getSession();if(error)return setLoginMsg(error.message,true);if(!data.session){login.classList.remove('hidden');app.classList.add('hidden');return}login.classList.add('hidden');app.classList.remove('hidden');await loadExams();const id=new URLSearchParams(location.search).get('exam');if(id){examSelect.value=id;await loadResults()}}
async function loadExams(){const{data,error}=await db.from('exams').select('id,exam_name').order('id',{ascending:false});if(error)return setMsg(error.message,true);examSelect.innerHTML='<option value="">Exam নির্বাচন করুন</option>'+(data||[]).map(x=>`<option value="${x.id}">${esc(x.exam_name)} (#${bn(x.id)})</option>`).join('')}
async function loadResults(){const id=examSelect.value;if(!id){resultBox.classList.add('hidden');return}setMsg('Result লোড হচ্ছে...');const{data:exam,error:ee}=await db.from('exams').select('id,exam_name').eq('id',id).single();if(ee)return setMsg(ee.message,true);const{data,error}=await db.rpc('get_exam_results',{p_exam_id:Number(id)});if(error)return setMsg(error.message,true);const r=data||[];examTitle.textContent=(exam.exam_name||'Exam')+' — Result';generated.textContent='মোট পরীক্ষার্থী: '+bn(r.length)+' জন';const passed=r.filter(x=>x.passed).length;summary.innerHTML=`<div class="stat"><span>পরীক্ষার্থী</span><b>${bn(r.length)}</b></div><div class="stat"><span>উত্তীর্ণ</span><b>${bn(passed)}</b></div><div class="stat"><span>অনুত্তীর্ণ</span><b>${bn(r.length-passed)}</b></div>`;rows.innerHTML=r.length?r.map(x=>`<tr><td>${bn(x.rank_no)}</td><td class="name">${esc(x.student_name)}</td><td class="fb">${esc(x.facebook_name)}</td><td>${esc(x.district)}</td><td>${bn(x.total_questions)}</td><td>${bn(x.correct_count)}</td><td>${bn(x.wrong_count)}</td><td>${bn(x.unanswered_count)}</td><td><b>${bn(x.score)}</b> / ${bn(x.total_marks)}</td><td>${bn(x.percentage)}%</td><td><span class="badge ${x.passed?'pass':'fail'}">${x.passed?'উত্তীর্ণ':'অনুত্তীর্ণ'}</span></td><td>${formatDate(x.submitted_at)}</td></tr>`).join(''):'<tr><td colspan="12">কোনো Result পাওয়া যায়নি।</td></tr>';resultBox.classList.remove('hidden');setMsg('✅ Result লোড হয়েছে')}
function formatDate(v){if(!v)return'—';return new Intl.DateTimeFormat('bn-BD',{dateStyle:'short',timeStyle:'short'}).format(new Date(v))}
async function getExamQuestions(){const id=examSelect.value;if(!id){alert('আগে একটি Exam নির্বাচন করুন।');return null}const{data:exam,error:ee}=await db.from('exams').select('id,exam_name').eq('id',id).single();if(ee)throw ee;const{data:links,error:le}=await db.from('exam_questions').select('question_id,question_order').eq('exam_id',id).order('question_order',{ascending:true});if(le)throw le;if(!links?.length){alert('এই Exam-এ কোনো প্রশ্ন পাওয়া যায়নি।');return null}const ids=links.map(x=>x.question_id);const{data:qs,error:qe}=await db.from('questions').select('id,question_text,option_a,option_b,option_c,option_d,correct_answer').in('id',ids);if(qe)throw qe;const map={};(qs||[]).forEach(q=>map[q.id]=q);return{exam,questions:links.map(x=>map[x.question_id]).filter(Boolean)}}
function paperWindow(title,body){const w=window.open('','_blank');if(!w){alert('Popup blocked হয়েছে। Browser-এ popup allow করুন।');return null}w.document.write(`<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>${esc(title)}</title><style>*{box-sizing:border-box}body{margin:0;color:#111;font-family:Arial,"Noto Sans Bengali",sans-serif}.paper{padding:12mm}.paperHeader{text-align:center;border-bottom:2px solid #111;padding-bottom:10px;margin-bottom:15px}.paperHeader h1{margin:0 0 6px;font-size:22px}.paperHeader p{margin:3px 0}.noPrint{text-align:center;margin:10px}.noPrint button{padding:9px 15px;font-size:15px}.questionGrid,.answerGrid{column-count:2;column-gap:25px}.paperQuestion{break-inside:avoid;margin-bottom:12px;font-size:11px;line-height:1.5}.paperOptions{display:grid;grid-template-columns:1fr 1fr;gap:2px 10px;padding-left:7px;margin-top:3px}.answerItem{break-inside:avoid;padding:7px 5px;border-bottom:1px solid #ddd;font-size:12px}.correctAnswer{font-weight:700}@page{size:A4;margin:10mm}@media print{.noPrint{display:none}.paper{padding:0}}</style></head><body><div class="noPrint"><button onclick="window.print()">🖨️ Print / PDF</button></div>${body}</body></html>`);w.document.close();return w}
async function openQuestionPaper(){try{const z=await getExamQuestions();if(!z)return;const html=z.questions.map((q,i)=>`<div class="paperQuestion"><div><b>${bn(i+1)}.</b> ${esc(q.question_text)}</div><div class="paperOptions"><div>ক. ${esc(q.option_a)}</div><div>খ. ${esc(q.option_b)}</div><div>গ. ${esc(q.option_c)}</div><div>ঘ. ${esc(q.option_d)}</div></div></div>`).join('');paperWindow(z.exam.exam_name+' — Question Paper',`<div class="paper"><div class="paperHeader"><h1>${esc(z.exam.exam_name)}</h1><p>প্রশ্নপত্র</p><p>মোট প্রশ্ন: ${bn(z.questions.length)}</p></div><div class="questionGrid">${html}</div></div>`)}catch(e){alert('Question Paper লোড করা যায়নি: '+(e.message||'অজানা সমস্যা'))}}
async function openAnswerSheet(){try{const z=await getExamQuestions();if(!z)return;const html=z.questions.map((q,i)=>`<div class="answerItem"><b>${bn(i+1)}.</b> সঠিক উত্তর: <span class="correctAnswer">${LET[String(q.correct_answer||'').toUpperCase()]||'—'}</span></div>`).join('');paperWindow(z.exam.exam_name+' — Answer Sheet',`<div class="paper"><div class="paperHeader"><h1>${esc(z.exam.exam_name)}</h1><p>উত্তরপত্র / Answer Sheet</p><p>মোট প্রশ্ন: ${bn(z.questions.length)}</p></div><div class="answerGrid">${html}</div></div>`)}catch(e){alert('Answer Sheet লোড করা যায়নি: '+(e.message||'অজানা সমস্যা'))}}
init();
</script></body></html>
