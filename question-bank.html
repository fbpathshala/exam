<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Question Bank</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#f5f7fb;
  color:#172033;
  font-family:Arial,"Noto Sans Bengali",sans-serif;
}

header{
  background:#1769aa;
  color:#fff;
  padding:14px 16px;
  display:flex;
  align-items:center;
  gap:10px;
}

header b{
  font-size:18px;
}

header button{
  margin-left:auto;
  width:auto;
  background:transparent;
  border:1px solid rgba(255,255,255,.4);
  color:#fff;
  padding:8px 12px;
}

main{
  max-width:1000px;
  margin:auto;
  padding:14px;
}

.card{
  background:#fff;
  border:1px solid #e2e8f0;
  border-radius:14px;
  padding:15px;
  margin-bottom:13px;
}

h3{
  margin:0 0 12px;
  font-size:17px;
}

label{
  display:block;
  font-weight:700;
  margin-bottom:6px;
}

input,
select,
textarea,
button{
  width:100%;
  padding:11px;
  border-radius:9px;
  font:inherit;
}

input,
select,
textarea{
  border:1px solid #cbd5e1;
  background:#fff;
}

textarea{
  min-height:90px;
  resize:vertical;
}

button{
  border:0;
  background:#1769aa;
  color:#fff;
  font-weight:700;
  cursor:pointer;
}

button.secondary{
  background:#64748b;
}

button.green{
  background:#15803d;
}

button.danger{
  background:#dc2626;
}

button.small{
  width:auto;
  padding:9px 12px;
}

.category-buttons{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
}

.category-buttons button{
  background:#e2e8f0;
  color:#172033;
}

.category-buttons button.active{
  background:#1769aa;
  color:#fff;
}

.section-title{
  font-size:15px;
  font-weight:700;
  margin-bottom:8px;
}

.selector-row{
  display:grid;
  grid-template-columns:1fr auto;
  gap:8px;
  align-items:end;
  margin-bottom:12px;
}

.selector-row .select-wrap{
  min-width:0;
}

.selector-row button{
  width:auto;
  white-space:nowrap;
}

.create-box{
  display:none;
  background:#f8fafc;
  border:1px solid #dbe3ed;
  border-radius:10px;
  padding:10px;
  margin-top:8px;
}

.create-box.show{
  display:block;
}

.create-actions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  margin-top:8px;
}

.status{
  padding:9px 11px;
  background:#f1f5f9;
  border-radius:8px;
  color:#475569;
  font-size:13px;
  margin-top:8px;
}

.selected-info{
  background:#eff6ff;
  border:1px solid #bfdbfe;
  color:#1e40af;
  padding:10px;
  border-radius:9px;
  margin-top:5px;
  font-size:14px;
}

.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.full{
  grid-column:1/-1;
}

.option-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
}

.radio-row{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:8px;
}

.radio-box{
  border:1px solid #cbd5e1;
  border-radius:9px;
  padding:10px;
  text-align:center;
  cursor:pointer;
}

.radio-box input{
  width:auto;
  margin-right:5px;
}

.form-actions{
  margin-top:12px;
}

.filter-grid{
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
  gap:10px;
}

.q{
  border:1px solid #e2e8f0;
  border-radius:11px;
  padding:12px;
  margin-top:9px;
  background:#fff;
}

.q-number{
  font-weight:700;
  margin-bottom:7px;
}

.q-options{
  margin-top:8px;
  line-height:1.8;
}

.q-meta{
  color:#64748b;
  font-size:12px;
  margin-top:8px;
}

.q-actions{
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
  gap:7px;
  margin-top:10px;
}

.empty{
  color:#64748b;
  padding:15px 0;
  text-align:center;
}

.count{
  font-weight:700;
  color:#1769aa;
}

.hidden{
  display:none!important;
}

@media(max-width:700px){
  .category-buttons{
    grid-template-columns:1fr;
  }

  .grid,
  .filter-grid,
  .option-grid{
    grid-template-columns:1fr;
  }

  .selector-row{
    grid-template-columns:1fr;
  }

  .selector-row button{
    width:100%;
  }

  .radio-row{
    grid-template-columns:1fr 1fr;
  }

  .q-actions{
    grid-template-columns:1fr;
  }
}
</style>
</head>

<body>

<header>
  <b>Question Bank</b>
  <button onclick="go('dashboard.html')">ড্যাশবোর্ড</button>
</header>

<main>

  <!-- CATEGORY -->
  <div class="card">
    <h3>ক্যাটাগরি</h3>

    <div class="category-buttons">
      <button id="catRecruitment" onclick="changeCategory('recruitment')">
        নিয়োগ পরীক্ষা
      </button>

      <button id="catVerification" onclick="changeCategory('verification_test')">
        যাচাই পরীক্ষা
      </button>

      <button id="catRecent" onclick="changeCategory('recent')">
        সাম্প্রতিক প্রশ্ন
      </button>
    </div>

    <div id="currentCategoryText" class="selected-info"></div>
  </div>


  <!-- FOLDER + SET -->
  <div class="card">

    <h3>ফোল্ডার ও সেট নির্বাচন</h3>

    <!-- FOLDER -->
    <div class="section-title">ফোল্ডার</div>

    <div class="selector-row">

      <div class="select-wrap">
        <select id="folderSelect" onchange="folderChanged()">
          <option value="">ফোল্ডার নির্বাচন করুন</option>
        </select>
      </div>

      <button class="small" onclick="toggleFolderCreate()">
        ＋ নতুন ফোল্ডার
      </button>

    </div>

    <div id="folderCreateBox" class="create-box">

      <label>নতুন ফোল্ডারের নাম</label>

      <input
        id="newFolderName"
        placeholder="যেমন: ব্রেইন বুস্টার মডেল টেস্ট"
      >

      <div class="create-actions">
        <button class="green" onclick="createFolder()">
          তৈরি করুন
        </button>

        <button class="secondary" onclick="closeFolderCreate()">
          বাতিল
        </button>
      </div>

    </div>


    <!-- SET -->
    <div class="section-title" style="margin-top:15px;">সেট</div>

    <div class="selector-row">

      <div class="select-wrap">
        <select id="setSelect" onchange="setChanged()">
          <option value="">আগে ফোল্ডার নির্বাচন করুন</option>
        </select>
      </div>

      <button
        id="newSetButton"
        class="small"
        onclick="toggleSetCreate()"
        disabled
      >
        ＋ নতুন সেট
      </button>

    </div>

    <div id="setCreateBox" class="create-box">

      <label>নতুন সেটের নাম</label>

      <input
        id="newSetName"
        placeholder="যেমন: সেট–১"
      >

      <div class="create-actions">
        <button class="green" onclick="createSet()">
          তৈরি করুন
        </button>

        <button class="secondary" onclick="closeSetCreate()">
          বাতিল
        </button>
      </div>

    </div>


    <div id="selectionStatus" class="status">
      ফোল্ডার ও সেট নির্বাচন করুন।
    </div>

  </div>


  <!-- ADD QUESTION -->
  <div class="card">

    <h3>প্রশ্ন যোগ করুন</h3>

    <div id="addQuestionNotice" class="selected-info">
      আগে একটি ফোল্ডার ও সেট নির্বাচন করুন।
    </div>

    <div id="questionForm" class="hidden">

      <div class="grid">

        <div>
          <label>প্রশ্ন নম্বর</label>
          <input id="questionNumber" type="number" min="1" placeholder="যেমন: ১">
        </div>

        <div>
          <label>বিষয়</label>

          <select id="subjectSelect">
            <option value="">বিষয় নির্বাচন করুন</option>
          </select>
        </div>

        <div class="full">

          <label>Source</label>

          <select id="sourceSelect">
            <option value="">Source নির্বাচন করুন</option>
          </select>

        </div>

        <div class="full">

          <label>প্রশ্ন</label>

          <textarea
            id="questionText"
            placeholder="প্রশ্ন লিখুন"
          ></textarea>

        </div>

      </div>


      <div class="option-grid">

        <div>
          <label>ক</label>
          <input id="optionA" placeholder="অপশন ক">
        </div>

        <div>
          <label>খ</label>
          <input id="optionB" placeholder="অপশন খ">
        </div>

        <div>
          <label>গ</label>
          <input id="optionC" placeholder="অপশন গ">
        </div>

        <div>
          <label>ঘ</label>
          <input id="optionD" placeholder="অপশন ঘ">
        </div>

      </div>


      <div style="margin-top:12px;">

        <label>সঠিক উত্তর</label>

        <div class="radio-row">

          <label class="radio-box">
            <input type="radio" name="correctAnswer" value="ক">
            ক
          </label>

          <label class="radio-box">
            <input type="radio" name="correctAnswer" value="খ">
            খ
          </label>

          <label class="radio-box">
            <input type="radio" name="correctAnswer" value="গ">
            গ
          </label>

          <label class="radio-box">
            <input type="radio" name="correctAnswer" value="ঘ">
            ঘ
          </label>

        </div>

      </div>


      <div style="margin-top:12px;">

        <label>ব্যাখ্যা</label>

        <textarea
          id="explanation"
          placeholder="প্রয়োজনে ব্যাখ্যা লিখুন"
        ></textarea>

      </div>


      <div class="form-actions">

        <button id="saveQuestionButton" onclick="saveQuestion()">
          প্রশ্ন যোগ করুন
        </button>

      </div>

      <div id="questionMessage" class="status"></div>

    </div>

  </div>


  <!-- QUESTION FILTER -->
  <div class="card">

    <h3>প্রশ্ন খুঁজুন</h3>

    <div class="filter-grid">

      <select id="filterFolder" onchange="loadFilterSets()">
        <option value="">সব ফোল্ডার</option>
      </select>

      <select id="filterSet" onchange="loadQuestions()">
        <option value="">সব সেট</option>
      </select>

      <select id="filterSubject" onchange="loadQuestions()">
        <option value="">সব বিষয়</option>
      </select>

    </div>

    <div style="margin-top:10px;">

      <input
        id="searchText"
        placeholder="প্রশ্ন লিখে খুঁজুন..."
        oninput="loadQuestions()"
      >

    </div>

  </div>


  <!-- QUESTION LIST -->
  <div class="card">

    <h3>
      প্রশ্ন তালিকা
      <span class="count" id="questionCount">মোট প্রশ্ন: ০</span>
    </h3>

    <div id="questionList">
      <div class="empty">কোনো প্রশ্ন পাওয়া যায়নি</div>
    </div>

  </div>

</main>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
  "https://ydvbnalhcnfqpxkkmywr.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_xCbSWDkASsbUPl-WmygyMw_eVrJY_9a";

const sb = supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


/* =========================
   CATEGORY
========================= */

const CATS = {
  recruitment: "নিয়োগ পরীক্ষা",
  verification_test: "যাচাই পরীক্ষা",
  recent: "সাম্প্রতিক প্রশ্ন"
};

let currentCategory = "verification_test";


/* =========================
   AUTH
========================= */

async function auth(){

  const {
    data:{
      session
    }
  } = await sb.auth.getSession();

  if(!session){

    location.href = "admin.html";

    return false;
  }

  return true;
}


/* =========================
   NAVIGATION
========================= */

function go(page){

  location.href = page;

}


/* =========================
   CATEGORY CHANGE
========================= */

async function changeCategory(category){

  currentCategory = category;

  document
    .getElementById("catRecruitment")
    .classList.toggle(
      "active",
      category === "recruitment"
    );

  document
    .getElementById("catVerification")
    .classList.toggle(
      "active",
      category === "verification_test"
    );

  document
    .getElementById("catRecent")
    .classList.toggle(
      "active",
      category === "recent"
    );


  document.getElementById(
    "currentCategoryText"
  ).textContent =
    "বর্তমান বিভাগ: " + CATS[category];


  closeFolderCreate();
  closeSetCreate();


  await loadFolders();

  await loadSources();

  await loadFilterFolders();

  resetQuestionForm();

}


/* =========================
   FOLDER
========================= */

async function loadFolders(){

  const folderSelect =
    document.getElementById("folderSelect");


  folderSelect.innerHTML =
    '<option value="">ফোল্ডার নির্বাচন করুন</option>';


  const {
    data,
    error
  } = await sb
    .from("question_bank_folders")
    .select("id,sub_category,folder_name")
    .eq(
      "sub_category",
      CATS[currentCategory]
    )
    .order("folder_name");


  if(error){

    folderSelect.innerHTML =
      '<option value="">ফোল্ডার লোড হয়নি</option>';

    console.error(error);

    return;
  }


  (data || []).forEach(folder => {

    const option =
      document.createElement("option");

    option.value = folder.id;

    option.textContent =
      folder.folder_name;

    folderSelect.appendChild(option);

  });


  loadSets();

}


/* =========================
   CREATE FOLDER UI
========================= */

function toggleFolderCreate(){

  document
    .getElementById("folderCreateBox")
    .classList.toggle("show");

  if(
    document
      .getElementById("folderCreateBox")
      .classList.contains("show")
  ){

    document
      .getElementById("newFolderName")
      .focus();

  }

}


function closeFolderCreate(){

  document
    .getElementById("folderCreateBox")
    .classList.remove("show");

  document
    .getElementById("newFolderName")
    .value = "";

}


/* =========================
   CREATE FOLDER
========================= */

async function createFolder(){

  const input =
    document.getElementById("newFolderName");

  const name =
    input.value.trim();


  if(!name){

    alert("ফোল্ডারের নাম লিখুন।");

    input.focus();

    return;
  }


  const {
    data: existing,
    error: checkError
  } = await sb
    .from("question_bank_folders")
    .select("id")
    .eq(
      "sub_category",
      CATS[currentCategory]
    )
    .eq(
      "folder_name",
      name
    )
    .limit(1);


  if(checkError){

    alert(checkError.message);

    return;
  }


  if(existing && existing.length){

    alert("এই নামে ফোল্ডার আগে থেকেই আছে।");

    return;
  }


  const {
    data,
    error
  } = await sb
    .from("question_bank_folders")
    .insert({

      sub_category:
        CATS[currentCategory],

      folder_name:
        name

    })
    .select()
    .single();


  if(error){

    alert(error.message);

    return;
  }


  closeFolderCreate();

  await loadFolders();


  if(data && data.id){

    document.getElementById(
      "folderSelect"
    ).value = data.id;

    await folderChanged();

  }


  alert("ফোল্ডার তৈরি হয়েছে।");

}


/* =========================
   FOLDER CHANGE
========================= */

async function folderChanged(){

  const folderId =
    document.getElementById("folderSelect").value;


  closeSetCreate();


  if(!folderId){

    document.getElementById(
      "newSetButton"
    ).disabled = true;


    document.getElementById(
      "setSelect"
    ).innerHTML =
      '<option value="">আগে ফোল্ডার নির্বাচন করুন</option>';


    document.getElementById(
      "selectionStatus"
    ).textContent =
      "ফোল্ডার নির্বাচন করুন।";


    resetQuestionForm();

    return;
  }


  document.getElementById(
    "newSetButton"
  ).disabled = false;


  await loadSets();


  resetQuestionForm();

}


/* =========================
   SET
========================= */

async function loadSets(){

  const folderId =
    document.getElementById("folderSelect").value;

  const setSelect =
    document.getElementById("setSelect");


  if(!folderId){

    setSelect.innerHTML =
      '<option value="">আগে ফোল্ডার নির্বাচন করুন</option>';

    document.getElementById(
      "newSetButton"
    ).disabled = true;

    return;
  }


  setSelect.innerHTML =
    '<option value="">সেট নির্বাচন করুন</option>';


  const {
    data,
    error
  } = await sb
    .from("question_bank_sets")
    .select("id,folder_id,set_name")
    .eq(
      "folder_id",
      Number(folderId)
    )
    .order("set_name");


  if(error){

    setSelect.innerHTML =
      '<option value="">সেট লোড হয়নি</option>';

    console.error(error);

    return;
  }


  (data || []).forEach(set => {

    const option =
      document.createElement("option");

    option.value = set.id;

    option.textContent =
      set.set_name;

    setSelect.appendChild(option);

  });


  document.getElementById(
    "newSetButton"
  ).disabled = false;

}


/* =========================
   CREATE SET UI
========================= */

function toggleSetCreate(){

  const folderId =
    document.getElementById("folderSelect").value;


  if(!folderId){

    alert("আগে একটি ফোল্ডার নির্বাচন করুন।");

    return;
  }


  document
    .getElementById("setCreateBox")
    .classList.toggle("show");


  if(
    document
      .getElementById("setCreateBox")
      .classList.contains("show")
  ){

    document
      .getElementById("newSetName")
      .focus();

  }

}


function closeSetCreate(){

  document
    .getElementById("setCreateBox")
    .classList.remove("show");

  document
    .getElementById("newSetName")
    .value = "";

}


/* =========================
   CREATE SET
========================= */

async function createSet(){

  const folderId =
    document.getElementById("folderSelect").value;

  const input =
    document.getElementById("newSetName");

  const name =
    input.value.trim();


  if(!folderId){

    alert("আগে একটি ফোল্ডার নির্বাচন করুন।");

    return;
  }


  if(!name){

    alert("সেটের নাম লিখুন।");

    input.focus();

    return;
  }


  const {
    data: existing,
    error: checkError
  } = await sb
    .from("question_bank_sets")
    .select("id")
    .eq(
      "folder_id",
      Number(folderId)
    )
    .eq(
      "set_name",
      name
    )
    .limit(1);


  if(checkError){

    alert(checkError.message);

    return;
  }


  if(existing && existing.length){

    alert("এই নামে সেট আগে থেকেই আছে।");

    return;
  }


  const {
    data,
    error
  } = await sb
    .from("question_bank_sets")
    .insert({

      folder_id:
        Number(folderId),

      set_name:
        name

    })
    .select()
    .single();


  if(error){

    alert(error.message);

    return;
  }


  closeSetCreate();

  await loadSets();


  if(data && data.id){

    document.getElementById(
      "setSelect"
    ).value = data.id;

    await setChanged();

  }


  alert("সেট তৈরি হয়েছে।");

}


/* =========================
   SET CHANGE
========================= */

async function setChanged(){

  const folderSelect =
    document.getElementById("folderSelect");

  const setSelect =
    document.getElementById("setSelect");


  const folderId =
    folderSelect.value;

  const setId =
    setSelect.value;


  if(!folderId || !setId){

    document.getElementById(
      "selectionStatus"
    ).textContent =
      "ফোল্ডার ও সেট নির্বাচন করুন।";

    resetQuestionForm();

    return;
  }


  const folderName =
    folderSelect.options[
      folderSelect.selectedIndex
    ].textContent;


  const setName =
    setSelect.options[
      setSelect.selectedIndex
    ].textContent;


  document.getElementById(
    "selectionStatus"
  ).textContent =
    "নির্বাচিত: " +
    folderName +
    " → " +
    setName;

/* =========================
   QUESTION NUMBER
========================= */

async function suggestQuestionNumber(){

  const folderId =
    document.getElementById("folderSelect").value;

  const setId =
    document.getElementById("setSelect").value;


  if(!folderId || !setId){

    return;
  }


  const {
    data,
    error
  } = await sb
    .from("questions")
    .select("question_number")
    .eq(
      "folder_id",
      Number(folderId)
    )
    .eq(
      "set_id",
      Number(setId)
    )
    .order(
      "question_number",
      {
        ascending:false
      }
    )
    .limit(1);


  if(error){

    return;
  }


  let next = 1;


  if(data && data.length){

    next =
      Number(data[0].question_number || 0) + 1;

  }


  document.getElementById(
    "questionNumber"
  ).value = next;

}


/* =========================
   SAVE QUESTION
========================= */

async function saveQuestion(){

  const folderId =
    document.getElementById("folderSelect").value;

  const setId =
    document.getElementById("setSelect").value;


  if(!folderId || !setId){

    alert("আগে ফোল্ডার ও সেট নির্বাচন করুন।");

    return;
  }


  const questionText =
    document.getElementById(
      "questionText"
    ).value.trim();


  const optionA =
    document.getElementById(
      "optionA"
    ).value.trim();

  const optionB =
    document.getElementById(
      "optionB"
    ).value.trim();

  const optionC =
    document.getElementById(
      "optionC"
    ).value.trim();

  const optionD =
    document.getElementById(
      "optionD"
    ).value.trim();


  const subjectId =
    document.getElementById(
      "subjectSelect"
    ).value;


  const sourceId =
    document.getElementById(
      "sourceSelect"
    ).value;


  const questionNumber =
    Number(
      document.getElementById(
        "questionNumber"
      ).value
    );


  const explanation =
    document.getElementById(
      "explanation"
    ).value.trim();


  const answerRadio =
    document.querySelector(
      'input[name="correctAnswer"]:checked'
    );


  if(!questionText){

    alert("প্রশ্ন লিখুন।");

    return;
  }


  if(
    !optionA ||
    !optionB ||
    !optionC ||
    !optionD
  ){

    alert("চারটি অপশন পূরণ করুন।");

    return;
  }


  if(!subjectId){

    alert("বিষয় নির্বাচন করুন।");

    return;
  }


  if(!sourceId){

    alert("Source নির্বাচন করুন।");

    return;
  }


  if(!answerRadio){

    alert("সঠিক উত্তর নির্বাচন করুন।");

    return;
  }


  if(!questionNumber){

    alert("প্রশ্ন নম্বর দিন।");

    return;
  }


  const correctAnswer =
    answerRadio.value;


  /* DUPLICATE CHECK */

  const {
    data: duplicate,
    error: duplicateError
  } = await sb
    .from("questions")
    .select("id")
    .eq(
      "source_type",
      currentCategory
    )
    .eq(
      "folder_id",
      Number(folderId)
    )
    .eq(
      "set_id",
      Number(setId)
    )
    .eq(
      "question_text",
      questionText
    )
    .limit(1);


  if(duplicateError){

    alert(duplicateError.message);

    return;
  }


  if(duplicate && duplicate.length){

    alert(
      "এই প্রশ্নটি এই সেটে আগে থেকেই আছে।"
    );

    return;
  }


  const sourceResult =
    await sb
      .from("question_sources")
      .select(
        "source_name"
      )
      .eq(
        "id",
        Number(sourceId)
      )
      .single();


  if(sourceResult.error){

    alert(
      sourceResult.error.message
    );

    return;
  }


  const {
    data,
    error
  } = await sb
    .from("questions")
    .insert({

      question_text:
        questionText,

      option_a:
        optionA,

      option_b:
        optionB,

      option_c:
        optionC,

      option_d:
        optionD,

      correct_answer:
        correctAnswer,

      explanation:
        explanation || null,

      subject_id:
        Number(subjectId),

      source_id:
        Number(sourceId),

      category:
        CATS[currentCategory],

      source_type:
        currentCategory,

      source_name:
        sourceResult.data?.source_name || null,

      folder_id:
        Number(folderId),

      set_id:
        Number(setId),

      question_number:
        questionNumber

    })
    .select()
    .single();


  if(error){

    document.getElementById(
      "questionMessage"
    ).textContent =
      error.message;

    return;
  }


  document.getElementById(
    "questionMessage"
  ).textContent =
    "প্রশ্ন সফলভাবে যোগ হয়েছে।";


  clearQuestionFields();

  await suggestQuestionNumber();

  await loadQuestions();

}

/* =========================
   LOAD QUESTIONS
========================= */

async function loadQuestions(){

  const folderId =
    document.getElementById(
      "filterFolder"
    ).value;

  const setId =
    document.getElementById(
      "filterSet"
    ).value;

  const subjectId =
    document.getElementById(
      "filterSubject"
    ).value;

  const search =
    document.getElementById(
      "searchText"
    ).value.trim();


  let query =
    sb
      .from("questions")
      .select(`
        id,
        question_text,
        option_a,
        option_b,
        option_c,
        option_d,
        correct_answer,
        explanation,
        question_number,
        source_name,
        folder_id,
        set_id,
        subject_id,
        subjects(name),
        question_bank_folders(folder_name),
        question_bank_sets(set_name)
      `)
      .eq(
        "source_type",
        currentCategory
      )
      .order(
        "question_number",
        {
          ascending:true
        }
      );


  if(folderId){

    query =
      query.eq(
        "folder_id",
        Number(folderId)
      );

  }


  if(setId){

    query =
      query.eq(
        "set_id",
        Number(setId)
      );

  }


  if(subjectId){

    query =
      query.eq(
        "subject_id",
        Number(subjectId)
      );

  }


  if(search){

    query =
      query.ilike(
        "question_text",
        "%" + search + "%"
      );

  }


  const {
    data,
    error
  } = await query;


  const list =
    document.getElementById(
      "questionList"
    );


  if(error){

    list.innerHTML =
      '<div class="empty">' +
      error.message +
      '</div>';

    return;
  }


  document.getElementById(
    "questionCount"
  ).textContent =
    "মোট প্রশ্ন: " +
    (data || []).length;


  if(!data || !data.length){

    list.innerHTML =
      '<div class="empty">' +
      'কোনো প্রশ্ন পাওয়া যায়নি' +
      '</div>';

    return;
  }


  list.innerHTML =
    data
      .map(
        question => renderQuestion(question)
      )
      .join("");

}


/* =========================
   RENDER QUESTION
========================= */

function renderQuestion(q){

  const number =
    q.question_number || "";

  const subject =
    q.subjects?.name || "";


  const folder =
    q.question_bank_folders?.folder_name || "";


  const set =
    q.question_bank_sets?.set_name || "";


  return `

    <div class="q">

      <div class="q-number">
        ${number}. ${escapeHtml(q.question_text)}
      </div>

      <div class="q-options">

        <div>ক) ${escapeHtml(q.option_a)}</div>

        <div>খ) ${escapeHtml(q.option_b)}</div>

        <div>গ) ${escapeHtml(q.option_c)}</div>

        <div>ঘ) ${escapeHtml(q.option_d)}</div>

      </div>

      <div class="q-meta">

        বিষয়: ${escapeHtml(subject)}
        <br>

        ফোল্ডার: ${escapeHtml(folder)}
        <br>

        সেট: ${escapeHtml(set)}
        <br>

        সঠিক উত্তর:
        ${escapeHtml(q.correct_answer)}

        ${
          q.source_name
            ? "<br>Source: " +
              escapeHtml(q.source_name)
            : ""
        }

      </div>

      ${
        q.explanation
          ? `
            <div class="q-meta">
              ব্যাখ্যা:
              ${escapeHtml(q.explanation)}
            </div>
          `
          : ""
      }


      <div class="q-actions">

        <button
          onclick="viewQuestion(${q.id})"
        >
          বিস্তারিত
        </button>

        <button
          class="secondary"
          onclick="editQuestion(${q.id})"
        >
          এডিট
        </button>

        <button
          class="danger"
          onclick="deleteQuestion(${q.id})"
        >
          মুছুন
        </button>

      </div>

    </div>

  `;

}


/* =========================
   VIEW QUESTION
========================= */

async function viewQuestion(id){

  const {
    data,
    error
  } = await sb
    .from("questions")
    .select(`
      *,
      subjects(name),
      question_bank_folders(folder_name),
      question_bank_sets(set_name)
    `)
    .eq("id",id)
    .single();


  if(error){

    alert(error.message);

    return;
  }


  if(!data){

    return;
  }


  const text =
`
প্রশ্ন:
${data.question_text}

ক) ${data.option_a}

খ) ${data.option_b}

গ) ${data.option_c}

ঘ) ${data.option_d}

সঠিক উত্তর: ${data.correct_answer}

বিষয়: ${data.subjects?.name || ""}

ফোল্ডার: ${data.question_bank_folders?.folder_name || ""}

সেট: ${data.question_bank_sets?.set_name || ""}

Source: ${data.source_name || ""}

ব্যাখ্যা:
${data.explanation || "নেই"}
`;


  alert(text);

}


/* =========================
   EDIT QUESTION
========================= */

async function editQuestion(id){

  const {
    data,
    error
  } = await sb
    .from("questions")
    .select("*")
    .eq("id",id)
    .single();


  if(error){

    alert(error.message);

    return;
  }


  if(!data){

    return;
  }


  const newQuestion =
    prompt(
      "প্রশ্নটি সম্পাদনা করুন:",
      data.question_text
    );


  if(newQuestion === null){

    return;
  }


  const cleaned =
    newQuestion.trim();


  if(!cleaned){

    alert("প্রশ্ন খালি রাখা যাবে না।");

    return;
  }


  const {
    error:updateError
  } = await sb
    .from("questions")
    .update({

      question_text:
        cleaned,

      updated_at:
        new Date().toISOString()

    })
    .eq(
      "id",
      id
    );


  if(updateError){

    alert(updateError.message);

    return;
  }


  alert("প্রশ্ন আপডেট হয়েছে।");

  loadQuestions();

}


/* =========================
   DELETE QUESTION
========================= */

async function deleteQuestion(id){

  const ok =
    confirm(
      "এই প্রশ্নটি মুছে ফেলবেন?"
    );


  if(!ok){

    return;
  }


  const {
    error
  } = await sb
    .from("questions")
    .delete()
    .eq(
      "id",
      id
    );


  if(error){

    alert(error.message);

    return;
  }


  loadQuestions();

}


/* =========================
   ESCAPE HTML
========================= */

function escapeHtml(value){

  if(value === null || value === undefined){

    return "";

  }


  return String(value)

    .replaceAll("&","&amp;")

    .replaceAll("<","&lt;")

    .replaceAll(">","&gt;")

    .replaceAll('"',"&quot;")

    .replaceAll("'","&#039;");

}
