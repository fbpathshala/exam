<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ফেইসবুক পাঠশালা — Question Bank</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f5f7fb;
  color:#172033;
}

header{
  background:#1769aa;
  color:#fff;
  padding:13px 15px;
  display:flex;
  align-items:center;
}

header b{
  font-size:18px;
}

header button{
  margin-left:auto;
  background:#fff;
  color:#1769aa;
  border:0;
  border-radius:9px;
  padding:9px 12px;
  font-weight:700;
}

main{
  max-width:1050px;
  margin:auto;
  padding:12px;
}

.card{
  background:#fff;
  border:1px solid #e2e8f0;
  border-radius:14px;
  padding:14px;
  margin-bottom:12px;
}

h2,h3{
  margin:4px 0 12px;
}

.tabs{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:7px;
}

button,input,select,textarea{
  width:100%;
  font:inherit;
  border-radius:9px;
}

button{
  border:0;
  padding:11px;
  background:#1769aa;
  color:#fff;
  font-weight:700;
  cursor:pointer;
}

input,select,textarea{
  border:1px solid #cbd5e1;
  padding:10px;
  background:#fff;
}

textarea{
  min-height:80px;
  resize:vertical;
}

.tab{
  background:#e2e8f0;
  color:#172033;
}

.tab.active{
  background:#1769aa;
  color:#fff;
}

.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:9px;
}

.row{
  display:grid;
  grid-template-columns:1fr auto;
  gap:7px;
  align-items:center;
}

.smallbtn{
  width:auto;
  padding:9px 12px;
  white-space:nowrap;
}

.muted{
  color:#64748b;
  font-size:13px;
}

.msg{
  margin-top:8px;
  padding:8px;
  border-radius:8px;
  background:#f1f5f9;
}

.q{
  border:1px solid #e2e8f0;
  border-radius:11px;
  padding:11px;
  margin-top:9px;
}

.opts{
  margin-top:7px;
  line-height:1.7;
}

.danger{
  background:#b91c1c;
}

.secondary{
  background:#64748b;
}

.hidden{
  display:none;
}

.login{
  max-width:430px;
  margin:55px auto;
  padding:15px;
}

.login .card{
  padding:20px;
}

label{
  display:block;
  margin-top:8px;
  margin-bottom:4px;
}

@media(max-width:650px){
  .grid{
    grid-template-columns:1fr;
  }

  .tabs{
    grid-template-columns:1fr;
  }
}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="loginBox" class="login hidden">

  <div class="card">

    <h2>ফেইসবুক পাঠশালা</h2>

    <p>Question Bank-এ প্রবেশ করতে লগ ইন করুন</p>

    <input
      id="loginEmail"
      type="email"
      placeholder="Admin Email"
    >

    <input
      id="loginPassword"
      type="password"
      placeholder="Password"
    >

    <button id="loginBtn">
      লগ ইন
    </button>

    <div id="loginMsg" class="msg"></div>

  </div>

</div>


<!-- APP -->
<div id="app" class="hidden">

<header>

  <b>Question Bank</b>

  <button id="logoutBtn">
    লগআউট
  </button>

</header>


<main>


<!-- CATEGORY -->
<div class="card">

  <h3>১. বিভাগ নির্বাচন</h3>

  <div class="tabs">

    <button
      class="tab active"
      data-cat="recruitment"
    >
      নিয়োগ পরীক্ষা
    </button>

    <button
      class="tab"
      data-cat="verification_test"
    >
      যাচাই পরীক্ষা
    </button>

    <button
      class="tab"
      data-cat="recent"
    >
      সাম্প্রতিক প্রশ্ন
    </button>

  </div>

</div>


<!-- FOLDER + SET -->
<div class="card">

  <h3>২. ফোল্ডার ও সেট</h3>


  <label>
    ফোল্ডার
  </label>

  <div class="row">

    <select id="folderSelect">

      <option value="">
        ফোল্ডার নির্বাচন করুন
      </option>

    </select>

    <button
      class="smallbtn"
      id="newFolderBtn"
    >
      ＋ নতুন
    </button>

  </div>


  <!-- NEW FOLDER -->
  <div
    id="folderBox"
    class="hidden"
    style="margin-top:8px"
  >

    <div class="row">

      <input
        id="folderName"
        placeholder="নতুন ফোল্ডারের নাম"
      >

      <button
        class="smallbtn"
        id="saveFolderBtn"
      >
        সংরক্ষণ
      </button>

    </div>

  </div>


  <label style="margin-top:12px">

    সেট

  </label>


  <div class="row">

    <select id="setSelect">

      <option value="">
        সেট নির্বাচন করুন
      </option>

    </select>

    <button
      class="smallbtn"
      id="newSetBtn"
    >
      ＋ নতুন
    </button>

  </div>


  <!-- NEW SET -->
  <div
    id="setBox"
    class="hidden"
    style="margin-top:8px"
  >

    <div class="row">

      <input
        id="setName"
        placeholder="নতুন সেটের নাম"
      >

      <button
        class="smallbtn"
        id="saveSetBtn"
      >
        সংরক্ষণ
      </button>

    </div>

  </div>


  <div
    id="fsMsg"
    class="msg"
  ></div>

</div>


<!-- ADD QUESTION -->
<div class="card">

  <h3>৩. প্রশ্ন যোগ করুন</h3>


  <div class="grid">

    <div>

      <label>
        বিষয়
      </label>

      <select id="subjectSelect">

        <option value="">
          বিষয় নির্বাচন করুন
        </option>

      </select>

    </div>


    <div>

      <label>
        প্রশ্ন নম্বর
      </label>

      <input
        id="questionNumber"
        type="number"
        placeholder="যেমন ১"
      >

    </div>

  </div>


  <label>
    প্রশ্ন
  </label>

  <textarea
    id="questionText"
    placeholder="প্রশ্ন লিখুন"
  ></textarea>


  <div class="grid">

    <input
      id="a"
      placeholder="ক. অপশন"
    >

    <input
      id="b"
      placeholder="খ. অপশন"
    >

    <input
      id="c"
      placeholder="গ. অপশন"
    >

    <input
      id="d"
      placeholder="ঘ. অপশন"
    >

  </div>


  <div class="grid">

    <select id="correct">

      <option value="">
        সঠিক উত্তর নির্বাচন করুন
      </option>

      <option value="ক">
        ক
      </option>

      <option value="খ">
        খ
      </option>

      <option value="গ">
        গ
      </option>

      <option value="ঘ">
        ঘ
      </option>

    </select>


    <input
      id="sourceName"
      placeholder="উৎসের নাম"
    >

  </div>


  <label>
    ব্যাখ্যা
  </label>

  <textarea
    id="explanation"
    placeholder="ব্যাখ্যা (ঐচ্ছিক)"
  ></textarea>


  <button
    id="addBtn"
    style="margin-top:9px"
  >
    প্রশ্ন যোগ করুন
  </button>


  <div
    id="addMsg"
    class="msg"
  ></div>

</div>


<!-- EXCEL / CSV -->
<div class="card">

  <h3>৪. Excel / CSV</h3>

  <p class="muted">
    প্রথমে ফোল্ডার ও সেট নির্বাচন করুন।
    তারপর Excel অথবা CSV ফাইল নির্বাচন করুন।
  </p>

  <input
    id="fileInput"
    type="file"
    accept=".xlsx,.xls,.csv"
  >

  <button
    id="importBtn"
    style="margin-top:8px"
  >
    ফাইল থেকে প্রশ্ন যোগ করুন
  </button>

  <div
    id="importMsg"
    class="msg"
  ></div>

</div>


<!-- QUESTION LIST -->
<div class="card">

  <h3>৫. প্রশ্ন তালিকা</h3>


  <div class="grid">

    <select id="filterSubject">

      <option value="">
        সব বিষয়
      </option>

    </select>


    <button id="refreshBtn">
      তালিকা রিফ্রেশ
    </button>

  </div>


  <div id="questionList"></div>

</div>


</main>

</div>


<script>

/* =========================
   SUPABASE
========================= */

const SUPABASE_URL =
"https://ydvbnalhcnfqpxkkmywr.supabase.co";

const SUPABASE_KEY =
"sb_publishable_xCbSWDkASsbUPl-WmygyMw_eVrJY_9a";


const sb =
supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY,
  {
    auth:{
      persistSession:true,
      autoRefreshToken:true,
      detectSessionInUrl:true
    }
  }
);


/* =========================
   GLOBAL
========================= */

const CATS = {

  recruitment:
    "নিয়োগ পরীক্ষা",

  verification_test:
    "যাচাই পরীক্ষা",

  recent:
    "সাম্প্রতিক প্রশ্ন"

};


let currentCategory =
"recruitment";


let currentSession =
null;


let subjects =
[];


/* =========================
   SHORTCUT
========================= */

function $(id){

  return document.getElementById(id);

}


/* =========================
   HTML ESCAPE
========================= */

function esc(value){

  return String(value ?? "")
    .replace(/[&<>"']/g,function(m){

      return {

        "&":"&amp;",
        "<":"&lt;",
        ">":"&gt;",
        '"':"&quot;",
        "'":"&#039;"

      }[m];

    });

}


/* =========================
   MESSAGE
========================= */

function setMsg(
  id,
  text,
  success=false
){

  $(id).textContent =
    text || "";

  $(id).style.background =
    success
      ? "#dcfce7"
      : "#f1f5f9";

}


/* =========================
   SESSION
========================= */

async function checkSession(){

  const r =
    await sb.auth.getSession();

  if(r.error){

    console.error(r.error);

    return null;

  }

  return r.data.session;

}


/* =========================
   START
========================= */

async function boot(){

  currentSession =
    await checkSession();


  if(!currentSession){

    $("loginBox")
      .classList
      .remove("hidden");

    $("app")
      .classList
      .add("hidden");

    return;

  }


  $("loginBox")
    .classList
    .add("hidden");


  $("app")
    .classList
    .remove("hidden");


  await loadSubjects();

  await loadFolders();

}


/* =========================
   LOGIN
========================= */

$("loginBtn").onclick =
async function(){

  const email =
    $("loginEmail")
      .value
      .trim();


  const password =
    $("loginPassword")
      .value;


  if(!email || !password){

    setMsg(
      "loginMsg",
      "ইমেইল ও পাসওয়ার্ড দিন"
    );

    return;

  }


  setMsg(
    "loginMsg",
    "লগ ইন হচ্ছে..."
  );


  const r =
    await sb.auth.signInWithPassword({

      email:email,

      password:password

    });


  if(r.error){

    setMsg(
      "loginMsg",
      r.error.message
    );

    return;

  }


  currentSession =
    r.data.session;


  $("loginPassword")
    .value="";


  $("loginBox")
    .classList
    .add("hidden");


  $("app")
    .classList
    .remove("hidden");


  await loadSubjects();

  await loadFolders();

};


/* =========================
   LOGOUT
========================= */

$("logoutBtn").onclick =
async function(){

  await sb.auth.signOut();

  location.reload();

};


/* =========================
   CATEGORY
========================= */

document
.querySelectorAll(".tab")
.forEach(function(btn){

  btn.onclick =
  async function(){

    document
      .querySelectorAll(".tab")
      .forEach(function(x){

        x.classList
          .remove("active");

      });


    btn.classList
      .add("active");


    currentCategory =
      btn.dataset.cat;


    $("folderSelect")
      .innerHTML =
      '<option value="">ফোল্ডার নির্বাচন করুন</option>';


    $("setSelect")
      .innerHTML =
      '<option value="">সেট নির্বাচন করুন</option>';


    $("questionList")
      .innerHTML="";


    setMsg(
      "fsMsg",
      ""
    );


    await loadFolders();

  };

});


/* =========================
   SUBJECTS
========================= */

async function loadSubjects(){

  const r =
    await sb
      .from("subjects")
      .select("id,name")
      .order("id");


  if(r.error){

    setMsg(
      "addMsg",
      r.error.message
    );

    return;

  }


  subjects =
    r.data || [];


  $("subjectSelect")
    .innerHTML =
    '<option value="">বিষয় নির্বাচন করুন</option>' +

    subjects
      .map(function(s){

        return `
          <option value="${s.id}">
            ${esc(s.name)}
          </option>
        `;

      })
      .join("");


  $("filterSubject")
    .innerHTML =
    '<option value="">সব বিষয়</option>' +

    subjects
      .map(function(s){

        return `
          <option value="${s.id}">
            ${esc(s.name)}
          </option>
        `;

      })
      .join("");

}


/* =========================
   LOAD FOLDERS
========================= */

async function loadFolders(){

  const r =
    await sb
      .from("question_bank_folders")
      .select(
        "id,sub_category,folder_name"
      )
      .eq(
        "sub_category",
        CATS[currentCategory]
      )
      .order("id");


  if(r.error){

    setMsg(
      "fsMsg",
      "ফোল্ডার লোড হয়নি: " +
      r.error.message
    );

    return;

  }


  $("folderSelect")
    .innerHTML =
    '<option value="">ফোল্ডার নির্বাচন করুন</option>' +

    (r.data || [])
      .map(function(x){

        return `
          <option value="${x.id}">
            ${esc(x.folder_name)}
          </option>
        `;

      })
      .join("");


  $("setSelect")
    .innerHTML =
    '<option value="">সেট নির্বাচন করুন</option>';

}


/* =========================
   FOLDER SELECT
========================= */

$("folderSelect").onchange =
async function(){

  const id =
    $("folderSelect").value;


  $("setSelect")
    .innerHTML =
    '<option value="">সেট নির্বাচন করুন</option>';


  if(!id){

    return;

  }


  const r =
    await sb
      .from("question_bank_sets")
      .select("id,set_name")
      .eq(
        "folder_id",
        Number(id)
      )
      .order("id");


  if(r.error){

    setMsg(
      "fsMsg",
      r.error.message
    );

    return;

  }


  $("setSelect")
    .innerHTML =
    '<option value="">সেট নির্বাচন করুন</option>' +

    (r.data || [])
      .map(function(x){

        return `
          <option value="${x.id}">
            ${esc(x.set_name)}
          </option>
        `;

      })
      .join("");


  await loadQuestions();

};


/* =========================
   SET SELECT
========================= */

$("setSelect").onchange =
async function(){

  await loadQuestions();

};


/* =========================
   NEW FOLDER BOX
========================= */

$("newFolderBtn").onclick =
function(){

  $("folderBox")
    .classList
    .toggle("hidden");


  $("folderName")
    .focus();

};


/* =========================
   SAVE FOLDER
========================= */

$("saveFolderBtn").onclick =
async function(){

  const name =
    $("folderName")
      .value
      .trim();


  if(!name){

    setMsg(
      "fsMsg",
      "ফোল্ডারের নাম লিখুন"
    );

    return;

  }


  setMsg(
    "fsMsg",
    "ফোল্ডার তৈরি হচ্ছে..."
  );


  /*
    নিরাপত্তার জন্য INSERT policy
    authenticated user-এর জন্য রাখা হয়েছে।
  */

  const session =
    await checkSession();


  if(!session){

    setMsg(
      "fsMsg",
      "লগইন সেশন নেই। আবার লগইন করুন।"
    );

    $("loginBox")
      .classList
      .remove("hidden");

    $("app")
      .classList
      .add("hidden");

    return;

  }


  /* DUPLICATE CHECK */

  const dup =
    await sb
      .from("question_bank_folders")
      .select("id")
      .eq(
        "sub_category",
        CATS[currentCategory]
      )
      .eq(
        "folder_name",
        name
      )
      .maybeSingle();


  if(dup.error){

    setMsg(
      "fsMsg",
      "যাচাই করা যায়নি: " +
      dup.error.message
    );

    return;

  }


  if(dup.data){

    $("folderName")
      .value="";


    await loadFolders();


    $("folderSelect")
      .value =
      dup.data.id;


    await $("folderSelect")
      .onchange();


    setMsg(
      "fsMsg",
      "এই ফোল্ডার আগে থেকেই আছে। সেটি নির্বাচন করা হয়েছে।",
      true
    );

    return;

  }


  /* INSERT */

  const r =
    await sb
      .from("question_bank_folders")
      .insert({

        sub_category:
          CATS[currentCategory],

        folder_name:
          name

      })
      .select(
        "id,folder_name"
      )
      .single();


  if(r.error){

    setMsg(
      "fsMsg",
      "ফোল্ডার তৈরি হয়নি: " +
      r.error.message
    );

    return;

  }


  $("folderName")
    .value="";


  $("folderBox")
    .classList
    .add("hidden");


  await loadFolders();


  $("folderSelect")
    .value =
    r.data.id;


  await $("folderSelect")
    .onchange();


  setMsg(
    "fsMsg",
    "ফোল্ডার তৈরি হয়েছে। এখন সেট তৈরি করুন।",
    true
  );

};


/* =========================
   NEW SET BOX
========================= */

$("newSetBtn").onclick =
function(){

  if(!$("folderSelect").value){

    setMsg(
      "fsMsg",
      "আগে একটি ফোল্ডার নির্বাচন করুন"
    );

    return;

  }


  $("setBox")
    .classList
    .toggle("hidden");


  $("setName")
    .focus();

};


/* =========================
   SAVE SET
========================= */

$("saveSetBtn").onclick =
async function(){

  const folderId =
    Number(
      $("folderSelect").value
    );


  const name =
    $("setName")
      .value
      .trim();


  if(!folderId){

    setMsg(
      "fsMsg",
      "আগে একটি ফোল্ডার নির্বাচন করুন"
    );

    return;

  }


  if(!name){

    setMsg(
      "fsMsg",
      "সেটের নাম লিখুন"
    );

    return;

  }


  setMsg(
    "fsMsg",
    "সেট তৈরি হচ্ছে..."
  );


  const session =
    await checkSession();


  if(!session){

    setMsg(
      "fsMsg",
      "লগইন সেশন নেই। আবার লগইন করুন।"
    );

    return;

  }


  /* DUPLICATE CHECK */

  const dup =
    await sb
      .from("question_bank_sets")
      .select("id")
      .eq(
        "folder_id",
        folderId
      )
      .eq(
        "set_name",
        name
      )
      .maybeSingle();


  if(dup.error){

    setMsg(
      "fsMsg",
      "যাচাই করা যায়নি: " +
      dup.error.message
    );

    return;

  }


  if(dup.data){

    $("setName")
      .value="";


    await $("folderSelect")
      .onchange();


    $("setSelect")
      .value =
      dup.data.id;


    await loadQuestions();


    setMsg(
      "fsMsg",
      "এই সেট আগে থেকেই আছে। সেটি নির্বাচন করা হয়েছে।",
      true
    );

    return;

  }


  /* INSERT */

  const r =
    await sb
      .from("question_bank_sets")
      .insert({

        folder_id:
          folderId,

        set_name:
          name

      })
      .select(
        "id,set_name"
      )
      .single();


  if(r.error){

    setMsg(
      "fsMsg",
      "সেট তৈরি হয়নি: " +
      r.error.message
    );

    return;

  }


  $("setName")
    .value="";


  $("setBox")
    .classList
    .add("hidden");


  await $("folderSelect")
    .onchange();


  $("setSelect")
    .value =
    r.data.id;


  await loadQuestions();


  setMsg(
    "fsMsg",
    "সেট তৈরি হয়েছে। এখন প্রশ্ন যোগ করুন।",
    true
  );

};


/* =========================
   CHECK FOLDER / SET
========================= */

function selectedReady(){

  if(!$("folderSelect").value){

    setMsg(
      "addMsg",
      "আগে ফোল্ডার নির্বাচন করুন"
    );

    return false;

  }


  if(!$("setSelect").value){

    setMsg(
      "addMsg",
      "আগে সেট নির্বাচন করুন"
    );

    return false;

  }


  return true;

}


/* =========================
   FORM DATA
========================= */

function formData(){

  return {

    question_text:
      $("questionText")
      .value
      .trim(),

    option_a:
      $("a")
      .value
      .trim(),

    option_b:
      $("b")
      .value
      .trim(),

    option_c:
      $("c")
      .value
      .trim(),

    option_d:
      $("d")
      .value
      .trim(),

    correct_answer:
      $("correct")
      .value,

    explanation:
      $("explanation")
      .value
      .trim(),

    subject_id:
      Number(
        $("subjectSelect")
        .value
      ),

    source_name:
      $("sourceName")
      .value
      .trim() || null,

    question_number:
      $("questionNumber").value
        ? Number(
            $("questionNumber")
            .value
          )
        : null

  };

}


/* =========================
   CLEAR FORM
========================= */

function clearQuestionForm(){

  $("questionText").value="";

  $("a").value="";

  $("b").value="";

  $("c").value="";

  $("d").value="";

  $("correct").value="";

  $("explanation").value="";

  $("questionNumber").value="";

}


/* =========================
   ADD QUESTION
========================= */

$("addBtn").onclick =
async function(){

  if(!selectedReady()){

    return;

  }


  const d =
    formData();


  if(
    !d.question_text ||
    !d.option_a ||
    !d.option_b ||
    !d.option_c ||
    !d.option_d ||
    !d.correct_answer ||
    !d.subject_id
  ){

    setMsg(
      "addMsg",
      "প্রশ্ন, চারটি অপশন, সঠিক উত্তর ও বিষয় পূরণ করুন"
    );

    return;

  }


  setMsg(
    "addMsg",
    "প্রশ্ন যোগ হচ্ছে..."
  );


  /* DUPLICATE */

  const dup =
    await sb
      .from("questions")
      .select("id")
      .eq(
        "source_type",
        currentCategory
      )
      .eq(
        "folder_id",
        Number(
          $("folderSelect").value
        )
      )
      .eq(
        "set_id",
        Number(
          $("setSelect").value
        )
      )
      .eq(
        "question_text",
        d.question_text
      )
      .maybeSingle();


  if(dup.error){

    setMsg(
      "addMsg",
      "ডুপ্লিকেট যাচাই করা যায়নি: " +
      dup.error.message
    );

    return;

  }


  if(dup.data){

    setMsg(
      "addMsg",
      "এই প্রশ্নটি এই সেটে আগে থেকেই আছে"
    );

    return;

  }


  /* SOURCE */

  let sourceId =
    null;


  if(d.source_name){

    const src =
      await sb
        .from("question_sources")
        .select("id")
        .eq(
          "source_category",
          currentCategory
        )
        .eq(
          "source_name",
          d.source_name
        )
        .maybeSingle();


    if(src.error){

      setMsg(
        "addMsg",
        "উৎস যাচাই করা যায়নি: " +
        src.error.message
      );

      return;

    }


    if(src.data){

      sourceId =
        src.data.id;

    }else{

      const ins =
        await sb
          .from("question_sources")
          .insert({

            source_category:
              currentCategory,

            source_name:
              d.source_name

          })
          .select("id")
          .single();


      if(ins.error){

        setMsg(
          "addMsg",
          "উৎস তৈরি হয়নি: " +
          ins.error.message
        );

        return;

      }


      sourceId =
        ins.data.id;

    }

  }


  /* EXISTING SOURCE */

  if(!sourceId){

    const anySrc =
      await sb
        .from("question_sources")
        .select("id")
        .eq(
          "source_category",
          currentCategory
        )
        .order("id")
        .limit(1)
        .maybeSingle();


    if(anySrc.data){

      sourceId =
        anySrc.data.id;

    }

  }


  if(!sourceId){

    setMsg(
      "addMsg",
      "এই বিভাগের জন্য উৎসের নাম দিন"
    );

    return;

  }


  /* QUESTION INSERT */

  const payload={

    question_text:
      d.question_text,

    option_a:
      d.option_a,

    option_b:
      d.option_b,

    option_c:
      d.option_c,

    option_d:
      d.option_d,

    correct_answer:
      d.correct_answer,

    explanation:
      d.explanation || null,

    subject_id:
      d.subject_id,

    source_id:
      sourceId,

    source_type:
      currentCategory,

    source_name:
      d.source_name,

    folder_id:
      Number(
        $("folderSelect").value
      ),

    set_id:
      Number(
        $("setSelect").value
      ),

    question_number:
      d.question_number

  };


  const r =
    await sb
      .from("questions")
      .insert(payload);


  if(r.error){

    setMsg(
      "addMsg",
      "প্রশ্ন যোগ হয়নি: " +
      r.error.message
    );

    return;

  }


  clearQuestionForm();


  setMsg(
    "addMsg",
    "প্রশ্ন সফলভাবে যোগ হয়েছে।",
    true
  );


  await loadQuestions();

};


/* =========================
   LOAD QUESTIONS
========================= */

async function loadQuestions(){

  const setId =
    Number(
      $("setSelect").value
    );


  if(!setId){

    $("questionList")
      .innerHTML="";

    return;

  }


  let query =
    sb
      .from("questions")
      .select(
        "id,question_text,option_a,option_b,option_c,option_d,correct_answer,explanation,question_number,subject_id,source_name"
      )
      .eq(
        "source_type",
        currentCategory
      )
      .eq(
        "set_id",
        setId
      )
      .order(
        "question_number",
        {
          ascending:true
        }
      );


  const subject =
    $("filterSubject").value;


  if(subject){

    query =
      query.eq(
        "subject_id",
        Number(subject)
      );

  }


  const r =
    await query;


  if(r.error){

    $("questionList")
      .innerHTML =
      '<div class="msg">' +
      esc(r.error.message) +
      '</div>';

    return;

  }


  const rows =
    r.data || [];


  $("questionList")
    .innerHTML =
    rows.map(function(x,i){

      return `

        <div class="q">

          <b>
            ${x.question_number || i+1}.
            ${esc(x.question_text)}
          </b>

          <div class="opts">

            ক. ${esc(x.option_a)}<br>

            খ. ${esc(x.option_b)}<br>

            গ. ${esc(x.option_c)}<br>

            ঘ. ${esc(x.option_d)}

          </div>

          <div class="muted">

            সঠিক উত্তর:
            ${esc(x.correct_answer)}

            ${
              x.source_name
              ? " | উৎস: " +
                esc(x.source_name)
              : ""
            }

          </div>

          ${
            x.explanation
            ?
            `
            <div class="muted">
              ব্যাখ্যা:
              ${esc(x.explanation)}
            </div>
            `
            :
            ""
          }

          <button
            class="danger"
            style="margin-top:8px"
            onclick="deleteQuestion(${x.id})"
          >
            প্রশ্ন মুছুন
          </button>

        </div>

      `;

    }).join("")


    ||

    '<div class="msg">এই সেটে কোনো প্রশ্ন নেই</div>';

}


/* =========================
   SUBJECT FILTER
========================= */

$("filterSubject").onchange =
async function(){

  await loadQuestions();

};


/* =========================
   REFRESH
========================= */

$("refreshBtn").onclick =
async function(){

  await loadQuestions();

};


/* =========================
   DELETE QUESTION
========================= */

async function deleteQuestion(id){

  if(
    !confirm(
      "এই প্রশ্নটি মুছবেন?"
    )
  ){

    return;

  }


  const r =
    await sb
      .from("questions")
      .delete()
      .eq(
        "id",
        id
      );


  if(r.error){

    alert(
      r.error.message
    );

    return;

  }


  await loadQuestions();

}


/* =========================
   EXCEL / CSV IMPORT
========================= */

$("importBtn").onclick =
async function(){

  if(!selectedReady()){

    return;

  }


  const file =
    $("fileInput")
    .files[0];


  if(!file){

    setMsg(
      "importMsg",
      "আগে Excel/CSV ফাইল নির্বাচন করুন"
    );

    return;

  }


  setMsg(
    "importMsg",
    "ফাইল পড়া হচ্ছে..."
  );


  try{

    const buffer =
      await file.arrayBuffer();


    const workbook =
      XLSX.read(
        buffer,
        {
          type:"array"
        }
      );


    const sheet =
      workbook
        .Sheets[
          workbook.SheetNames[0]
        ];


    const rows =
      XLSX.utils.sheet_to_json(
        sheet,
        {
          defval:""
        }
      );


    if(!rows.length){

      setMsg(
        "importMsg",
        "ফাইলে কোনো প্রশ্ন পাওয়া যায়নি"
      );

      return;

    }


    let added=0;

    let skipped=0;

    let failed=0;


    for(
      const row of rows
    ){

      const d={

        question_text:
          String(
            row.question_text ||
            row["প্রশ্ন"] ||
            row.question ||
            ""
          ).trim(),

        option_a:
          String(
            row.option_a ||
            row["ক"] ||
            ""
          ).trim(),

        option_b:
          String(
            row.option_b ||
            row["খ"] ||
            ""
          ).trim(),

        option_c:
          String(
            row.option_c ||
            row["গ"] ||
            ""
          ).trim(),

        option_d:
          String(
            row.option_d ||
            row["ঘ"] ||
            ""
          ).trim(),

        correct_answer:
          String(
            row.correct_answer ||
            row["সঠিক উত্তর"] ||
            ""
          ).trim(),

        explanation:
          String(
            row.explanation ||
            row["ব্যাখ্যা"] ||
            ""
          ).trim(),

        question_number:
          row.question_number ||
          row["প্রশ্ন নম্বর"] ||
          null,

        subject_id:
          row.subject_id ||
          null,

        source_name:
          String(
            row.source_name ||
            row["উৎস"] ||
            ""
          ).trim()

      };


      if(
        !d.question_text ||
        !d.option_a ||
        !d.option_b ||
        !d.option_c ||
        !d.option_d ||
        !d.correct_answer ||
        !d.subject_id
      ){

        failed++;

        continue;

      }


      const dup =
        await sb
          .from("questions")
          .select("id")
          .eq(
            "source_type",
            currentCategory
          )
          .eq(
            "folder_id",
            Number(
              $("folderSelect").value
            )
          )
          .eq(
            "set_id",
            Number(
              $("setSelect").value
            )
          )
          .eq(
            "question_text",
            d.question_text
          )
          .maybeSingle();


      if(dup.data){

        skipped++;

        continue;

      }


      let sourceId =
        null;


      if(d.source_name){

        const sr =
          await sb
            .from("question_sources")
            .select("id")
            .eq(
              "source_category",
              currentCategory
            )
            .eq(
              "source_name",
              d.source_name
            )
            .maybeSingle();


        if(sr.data){

          sourceId =
            sr.data.id;

        }else{

          const si =
            await sb
              .from("question_sources")
              .insert({

                source_category:
                  currentCategory,

                source_name:
                  d.source_name

              })
              .select("id")
              .single();


          if(!si.error){

            sourceId =
              si.data.id;

          }

        }

      }


      if(!sourceId){

        const sr =
          await sb
            .from("question_sources")
            .select("id")
            .eq(
              "source_category",
              currentCategory
            )
            .order("id")
            .limit(1)
            .maybeSingle();


        if(sr.data){

          sourceId =
            sr.data.id;

        }

      }


      if(!sourceId){

        failed++;

        continue;

      }


      const ins =
        await sb
          .from("questions")
          .insert({

            question_text:
              d.question_text,

            option_a:
              d.option_a,

            option_b:
              d.option_b,

            option_c:
              d.option_c,

            option_d:
              d.option_d,

            correct_answer:
              d.correct_answer,

            explanation:
              d.explanation ||
              null,

            subject_id:
              Number(
                d.subject_id
              ),

            source_id:
              sourceId,

            source_type:
              currentCategory,

            source_name:
              d.source_name ||
              null,

            folder_id:
              Number(
                $("folderSelect").value
              ),

            set_id:
              Number(
                $("setSelect").value
              ),

            question_number:
              d.question_number
              ? Number(
                  d.question_number
                )
              : null

          });


      if(ins.error){

        failed++;

      }else{

        added++;

      }

    }


    $("fileInput")
      .value="";


    setMsg(
      "importMsg",
      "শেষ হয়েছে — যোগ: " +
      added +
      ", আগে ছিল: " +
      skipped +
      ", বাদ/ব্যর্থ: " +
      failed,
      true
    );


    await loadQuestions();


  }catch(error){

    setMsg(
      "importMsg",
      "ফাইল পড়তে সমস্যা হয়েছে: " +
      error.message
    );

  }

};
