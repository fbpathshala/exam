<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ফেইসবুক পাঠশালা — Question Bank</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box}body{margin:0;background:#f5f7fb;color:#172033;font-family:Arial,sans-serif}header{background:#1769aa;color:#fff;padding:14px 16px;display:flex;align-items:center}header b{font-size:18px}header button{margin-left:auto;background:none;border:0;color:#fff;font-size:14px}main{max-width:1100px;margin:auto;padding:16px}.card{background:#fff;border:1px solid #e2e8f0;border-radius:14px;padding:16px;margin-bottom:12px}h3{margin:0 0 12px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}input,select,textarea,button{width:100%;padding:11px;border-radius:9px;font:inherit}input,select,textarea{border:1px solid #cbd5e1;background:#fff}textarea{min-height:90px;resize:vertical}button{border:0;background:#1769aa;color:#fff;font-weight:700;cursor:pointer}.secondary{background:#64748b!important}.danger{background:#fee2e2!important;color:#991b1b!important}.row{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:end}.inline{display:flex;gap:8px;align-items:end}.inline>*{flex:1}.muted{color:#64748b;font-size:13px}.msg{margin-top:10px;font-size:14px}.q{border:1px solid #e2e8f0;border-radius:10px;padding:12px;margin-top:9px}.options{margin-top:8px;line-height:1.8}.hidden{display:none}.small{font-size:12px;color:#64748b}@media(max-width:700px){.grid{grid-template-columns:1fr}.row{grid-template-columns:1fr}.inline{display:grid;grid-template-columns:1fr auto}}</style></head><body><header><b>Question Bank</b><button onclick="go('dashboard.html')">ড্যাশবোর্ড</button></header><main><div class="card"><h3>ক্যাটাগরি</h3><div class="grid"><button onclick="selectCategory('recruitment')">নিয়োগ পরীক্ষা</button><button onclick="selectCategory('verification_test')">যাচাই পরীক্ষা</button><button onclick="selectCategory('recent')">সাম্প্রতিক প্রশ্ন</button></div></div><div class="card"><h3>ফোল্ডার ও সেট</h3><div class="row"><div><label>ফোল্ডার</label><select id="folderSelect"><option value="">ফোল্ডার নির্বাচন করুন</option></select></div><button onclick="showNewFolder()">＋ নতুন ফোল্ডার</button></div><div id="newFolderBox" class="hidden" style="margin-top:10px"><div class="inline"><input id="newFolderName" placeholder="নতুন ফোল্ডারের নাম"><button onclick="createFolder()">তৈরি করুন</button><button class="secondary" onclick="hideNewFolder()">বাতিল</button></div></div><div class="row" style="margin-top:12px"><div><label>সেট</label><select id="setSelect"><option value="">সেট নির্বাচন করুন</option></select></div><button onclick="showNewSet()">＋ নতুন সেট</button></div><div id="newSetBox" class="hidden" style="margin-top:10px"><div class="inline"><input id="newSetName" placeholder="নতুন সেটের নাম"><button onclick="createSet()">তৈরি করুন</button><button class="secondary" onclick="hideNewSet()">বাতিল</button></div></div><div id="folderSetMsg" class="msg"></div></div><div class="card"><h3>প্রশ্ন যোগ করুন</h3><div class="grid"><div><label>বিষয়</label><select id="subjectSelect"><option value="">বিষয় নির্বাচন করুন</option></select></div><div><label>প্রশ্ন নম্বর</label><input id="questionNumber" type="number" placeholder="প্রশ্ন নম্বর"></div></div><div style="margin-top:10px"><label>Source</label><select id="sourceSelect"><option value="">Source নির্বাচন করুন</option></select></div><div style="margin-top:10px"><label>প্রশ্ন</label><textarea id="questionText" placeholder="প্রশ্ন লিখুন"></textarea></div><div class="grid" style="margin-top:10px"><input id="optionA" placeholder="ক. অপশন"><input id="optionB" placeholder="খ. অপশন"><input id="optionC" placeholder="গ. অপশন"><input id="optionD" placeholder="ঘ. অপশন"></div><div class="grid" style="margin-top:10px"><select id="correctAnswer"><option value="">সঠিক উত্তর নির্বাচন করুন</option><option value="A">ক</option><option value="B">খ</option><option value="C">গ</option><option value="D">ঘ</option></select><input id="explanation" placeholder="ব্যাখ্যা (ঐচ্ছিক)"></div><button id="addQuestionBtn" style="margin-top:10px" onclick="addQuestion()">প্রশ্ন যোগ করুন</button><div id="questionMsg" class="msg"></div></div><div class="card"><h3>প্রশ্ন তালিকা / ফিল্টার</h3><div class="grid"><select id="filterFolder"><option value="">ফোল্ডার নির্বাচন করুন</option></select><select id="filterSet"><option value="">সেট নির্বাচন করুন</option></select></div><div style="margin-top:10px"><select id="filterSubject"><option value="">সব বিষয়</option></select></div><button style="margin-top:10px" onclick="loadQuestions()">প্রশ্ন দেখুন</button><div id="questionList"></div></div></main><script>const sb=supabase.createClient("https://ydvbnalhcnfqpxkkmywr.supabase.co","sb_publishable_xCbSWDkASsbUPl-WmygyMw_eVrJY_9a");const CATS={recruitment:"নিয়োগ পরীক্ষা",verification_test:"যাচাই পরীক্ষা",recent:"সাম্প্রতিক প্রশ্ন"};let currentCategory="verification_test",sources=[];const $=id=>document.getElementById(id);function go(x){location.href=x}async function auth(){const{data:{session}}=await sb.auth.getSession();if(!session){location.href="admin.html";return false}return true}function selectCategory(c){currentCategory=c;loadSources();loadFolders();loadFilterFolders();$("folderSetMsg").textContent=""}function showNewFolder(){$("newFolderBox").classList.remove("hidden");$("newFolderName").focus()}function hideNewFolder(){$("newFolderBox").classList.add("hidden");$("newFolderName").value=""}function showNewSet(){if(!$('folderSelect').value){$('folderSetMsg').textContent='আগে ফোল্ডার নির্বাচন করুন';return}$("newSetBox").classList.remove("hidden");$("newSetName").focus()}function hideNewSet(){$("newSetBox").classList.add("hidden");$("newSetName").value=""}function esc(v){return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",""":"&quot;","'":"&#039;"}[m]))}function bn(n){return String(n).replace(/[0-9]/g,d=>'০১২৩৪৫৬৭৮৯'[d])}function ans(a){return({A:'ক',B:'খ',C:'গ',D:'ঘ'})[a]||a||''}
async function loadFolders(selected=null){const r=await sb.from('question_bank_folders').select('id,folder_name').eq('sub_category',CATS[currentCategory]).order('id');if(r.error){$('folderSetMsg').textContent=r.error.message;return}$('folderSelect').innerHTML='<option value="">ফোল্ডার নির্বাচন করুন</option>'+(r.data||[]).map(x=>`<option value="${x.id}">${esc(x.folder_name)}</option>`).join('');if(selected)$('folderSelect').value=selected;await folderChanged()}
async function loadFilterFolders(selected=null){const r=await sb.from('question_bank_folders').select('id,folder_name').eq('sub_category',CATS[currentCategory]).order('id');if(r.error)return;$('filterFolder').innerHTML='<option value="">ফোল্ডার নির্বাচন করুন</option>'+(r.data||[]).map(x=>`<option value="${x.id}">${esc(x.folder_name)}</option>`).join('');if(selected)$('filterFolder').value=selected;await loadFilterSets()}
async function folderChanged(){const id=$('folderSelect').value;$('setSelect').innerHTML='<option value="">সেট নির্বাচন করুন</option>';if(!id)return;const r=await sb.from('question_bank_sets').select('id,set_name').eq('folder_id',Number(id)).order('id');if(r.error){$('folderSetMsg').textContent=r.error.message;return}$('setSelect').innerHTML='<option value="">সেট নির্বাচন করুন</option>'+(r.data||[]).map(x=>`<option value="${x.id}">${esc(x.set_name)}</option>`).join('')}
async function loadFilterSets(selected=null){const id=$('filterFolder').value;$('filterSet').innerHTML='<option value="">সেট নির্বাচন করুন</option>';if(!id)return;const r=await sb.from('question_bank_sets').select('id,set_name').eq('folder_id',Number(id)).order('id');if(r.error)return;$('filterSet').innerHTML='<option value="">সেট নির্বাচন করুন</option>'+(r.data||[]).map(x=>`<option value="${x.id}">${esc(x.set_name)}</option>`).join('');if(selected)$('filterSet').value=selected}
$('folderSelect').addEventListener('change',folderChanged);$('filterFolder').addEventListener('change',loadFilterSets);
async function createFolder(){const name=$('newFolderName').value.trim();if(!name){$('folderSetMsg').textContent='ফোল্ডারের নাম লিখুন';return}$('folderSetMsg').textContent='ফোল্ডার তৈরি হচ্ছে...';const r=await sb.rpc('create_question_bank_folder',{p_sub_category:CATS[currentCategory],p_folder_name:name});if(r.error){$('folderSetMsg').textContent=r.error.message;return}const f=Array.isArray(r.data)?r.data[0]:r.data;hideNewFolder();await loadFolders(f?.id||null);await loadFilterFolders(f?.id||null);if(f?.id){$('folderSelect').value=String(f.id);await folderChanged()}$('folderSetMsg').textContent='✅ ফোল্ডার তৈরি হয়েছে'}
async function createSet(){const folderId=$('folderSelect').value,name=$('newSetName').value.trim();if(!folderId){$('folderSetMsg').textContent='আগে ফোল্ডার নির্বাচন করুন';return}if(!name){$('folderSetMsg').textContent='সেটের নাম লিখুন';return}$('folderSetMsg').textContent='সেট তৈরি হচ্ছে...';const r=await sb.rpc('create_question_bank_set',{p_folder_id:Number(folderId),p_set_name:name});if(r.error){$('folderSetMsg').textContent=r.error.message;return}const s=Array.isArray(r.data)?r.data[0]:r.data;hideNewSet();await folderChanged();if(s?.id)$('setSelect').value=String(s.id);$('folderSetMsg').textContent='✅ সেট তৈরি হয়েছে'}
async function loadSubjects(){const r=await sb.from('subjects').select('id,name').order('id');if(r.error){$('questionMsg').textContent=r.error.message;return}const d=r.data||[];$('subjectSelect').innerHTML='<option value="">বিষয় নির্বাচন করুন</option>'+d.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('');$('filterSubject').innerHTML='<option value="">সব বিষয়</option>'+d.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('')}
async function loadSources(){const r=await sb.from('question_sources').select('id,source_name,source_category,exam_name').order('id');if(r.error){$('questionMsg').textContent=r.error.message;return}sources=r.data||[];const d=sources.filter(x=>x.source_category===currentCategory);$('sourceSelect').innerHTML='<option value="">Source নির্বাচন করুন</option>'+d.map(x=>`<option value="${x.id}">${esc(x.source_name||x.exam_name||('Source #'+x.id))}</option>`).join('')}
async function addQuestion(){const folderId=$('folderSelect').value,setId=$('setSelect').value,subjectId=$('subjectSelect').value,sourceId=$('sourceSelect').value,qn=$('questionNumber').value,qtext=$('questionText').value.trim(),a=$('optionA').value.trim(),b=$('optionB').value.trim(),c=$('optionC').value.trim(),d=$('optionD').value.trim(),correct=$('correctAnswer').value,explanation=$('explanation').value.trim();if(!folderId||!setId){$('questionMsg').textContent='আগে ফোল্ডার ও সেট নির্বাচন করুন';return}if(!subjectId){$('questionMsg').textContent='বিষয় নির্বাচন করুন';return}if(!sourceId){$('questionMsg').textContent='Source নির্বাচন করুন';return}if(!qtext||!a||!b||!c||!d){$('questionMsg').textContent='প্রশ্ন ও চারটি অপশন পূরণ করুন';return}if(!correct){$('questionMsg').textContent='সঠিক উত্তর নির্বাচন করুন';return}$('addQuestionBtn').disabled=true;$('questionMsg').textContent='প্রশ্ন যোগ হচ্ছে...';const source=sources.find(x=>String(x.id)===String(sourceId));const r=await sb.from('questions').insert({question_text:qtext,option_a:a,option_b:b,option_c:c,option_d:d,correct_answer:correct,explanation:explanation||null,subject_id:Number(subjectId),source_id:Number(sourceId),category:CATS[currentCategory],source_type:currentCategory,source_name:source?.source_name||source?.exam_name||null,folder_id:Number(folderId),set_id:Number(setId),question_number:qn?Number(qn):null});$('addQuestionBtn').disabled=false;if(r.error){$('questionMsg').textContent=r.error.message;return}$('questionMsg').textContent='✅ প্রশ্ন যোগ হয়েছে';['questionText','optionA','optionB','optionC','optionD','explanation','questionNumber'].forEach(id=>$(id).value='');$('correctAnswer').value='';await loadQuestions()}
async function loadQuestions(){let q=sb.from('questions').select('id,question_text,option_a,option_b,option_c,option_d,correct_answer,explanation,question_number,subject_id,folder_id,set_id,subjects(name),question_bank_folders(folder_name),question_bank_sets(set_name)').order('question_number',{ascending:true});if($('filterFolder').value)q=q.eq('folder_id',Number($('filterFolder').value));if($('filterSet').value)q=q.eq('set_id',Number($('filterSet').value));if($('filterSubject').value)q=q.eq('subject_id',Number($('filterSubject').value));const r=await q;if(r.error){$('questionList').innerHTML=esc(r.error.message);return}const d=r.data||[];$('questionList').innerHTML=d.length?d.map((x,i)=>`<div class="q"><b>${bn(i+1)}. ${esc(x.question_text)}</b><div class="options">ক. ${esc(x.option_a)}<br>খ. ${esc(x.option_b)}<br>গ. ${esc(x.option_c)}<br>ঘ. ${esc(x.option_d)}</div><div class="small">বিষয়: ${esc(x.subjects?.name||'')} | ফোল্ডার: ${esc(x.question_bank_folders?.folder_name||'')} | সেট: ${esc(x.question_bank_sets?.set_name||'')} | প্রশ্ন নম্বর: ${x.question_number??''}</div><div style="margin-top:8px"><b>উত্তর:</b> ${esc(ans(x.correct_answer))}</div>${x.explanation?`<div style="margin-top:5px"><b>ব্যাখ্যা:</b> ${esc(x.explanation)}</div>`:''}<button class="danger" style="margin-top:9px" onclick="deleteQuestion(${x.id})">প্রশ্ন মুছুন</button></div>`).join(''):'কোনো প্রশ্ন পাওয়া যায়নি'}
async function deleteQuestion(id){if(!confirm('প্রশ্নটি মুছবেন?'))return;const r=await sb.from('questions').delete().eq('id',id);if(r.error){alert(r.error.message);return}loadQuestions()}
(async()=>{if(!(await auth()))return;await loadSubjects();await loadSources();await loadFolders();await loadFilterFolders()})();</script></body></html>
