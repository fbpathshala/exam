<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>প্রশ্ন ব্যাংক</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  background:#f5f7fb;
  color:#172033;
  font-family:Arial,sans-serif
}

header{
  background:#1769aa;
  color:#fff;
  padding:14px 16px;
  display:flex;
  align-items:center
}

header b{font-size:18px}

header button{
  margin-left:auto;
  width:auto;
  background:none;
  color:#fff;
  border:0
}

main{
  max-width:1050px;
  margin:auto;
  padding:14px
}

.card{
  background:#fff;
  border:1px solid #e2e8f0;
  border-radius:14px;
  padding:15px;
  margin-bottom:12px
}

h3{
  margin:0 0 12px
}

label{
  display:block;
  font-size:14px;
  font-weight:700;
  margin-bottom:5px
}

select,input,textarea,button{
  width:100%;
  padding:11px;
  border-radius:9px;
  font:inherit
}

select,input,textarea{
  border:1px solid #cbd5e1;
  background:#fff
}

textarea{
  min-height:85px;
  resize:vertical
}

button{
  border:0;
  background:#1769aa;
  color:#fff;
  font-weight:700;
  cursor:pointer
}

.category-buttons{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:7px
}

.category-buttons button{
  background:#fff;
  color:#172033;
  border:1px solid #cbd5e1
}

.category-buttons button.active{
  background:#1769aa;
  color:#fff
}

.select-row{
  display:grid;
  grid-template-columns:1fr auto;
  gap:8px;
  margin-bottom:10px
}

.select-row button{
  width:auto;
  min-width:115px;
  white-space:nowrap
}

.small-form{
  display:none;
  background:#f8fafc;
  border:1px solid #e2e8f0;
  padding:10px;
  border-radius:10px;
  margin:6px 0 12px
}

.small-form.show{
  display:block
}

.small-form-row{
  display:grid;
  grid-template-columns:1fr auto;
  gap:8px
}

.small-form-row button{
  width:auto;
  min-width:90px
}

.status{
  margin-top:7px;
  font-size:13px;
  color:#475569
}

.section-note{
  background:#eff6ff;
  border-radius:9px;
  padding:9px 11px;
  font-size:13px;
  color:#1e40af;
  margin-bottom:12px
}

.grid2{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px
}

.grid3{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px
}

.question{
  background:#fff;
  border:1px solid #e2e8f0;
  border-radius:10px;
  padding:13px;
  margin-top:9px
}

.question-title{
  font-weight:700;
  line-height:1.6
}

.option{
  margin-top:5px;
  line-height:1.5
}

.meta{
  color:#64748b;
  font-size:13px;
  line-height:1.7;
  margin-top:9px
}

.badge{
  display:inline-block;
  background:#e0f2fe;
  color:#075985;
  border-radius:20px;
  padding:3px 8px;
  margin:2px 3px 2px 0;
  font-size:12px
}

.question-actions{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:7px;
  margin-top:10px
}

.secondary{
  background:#475569
}

.danger{
  background:#dc2626
}

.success{
  background:#15803d
}

.message{
  font-size:13px;
  margin-top:8px;
  color:#475569
}

.count{
  font-weight:700;
  margin-top:10px
}

@media(max-width:700px){

  .category-buttons{
    grid-template-columns:1fr
  }

  .select-row{
    grid-template-columns:1fr
  }

  .select-row button{
    width:100%
  }

  .small-form-row{
    grid-template-columns:1fr
  }

  .small-form-row button{
    width:100%
  }

  .grid2,
  .grid3{
    grid-template-columns:1fr
  }

  .question-actions{
    grid-template-columns:1fr
  }
}
</style>
</head>

<body>

<header>
  <b>প্রশ্ন ব্যাংক</b>
  <button onclick="go('dashboard.html')">ড্যাশবোর্ড</button>
</header>


<main>

<!-- =========================
     ১. CATEGORY
========================= -->

<div class="card">

  <h3>ক্যাটাগরি</h3>

  <div class="category-buttons">

    <button
      id="catRecruitment"
      class="active"
      onclick="changeCategory('recruitment')">
      নিয়োগ পরীক্ষা
    </button>

    <button
      id="catVerification"
      onclick="changeCategory('verification_test')">
      যাচাই পরীক্ষা
    </button>

    <button
      id="catRecent"
      onclick="changeCategory('recent')">
      সাম্প্রতিক প্রশ্ন
    </button>

  </div>

  <div
    id="categoryStatus"
    class="status">
    বর্তমান বিভাগ: নিয়োগ পরীক্ষা
  </div>

</div>


<!-- =========================
     ২. FOLDER + SET
========================= -->

<div class="card">

  <h3>ফোল্ডার ও সেট</h3>

  <div class="section-note">
    প্রথমে ফোল্ডার নির্বাচন করুন। তারপর সেই ফোল্ডারের সেট নির্বাচন করুন।
  </div>


  <!-- FOLDER -->

  <label>ফোল্ডার</label>

  <div class="select-row">

    <select
      id="folderSelect"
      onchange="folderChanged()">

      <option value="">
        ফোল্ডার নির্বাচন করুন
      </option>

    </select>

    <button
      type="button"
      onclick="toggleFolderForm()">
      ＋ নতুন ফোল্ডার
    </button>

  </div>


  <!-- NEW FOLDER FORM -->

  <div
    id="folderForm"
    class="small-form">

    <label>
      নতুন ফোল্ডারের নাম
    </label>

    <div class="small-form-row">

      <input
        id="newFolderName"
        placeholder="যেমন: ব্রেইন বুস্টার মডেল টেস্ট">

      <button
        onclick="createFolder()">
        তৈরি করুন
      </button>

    </div>

    <div
      id="folderMessage"
      class="message">
    </div>

  </div>


  <!-- SET -->

  <label>সেট</label>

  <div class="select-row">

    <select
      id="setSelect"
      onchange="setChanged()">

      <option value="">
        আগে ফোল্ডার নির্বাচন করুন
      </option>

    </select>

    <button
      type="button"
      onclick="toggleSetForm()">
      ＋ নতুন সেট
    </button>

  </div>


  <!-- NEW SET FORM -->

  <div
    id="setForm"
    class="small-form">

    <label>
      নতুন সেটের নাম
    </label>

    <div class="small-form-row">

      <input
        id="newSetName"
        placeholder="যেমন: সেট ১">

      <button
        onclick="createSet()">
        তৈরি করুন
      </button>

    </div>

    <div
      id="setMessage"
      class="message">
    </div>

  </div>


  <div
    id="selectionStatus"
    class="status">
    ফোল্ডার ও সেট নির্বাচন করুন।
  </div>

</div>


<!-- =========================
     ৩. QUESTION ADD
========================= -->

<div class="card">

  <h3>প্রশ্ন যোগ করুন</h3>

  <div class="section-note">
    উপরের ফোল্ডার ও সেট নির্বাচন করার পর এখানে প্রশ্ন যোগ করুন।
  </div>


  <div class="grid3">

    <div>

      <label>বিষয়</label>

      <select id="subjectSelect">

        <option value="">
          বিষয় নির্বাচন করুন
        </option>

      </select>

    </div>


    <div>

      <label>Source</label>

      <select id="sourceSelect">

        <option value="">
          Source নির্বাচন করুন
        </option>

      </select>

    </div>


    <div>

      <label>প্রশ্ন নম্বর</label>

      <input
        id="questionNumber"
        type="number"
        min="1"
        placeholder="যেমন: ১">

    </div>

  </div>


  <div style="margin-top:10px">

    <label>প্রশ্ন</label>

    <textarea
      id="questionText"
      placeholder="প্রশ্ন লিখুন">
    </textarea>

  </div>


  <div
    class="grid2"
    style="margin-top:10px">

    <input
      id="optionA"
      placeholder="ক অপশন">

    <input
      id="optionB"
      placeholder="খ অপশন">

    <input
      id="optionC"
      placeholder="গ অপশন">

    <input
      id="optionD"
      placeholder="ঘ অপশন">

  </div>


  <div
    class="grid2"
    style="margin-top:10px">

    <select id="correctAnswer">

      <option value="">
        সঠিক উত্তর নির্বাচন করুন
      </option>

      <option value="A">ক</option>
      <option value="B">খ</option>
      <option value="C">গ</option>
      <option value="D">ঘ</option>

    </select>


    <textarea
      id="explanation"
      placeholder="ব্যাখ্যা (ঐচ্ছিক)">
    </textarea>

  </div>


  <button
    id="saveButton"
    class="success"
    style="margin-top:10px"
    onclick="saveQuestion()">

    প্রশ্ন যোগ করুন

  </button>


  <div
    id="saveMessage"
    class="message">
  </div>

</div>


<!-- =========================
     ৪. QUESTION LIST
========================= -->

<div class="card">

  <h3>প্রশ্ন ব্যাংক</h3>

  <div class="grid3">

    <select
      id="filterFolder"
      onchange="filterFolderChanged()">

      <option value="">
        সব ফোল্ডার
      </option>

    </select>


    <select
      id="filterSet">

      <option value="">
        সব সেট
      </option>

    </select>


    <select
      id="filterSubject">

      <option value="">
        সব বিষয়
      </option>

    </select>

  </div>


  <button
    style="margin-top:10px"
    onclick="loadQuestions()">

    প্রশ্ন দেখুন

  </button>


  <div
    id="questionCount"
    class="count">
  </div>


  <div id="questionList"></div>

</div>

</main>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

/* =========================
   SUPABASE
========================= */

const sb = supabase.createClient(
  "https://ydvbnalhcnfqpxkkmywr.supabase.co",
  "sb_publishable_xCbSWDkASsbUPl-WmygyMw_eVrJY_9a"
);


/* =========================
   GLOBAL VARIABLES
========================= */

let currentCategory = "recruitment";

let editingId = null;

let subjects = [];

let sources = [];


/* =========================
   HELPERS
========================= */

function go(page){
  location.href = page;
}


function bn(value){

  return String(value ?? "")
    .replace(
      /\d/g,
      d => "০১২৩৪৫৬৭৮৯"[d]
    );

}


function esc(value){

  return String(value ?? "")
    .replace(
      /[&<>"']/g,
      char => ({
        "&":"&amp;",
        "<":"&lt;",
        ">":"&gt;",
        '"':"&quot;",
        "'":"&#39;"
      }[char])
    );

}


function answerBn(answer){

  return {
    A:"ক",
    B:"খ",
    C:"গ",
    D:"ঘ"
  }[answer] || answer || "";

}


function categoryTitle(category){

  return {
    recruitment:"নিয়োগ পরীক্ষা",
    verification_test:"যাচাই পরীক্ষা",
    recent:"সাম্প্রতিক প্রশ্ন"
  }[category] || category;

}


/* =========================
   AUTH
========================= */

async function checkAuth(){

  const {
    data:{
      session
    }
  } = await sb.auth.getSession();


  if(!session){

    location.href = "admin.html";

    return false;
  }


  return true;
}


/* =========================
   CATEGORY
========================= */

async function changeCategory(category){

  currentCategory = category;


  document
    .querySelectorAll(".category-buttons button")
    .forEach(
      button =>
        button.classList.remove("active")
    );


  if(category === "recruitment")
    catRecruitment.classList.add("active");


  if(category === "verification_test")
    catVerification.classList.add("active");


  if(category === "recent")
    catRecent.classList.add("active");


  categoryStatus.textContent =
    "বর্তমান বিভাগ: " +
    categoryTitle(category);


  closeForms();

  clearQuestionForm();


  await loadFolders();

  await loadQuestions();

}


/* =========================
   LOAD SUBJECTS
========================= */

async function loadSubjects(){

  const result =
    await sb
      .from("subjects")
      .select("id,name")
      .order("id");


  if(result.error){

    saveMessage.textContent =
      result.error.message;

    return;
  }


  subjects =
    result.data || [];


  subjectSelect.innerHTML =
    '<option value="">বিষয় নির্বাচন করুন</option>' +

    subjects
      .map(subject =>

        `<option value="${subject.id}">
          ${esc(subject.name)}
        </option>`

      )
      .join("");


  filterSubject.innerHTML =
    '<option value="">সব বিষয়</option>' +

    subjects
      .map(subject =>

        `<option value="${subject.id}">
          ${esc(subject.name)}
        </option>`

      )
      .join("");

}


/* =========================
   LOAD SOURCES
========================= */

async function loadSources(){

  const result =
    await sb
      .from("question_sources")
      .select("id,source_name")
      .order(
        "id",
        {ascending:false}
      );


  if(result.error){

    sourceSelect.innerHTML =
      '<option value="">Source পাওয়া যায়নি</option>';

    return;
  }


  sources =
    result.data || [];


  sourceSelect.innerHTML =
    '<option value="">Source নির্বাচন করুন</option>' +

    sources
      .map(source =>

        `<option value="${source.id}">
          ${esc(source.source_name || "")}
        </option>`

      )
      .join("");

}


/* =========================
   FOLDER FORM
========================= */

function toggleFolderForm(){

  folderForm.classList.toggle("show");

  if(
    folderForm.classList.contains("show")
  ){

    newFolderName.focus();

  }

}


function toggleSetForm(){

  if(!folderSelect.value){

    alert(
      "নতুন সেট তৈরি করতে আগে একটি ফোল্ডার নির্বাচন করুন।"
    );

    return;
  }


  setForm.classList.toggle("show");


  if(
    setForm.classList.contains("show")
  ){

    newSetName.focus();

  }

}


function closeForms(){

  folderForm.classList.remove("show");

  setForm.classList.remove("show");

}


/* =========================
   LOAD FOLDERS
========================= */

async function loadFolders(){

  folderSelect.innerHTML =
    '<option value="">ফোল্ডার নির্বাচন করুন</option>';


  filterFolder.innerHTML =
    '<option value="">সব ফোল্ডার</option>';


  const result =
    await sb
      .from("question_bank_folders")
      .select(
        "id,folder_name"
      )
      .eq(
        "sub_category",
        currentCategory
      )
      .order("folder_name");


  if(result.error){

    folderMessage.textContent =
      result.error.message;

    return;
  }


  const rows =
    result.data || [];


  rows.forEach(folder => {

    const option =
      document.createElement("option");

    option.value =
      folder.id;

    option.textContent =
      folder.folder_name;

    folderSelect.appendChild(option);


    const filterOption =
      document.createElement("option");

    filterOption.value =
      folder.id;

    filterOption.textContent =
      folder.folder_name;

    filterFolder.appendChild(
      filterOption
    );

  });


  await loadSets();

  await loadFilterSets();

}


/* =========================
   FOLDER CHANGE
========================= */

async function folderChanged(){

  setSelect.innerHTML =
    '<option value="">সেট নির্বাচন করুন</option>';


  selectionStatus.textContent =
    "সেট নির্বাচন করুন।";


  await loadSets();

}


/* =========================
   LOAD SETS
========================= */

async function loadSets(){

  const folderId =
    Number(folderSelect.value);


  setSelect.innerHTML =
    '<option value="">সেট নির্বাচন করুন</option>';


  if(!folderId){

    setSelect.innerHTML =
      '<option value="">আগে ফোল্ডার নির্বাচন করুন</option>';

    return;
  }


  const result =
    await sb
      .from("question_bank_sets")
      .select(
        "id,set_name"
      )
      .eq(
        "folder_id",
        folderId
      )
      .order("set_name");


  if(result.error){

    setMessage.textContent =
      result.error.message;

    return;
  }


  const rows =
    result.data || [];


  rows.forEach(set => {

    const option =
      document.createElement("option");

    option.value =
      set.id;

    option.textContent =
      set.set_name;

    setSelect.appendChild(option);

  });

}


/* =========================
   SET CHANGE
========================= */

function setChanged(){

  const folder =
    folderSelect.options[
      folderSelect.selectedIndex
    ]?.textContent || "";


  const set =
    setSelect.options[
      setSelect.selectedIndex
    ]?.textContent || "";


  if(
    folderSelect.value &&
    setSelect.value
  ){

    selectionStatus.textContent =
      "নির্বাচিত: " +
      folder +
      " → " +
      set;

  }

}


/* =========================
   CREATE FOLDER
========================= */

async function createFolder(){

  const name =
    newFolderName.value.trim();


  if(!name){

    folderMessage.textContent =
      "ফোল্ডারের নাম লিখুন।";

    return;
  }


  const result =
    await sb
      .from("question_bank_folders")
      .insert({

        sub_category:
          currentCategory,

        folder_name:
          name

      });


  if(result.error){

    folderMessage.textContent =
      result.error.message;

    return;
  }


  folderMessage.textContent =
    "ফোল্ডার তৈরি হয়েছে।";


  newFolderName.value = "";


  await loadFolders();


  /* নতুন তৈরি ফোল্ডারটি খুঁজে নির্বাচন */

  const created =
    await sb
      .from("question_bank_folders")
      .select("id")
      .eq(
        "sub_category",
        currentCategory
      )
      .eq(
        "folder_name",
        name
      )
      .single();


  if(
    !created.error &&
    created.data
  ){

    folderSelect.value =
      created.data.id;

    await loadSets();

  }


  setTimeout(() => {

    folderForm.classList.remove("show");

  },500);

}


/* =========================
   CREATE SET
========================= */

async function createSet(){

  const folderId =
    Number(folderSelect.value);


  const name =
    newSetName.value.trim();


  if(!folderId){

    setMessage.textContent =
      "আগে ফোল্ডার নির্বাচন করুন।";

    return;
  }


  if(!name){

    setMessage.textContent =
      "সেটের নাম লিখুন।";

    return;
  }


  const result =
    await sb
      .from("question_bank_sets")
      .insert({

        folder_id:
          folderId,

        set_name:
          name

      });


  if(result.error){

    setMessage.textContent =
      result.error.message;

    return;
  }


  setMessage.textContent =
    "সেট তৈরি হয়েছে।";


  newSetName.value = "";


  await loadSets();


  /* নতুন তৈরি সেটটি নির্বাচন */

  const created =
    await sb
      .from("question_bank_sets")
      .select("id")
      .eq(
        "folder_id",
        folderId
      )
      .eq(
        "set_name",
        name
      )
      .single();


  if(
    !created.error &&
    created.data
  ){

    setSelect.value =
      created.data.id;

    setChanged();

  }


  setTimeout(() => {

    setForm.classList.remove("show");

  },500);

}


/* =========================
   QUESTION FORM
========================= */

function clearQuestionForm(){

  editingId = null;


  saveButton.textContent =
    "প্রশ্ন যোগ করুন";


  questionText.value = "";

  optionA.value = "";

  optionB.value = "";

  optionC.value = "";

  optionD.value = "";

  questionNumber.value = "";

  correctAnswer.value = "";

  explanation.value = "";

}


async function saveQuestion(){

  saveMessage.textContent = "";


  const folderId =
    Number(folderSelect.value);

  const setId =
    Number(setSelect.value);

  const subjectId =
    Number(subjectSelect.value);

  const sourceId =
    Number(sourceSelect.value);


  const question =
    questionText.value.trim();

  const a =
    optionA.value.trim();

  const b =
    optionB.value.trim();

  const c =
    optionC.value.trim();

  const d =
    optionD.value.trim();

  const answer =
    correctAnswer.value;

  const number =
    Number(questionNumber.value) ||
    null;


  if(!folderId){

    saveMessage.textContent =
      "আগে ফোল্ডার নির্বাচন করুন।";

    return;
  }


  if(!setId){

    saveMessage.textContent =
      "আগে সেট নির্বাচন করুন।";

    return;
  }


  if(!subjectId){

    saveMessage.textContent =
      "বিষয় নির্বাচন করুন।";

    return;
  }


  if(!sourceId){

    saveMessage.textContent =
      "Source নির্বাচন করুন।";

    return;
  }


  if(
    !question ||
    !a ||
    !b ||
    !c ||
    !d ||
    !answer
  ){

    saveMessage.textContent =
      "প্রশ্ন, চারটি অপশন এবং সঠিক উত্তর পূরণ করুন।";

    return;
  }


  /*
    DUPLICATE PROTECTION
  */

  if(!editingId){

    const duplicate =
      await sb
        .from("questions")
        .select("id")
        .eq(
          "source_type",
          currentCategory
        )
        .eq(
          "folder_id",
          folderId
        )
        .eq(
          "set_id",
          setId
        )
        .eq(
          "question_text",
          question
        )
        .limit(1);


    if(duplicate.error){

      saveMessage.textContent =
        duplicate.error.message;

      return;
    }


    if(
      duplicate.data &&
      duplicate.data.length
    ){

      saveMessage.textContent =
        "এই সেটে একই প্রশ্ন ইতিমধ্যে আছে।";

      return;
    }

  }


  const source =
    sources.find(
      item =>
        Number(item.id) ===
        sourceId
    );


  const payload = {

    question_text:
      question,

    option_a:
      a,

    option_b:
      b,

    option_c:
      c,

    option_d:
      d,

    correct_answer:
      answer,

    explanation:
      explanation.value.trim() ||
      null,

    subject_id:
      subjectId,

    source_id:
      sourceId,

    category:
      categoryTitle(
        currentCategory
      ),

    source_type:
      currentCategory,

    source_name:
      source?.source_name ||
      null,

    folder_id:
      folderId,

    set_id:
      setId,

    question_number:
      number

  };


  let result;


  if(editingId){

    result =
      await sb
        .from("questions")
        .update(payload)
        .eq(
          "id",
          editingId
        );

  }else{

    result =
      await sb
        .from("questions")
        .insert(payload);

  }


  if(result.error){

    saveMessage.textContent =
      result.error.message;

    return;
  }


  saveMessage.textContent =
    editingId
      ? "প্রশ্ন আপডেট হয়েছে।"
      : "প্রশ্ন যোগ হয়েছে।";


  clearQuestionForm();


  await loadQuestions();

}


/* =========================
   EDIT QUESTION
========================= */

async function editQuestion(id){

  const result =
    await sb
      .from("questions")
      .select("*")
      .eq("id",id)
      .single();


  if(result.error){

    alert(result.error.message);

    return;
  }


  const q =
    result.data;


  editingId =
    q.id;


  folderSelect.value =
    q.folder_id || "";


  await loadSets();


  setSelect.value =
    q.set_id || "";


  subjectSelect.value =
    q.subject_id || "";


  sourceSelect.value =
    q.source_id || "";


  questionNumber.value =
    q.question_number || "";


  questionText.value =
    q.question_text || "";


  optionA.value =
    q.option_a || "";


  optionB.value =
    q.option_b || "";


  optionC.value =
    q.option_c || "";


  optionD.value =
    q.option_d || "";


  correctAnswer.value =
    q.correct_answer || "";


  explanation.value =
    q.explanation || "";


  saveButton.textContent =
    "প্রশ্ন আপডেট করুন";


  setChanged();


  window.scrollTo({
    top:0,
    behavior:"smooth"
  });

}


/* =========================
   DELETE QUESTION
========================= */

async function deleteQuestion(id){

  if(
    !confirm(
      "এই প্রশ্নটি Question Bank থেকে মুছবেন?"
    )
  )
    return;


  const result =
    await sb
      .from("questions")
      .delete()
      .eq(
        "id",
        id
      );


  if(result.error){

    alert(
      result.error.message
    );

    return;
  }


  await loadQuestions();

}


/* =========================
   QUESTION DETAILS
========================= */

async function showQuestion(id){

  const result =
    await sb
      .from("questions")
      .select("*")
      .eq("id",id)
      .single();


  if(result.error){

    q.option_a +

    "\nখ. " +
    q.option_b +

    "\nগ. " +
    q.option_c +

    "\nঘ. " +
    q.option_d +

    "\n\nসঠিক উত্তর: " +

      q.correct_answer
    ) +

/* =========================
   FILTER SETS
========================= */

async function filterFolderChanged(){

  const folderId =
    Number(filterFolder.value);


  filterSet.innerHTML =
    '<option value="">সব সেট</option>';


  if(!folderId){

    await loadQuestions();

    return;
  }


  const result =
    await sb
      .from("question_bank_sets")
      .select(
        "id,set_name"
      )
      .eq(
        "folder_id",
        folderId
      )
      .order("set_name");


  if(result.error)
    return;


  (result.data || [])
    .forEach(set => {

      const option =
        document.createElement(
          "option"
        );

      option.value =
        set.id;

      option.textContent =
        set.set_name;

      filterSet.appendChild(
        option
      );

    });

}


/* =========================
   LOAD FILTER SETS
========================= */

  filterSet.innerHTML =

      )
      .order("set_name");

  (result.data || [])

/* =========================
   LOAD QUESTIONS
========================= */

async function loadQuestions(){

  questionList.innerHTML =
    "লোড হচ্ছে...";


  const folderId =
    Number(filterFolder.value);


  const setId =
    Number(filterSet.value);


  const subjectId =
    Number(filterSubject.value);


  let query =
    sb
      .from("questions")
      .select(
        "*,subjects(name),question_bank_folders(folder_name),question_bank_sets(set_name),question_sources(source_name)"
      )
      .eq(
        "source_type",
        currentCategory
      )
      .order(
        "question_number",
        {
          ascending:true,
          nullsFirst:false
        }
      )
      .order(
        "id",
        {
          ascending:true
        }
      );


  if(folderId){

    query =
      query.eq(
        "folder_id",
        folderId
      );

  }


  if(setId){

    query =
      query.eq(
        "set_id",
        setId
      );

  }


  if(subjectId){

    query =
      query.eq(
        "subject_id",
        subjectId
      );

  }


  const result =
    await query;


  if(result.error){

    questionList.innerHTML = "";

    questionCount.textContent =
      result.error.message;

    return;
  }


  const rows =
    result.data || [];


  questionCount.textContent =
    "মোট প্রশ্ন: " +
    bn(rows.length);


  if(!rows.length){

    questionList.innerHTML =
      "কোনো প্রশ্ন পাওয়া যায়নি.";

    return;
  }


  questionList.innerHTML =
    rows
      .map(
        (q,index) => {

          const subject =
            q.subjects?.name ||
            "";

          const folder =
            q.question_bank_folders
              ?.folder_name ||
            "";

          const set =
            q.question_bank_sets
              ?.set_name ||
            "";

          const source =
            q.question_sources
              ?.source_name ||
            q.source_name ||
            "";


          return `

          <div class="question">

            <div class="question-title">

              ${bn(index + 1)}.
              ${esc(q.question_text)}

            </div>


            <div class="option">
              ক. ${esc(q.option_a)}
            </div>

            <div class="option">
              খ. ${esc(q.option_b)}
            </div>

            <div class="option">
              গ. ${esc(q.option_c)}
            </div>

            <div class="option">
              ঘ. ${esc(q.option_d)}
            </div>


            <div class="meta">

              <span class="badge">
                ${esc(subject)}
              </span>

              <span class="badge">
                ${esc(
                  categoryTitle(
                    currentCategory
                  )
                )}
              </span>

              <br>

              ফোল্ডার:
              ${esc(folder)}

              |

              সেট:
              ${esc(set)}

              |

              প্রশ্ন নম্বর:
              ${bn(
                q.question_number ||
                "—"
              )}

              <br>

              Source:
              ${esc(source)}

              |

              সঠিক উত্তর:
              ${esc(
                answerBn(
                  q.correct_answer
                )
              )}

            </div>


            <div class="question-actions">

              <button
                onclick="editQuestion(${q.id})">
                এডিট
              </button>


              <button
                class="secondary"
                onclick="showQuestion(${q.id})">
                বিস্তারিত
              </button>


              <button
                class="danger"
                onclick="deleteQuestion(${q.id})">
                মুছুন
              </button>

            </div>

          </div>

          `;

        }
      )
      .join("");

}
