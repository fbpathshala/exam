<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>প্রশ্ন ব্যাংক</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  background:#f5f7fb;
  font-family:Arial,sans-serif;
  color:#172033
}

header{
  background:#1769aa;
  color:#fff;
  padding:14px 16px;
  display:flex;
  align-items:center
}

header button{
  margin-left:auto;
  width:auto;
  background:none;
  border:0;
  color:#fff
}

main{
  max-width:1100px;
  margin:auto;
  padding:16px
}

.card{
  background:#fff;
  border:1px solid #e2e8f0;
  border-radius:14px;
  padding:16px;
  margin-bottom:12px
}

.grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px
}

.grid3{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px
}

.tabs{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
  margin-bottom:12px
}

input,select,button,textarea{
  width:100%;
  padding:11px;
  border-radius:9px;
  font:inherit
}

input,select,textarea{
  border:1px solid #cbd5e1;
  background:#fff
}

button{
  border:0;
  background:#1769aa;
  color:#fff;
  font-weight:700;
  cursor:pointer
}

.tab{
  background:#fff;
  color:#172033;
  border:1px solid #cbd5e1
}

.tab.active{
  background:#1769aa;
  color:#fff
}

.q{
  border:1px solid #e2e8f0;
  border-radius:10px;
  padding:14px;
  margin-top:10px;
  background:#fff
}

.qtitle{
  font-weight:700;
  line-height:1.6
}

.option{
  margin-top:5px;
  line-height:1.5
}

.meta{
  color:#64748b;
  font-size:13px;
  margin-top:8px;
  line-height:1.7
}

.actions{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:7px;
  margin-top:10px
}

.secondary{
  background:#475569
}

.danger{
  background:#dc2626
}

.success{
  background:#15803d
}

.msg{
  margin-top:8px;
  color:#475569;
  font-size:14px
}

.badge{
  display:inline-block;
  padding:4px 8px;
  border-radius:20px;
  background:#e0f2fe;
  color:#075985;
  font-size:12px;
  margin-right:4px
}
