<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>প্রশ্ন ব্যাংক</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f7fb;font-family:Arial,sans-serif;color:#172033}header{background:#1769aa;color:#fff;padding:14px 16px;display:flex}header button{margin-left:auto;background:none;border:0;color:#fff}main{max-width:1100px;margin:auto;padding:16px}.tabs,.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.grid{grid-template-columns:repeat(2,1fr)}.card{background:#fff;border:1px solid #e2e8f0;border-radius:14px;padding:16px;margin-bottom:12px}button,input,select,textarea{width:100%;padding:11px;border-radius:9px;font:inherit}button{border:0;background:#1769aa;color:#fff;font-weight:700}input,select,textarea{border:1px solid #cbd5e1}.tab{background:#fff;color:#172033;border:1px solid #cbd5e1}.tab.active{background:#1769aa;color:#fff}.q{border:1px solid #e2e8f0;border-radius:10px;padding:12px;margin-top:9px}.danger{background:#fee2e2;color:#991b1b;margin-top:8px}.msg{margin-top:8px}@media(max-width:700px){.tabs,.grid{grid-template-columns:1fr}}</style></head><body><header><b>প্রশ্ন ব্যাংক</b><button onclick="go('dashboard.html')">ড্যাশবোর্ড</button></header><main><div class="tabs"><button class="tab active" data-cat="recruitment">ক. নিয়োগ পরীক্ষা</button><button class="tab" data-cat="verification_test">খ. যাচাই পরীক্ষা</button><button class="tab" data-cat="recent">গ. সাম্প্রতিক প্রশ্ন</button></div><div class="card"><h3>Folder তৈরি</h3><div class="grid"><input id="fn" placeholder="Folder-এর নাম"><button id="cf">Folder তৈরি</button></div><div id="fm" class="msg"></div></div><div class="card"><h3>Set / পরীক্ষা তৈরি</h3><select id="fs"><option value="">Folder নির্বাচন করুন</option></select><div class="grid"><input id="sn" placeholder="Set/পরীক্ষার নাম"><button id="cs">Set তৈরি</button></div><div id="sm" class="msg"></div></div><div class="card"><h3>Manual প্রশ্ন যোগ</h3><div class="grid"><select id="ss"><option value="">Set নির্বাচন করুন</option></select><input id="sub" type="number" placeholder="Subject ID"></div><textarea id="qt" rows="3" placeholder="প্রশ্ন"></textarea><div class="grid"><input id="a" placeholder="ক. অপশন"><input id="b" placeholder="খ. অপশন"><input id="c" placeholder="গ. অপশন"><input id="d" placeholder="ঘ. অপশন"></div><select id="ca"><option value="">সঠিক উত্তর</option><option>ক</option><option>খ</option><option>গ</option><option>ঘ</option></select><input id="ex" placeholder="ব্যাখ্যা"><button id="add">প্রশ্ন সংরক্ষণ</button><div id="qm" class="msg"></div></div><div class="card"><h3>প্রশ্ন তালিকা</h3><input id="sf" type="number" placeholder="Subject ID দিয়ে ফিল্টার"><button id="filter">ফিল্টার</button><div id="ql"></div></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const sb=supabase.createClient("https://ydvbnalhcnfqpxkkmywr.supabase.co","sb_publishable_xCbSWDkASsbUPl-WmygyMw_eVrJY_9a");let cat="recruitment",folders=[],sets=[];async function auth(){const {data:{session}}=await sb.auth.getSession();if(!session){location.href="admin.html";return false}return true}function go(x){location.href=x}async function loadFolders(){let r=await sb.from("question_bank_folders").select("*").eq("sub_category",cat).order("id");folders=r.data||[];fs.innerHTML='<option value="">Folder নির্বাচন করুন</option>'+folders.map(x=>`<option value="${x.id}">${x.folder_name}</option>`).join("");loadSets()}async function loadSets(){if(!fs.value){ss.innerHTML='<option value="">Set নির্বাচন করুন</option>';return}let r=await sb.from("question_bank_sets").select("*").eq("folder_id",Number(fs.value)).order("id");sets=r.data||[];ss.innerHTML='<option value="">Set নির্বাচন করুন</option>'+sets.map(x=>`<option value="${x.id}">${x.set_name}</option>`).join("")}async function loadQuestions(){let q=sb.from("questions").select("*").order("id",{ascending:false}).limit(100);if(sf.value)q=q.eq("subject_id",Number(sf.value));let r=await q;ql.innerHTML=(r.data||[]).map(x=>`<div class="q"><b>${x.question_text}</b><br>ক. ${x.option_a}<br>খ. ${x.option_b}<br>গ. ${x.option_c}<br>ঘ. ${x.option_d}<br><small>সঠিক: ${x.correct_answer} | প্রশ্ন নং: ${x.question_number??""}</small><button class="danger" onclick="delQ(${x.id})">Remove</button></div>`).join("")||"কোনো প্রশ্ন নেই"}cf.onclick=async()=>{if(!fn.value.trim())return;let r=await sb.from("question_bank_folders").insert({sub_category:cat,folder_name:fn.value.trim()});fm.textContent=r.error?r.error.message:"Folder তৈরি হয়েছে";if(!r.error){fn.value="";loadFolders()}};cs.onclick=async()=>{if(!fs.value||!sn.value.trim())return;let r=await sb.from("question_bank_sets").insert({folder_id:Number(fs.value),set_name:sn.value.trim()});sm.textContent=r.error?r.error.message:"Set তৈরি হয়েছে";if(!r.error){sn.value="";loadSets()}};fs.onchange=loadSets;add.onclick=async()=>{if(!ss.value||!qt.value.trim()||!sub.value||!ca.value){qm.textContent="প্রশ্ন, Set, Subject এবং সঠিক উত্তর দিন";return}let sid=Number(ss.value),r=await sb.from("questions").select("id",{count:"exact",head:true}).eq("set_id",sid),set=sets.find(x=>x.id===sid);let p={question_text:qt.value.trim(),option_a:a.value.trim(),option_b:b.value.trim(),option_c:c.value.trim(),option_d:d.value.trim(),correct_answer:ca.value,explanation:ex.value.trim()||null,subject_id:Number(sub.value),source_id:1,folder_id:Number(fs.value),set_id:sid,question_number:(r.count||0)+1,source_type:cat,source_name:set?.set_name||null};r=await sb.from("questions").insert(p);qm.textContent=r.error?r.error.message:"প্রশ্ন সংরক্ষণ হয়েছে";if(!r.error){qt.value=a.value=b.value=c.value=d.value=ex.value="";loadQuestions()}};filter.onclick=loadQuestions;document.querySelectorAll(".tab").forEach(x=>x.onclick=()=>{document.querySelectorAll(".tab").forEach(y=>y.classList.remove("active"));x.classList.add("active");cat=x.dataset.cat;loadFolders()});async function delQ(id){if(!confirm("Master Question মুছবেন?"))return;let r=await sb.from("questions").delete().eq("id",id);if(r.error)alert(r.error.message);else loadQuestions()}(async()=>{if(await auth()){loadFolders();loadQuestions()}})();</script></body></html>
