<!doctype html>
<html lang="bn">
<head>
<link rel="stylesheet" href="css/admin.css">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ফেইসবুক পাঠশালা — পরীক্ষা</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f4f7fb;color:#172033}.top{background:#2563eb;color:#fff;padding:20px}.wrap{max-width:900px;margin:20px auto;padding:0 14px}.card{background:#fff;border-radius:16px;padding:20px;margin-bottom:14px;box-shadow:0 4px 16px #0001}input,select{padding:12px;border:1px solid #ccd5e1;border-radius:10px;font-size:16px}input{width:100%}.exam{border:1px solid #e2e8f0;border-radius:14px;padding:16px;margin-top:12px}.btn{display:inline-block;background:#2563eb;color:#fff;padding:11px 15px;border-radius:10px;text-decoration:none;font-weight:bold;margin-top:10px}.error{background:#fee2e2;color:#991b1b}.muted{color:#64748b}
</style>
<style id="direct-dashboard-navigation">.direct-dashboard-nav{position:fixed;right:16px;bottom:16px;z-index:9999;display:inline-flex;align-items:center;gap:8px;padding:11px 16px;border-radius:999px;background:#1d4ed8;color:#fff!important;text-decoration:none!important;font:700 15px/1.2 Arial,sans-serif;box-shadow:0 5px 18px #0003;border:2px solid #fff}.direct-dashboard-nav:hover{background:#1e40af;transform:translateY(-1px)}@media print{.direct-dashboard-nav{display:none!important}}</style><style id="site-copy-deterrent">html,body{ -webkit-user-select:none!important; user-select:none!important; -webkit-touch-callout:none!important}input,textarea,select,[contenteditable="true"],[contenteditable=""],.allow-copy{ -webkit-user-select:text!important; user-select:text!important; -webkit-touch-callout:default!important} @media print{body{display:none!important}}</style><style id="exam-index-table-style">
.exam-index-wrap{width:100%;overflow-x:auto;border:1px solid #dbe5ef;border-radius:12px;background:#fff}
.exam-index{width:100%;border-collapse:collapse;min-width:420px;color:#172033}
.exam-index th{padding:13px 14px;background:#eaf2f8;color:#173f5f;text-align:left;font-size:13px;border-bottom:1px solid #cbd9e5}
.exam-index td{padding:13px 14px;border-bottom:1px solid #e5edf3;vertical-align:middle;font-size:14px;line-height:1.6}
.exam-index tbody tr:last-child td{border-bottom:0}.exam-index tbody tr:nth-child(even){background:#f8fbfd}
.exam-index .index-number{width:68px;text-align:center;font-weight:800;color:#42627c}
.exam-index .index-title{font-weight:650}.exam-index .index-action{width:150px;text-align:center}
.exam-index .btn{margin:0;padding:8px 12px;font-size:13px;white-space:nowrap}
.exam-closed{display:inline-block;padding:7px 12px;border-radius:7px;background:#f1f5f9;color:#64748b;font-size:13px;font-weight:750}
@media(max-width:520px){.exam-index th,.exam-index td{padding:10px 9px;font-size:12px}.exam-index .index-number{width:48px}.exam-index .index-action{width:125px}.exam-index .btn{padding:7px 9px;font-size:12px}}

#list.exam-index-host .exam-index-wrap{display:block!important;width:100%!important;max-width:100%;overflow-x:auto!important;visibility:visible!important;border:1px solid #cbd9e5!important;border-radius:12px;background:#fff!important}
#list.exam-index-host table.exam-index{display:table!important;visibility:visible!important;width:100%!important;min-width:420px;border-collapse:collapse!important;border-spacing:0!important;table-layout:auto!important}
#list.exam-index-host .exam-index thead{display:table-header-group!important}
#list.exam-index-host .exam-index tbody{display:table-row-group!important}
#list.exam-index-host .exam-index tr{display:table-row!important;visibility:visible!important}
#list.exam-index-host .exam-index th,#list.exam-index-host .exam-index td{display:table-cell!important;visibility:visible!important;padding:13px 14px!important;border-bottom:1px solid #dbe5ef!important;vertical-align:middle!important;text-align:left}
#list.exam-index-host .exam-index th{background:#eaf2f8!important;color:#173f5f!important;font-weight:800!important}
#list.exam-index-host .exam-index td{background:#fff;color:#172033}
#list.exam-index-host .exam-index tbody tr:nth-child(even) td{background:#f8fbfd!important}
#list.exam-index-host .exam-index .index-number{text-align:center!important;width:68px;font-weight:800}
#list.exam-index-host .exam-index .index-action{text-align:center!important;width:150px}
#list.exam-index-host .exam-index .btn{margin:0!important}
@media(max-width:520px){#list.exam-index-host .exam-index th,#list.exam-index-host .exam-index td{padding:10px 9px!important;font-size:12px!important}#list.exam-index-host .exam-index{min-width:390px!important}}</style></head>
<body data-fp-theme="premium">
<header class="top"><b>📚 ফেইসবুক পাঠশালা</b><div>পরীক্ষা</div></header>
<main class="wrap">
<section class="card"><h2>📝 পরীক্ষার তালিকা</h2><input id="search" placeholder="পরীক্ষার নাম খুঁজুন" oninput="render()"><br><br><select id="filter" onchange="render()"><option value="all">সব পরীক্ষা</option><option value="active">সক্রিয় পরীক্ষা</option></select></section>
<section id="list" class="card muted exam-index-host">পরীক্ষাগুলো লোড হচ্ছে…</section>
</main>
<script>
const sb=supabase.createClient('https://ydvbnalhcnfqpxkkmywr.supabase.co','sb_publishable_xCbSWDkASsbUPl-WmygyMw_eVrJY_9a');
const BN='০১২৩৪৫৬৭৮৯';let exams=[];
const bn=x=>String(x??'').replace(/\d/g,d=>BN[d]);
const esc=x=>String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
async function load(){
 try{
  const r=await sb.from('exams').select('id,exam_name,status,total_questions').order('id',{ascending:false});
  if(r.error) throw r.error;
  exams=r.data||[];
  const s=await sb.from('exam_settings').select('exam_id,total_questions,total_marks,duration_minutes,exam_date');
  if(!s.error){const map=new Map((s.data||[]).map(x=>[String(x.exam_id),x]));exams=exams.map(x=>({...x,...(map.get(String(x.id))||{})}));}
  render();
 }catch(e){const el=document.getElementById('list');el.className='card error';el.textContent='পরীক্ষাগুলো লোড করা যাচ্ছে না: '+(e.message||'অজানা সমস্যা');}
}
function render(){
 const q=document.getElementById('search').value.toLowerCase().trim(),f=document.getElementById('filter').value;
 const rows=exams.filter(e=>(f==='all'||String(e.status||'').toLowerCase()==='active')&&(!q||String(e.exam_name||'').toLowerCase().includes(q)));
 document.getElementById('list').innerHTML=rows.length?'<div class="exam-index-wrap"><table class="exam-index"><thead><tr><th scope="col">ক্রমিক</th><th scope="col">পরীক্ষার নাম</th><th scope="col">বিস্তারিত</th></tr></thead><tbody>'+rows.map((e,i)=>{const active=String(e.status||'').toLowerCase()==='active';return '<tr><td class="index-number">'+bn(i+1)+'</td><td class="index-title">'+esc(e.exam_name||'নামহীন পরীক্ষা')+'</td><td class="index-action">'+(active?'<a class="btn" href="index.html?exam='+encodeURIComponent(e.id)+'">পরীক্ষা শুরু করুন</a>':'<span class="exam-closed">বন্ধ</span>')+'</td></tr>'}).join('')+'</tbody></table></div>':'কোনো পরীক্ষা পাওয়া যায়নি';
}
load();
</script>
<a class="direct-dashboard-nav" href="dashboard.html" aria-label="ড্যাশবোর্ডে ফিরে যান">🏠 ড্যাশবোর্ড</a><script id="site-copy-deterrent-script">(function(){function editable(t){return !!(t&&t.closest&&t.closest('input,textarea,select,[contenteditable="true"],[contenteditable=""]'))}document.addEventListener('contextmenu',function(e){if(!editable(e.target))e.preventDefault()});document.addEventListener('selectstart',function(e){if(!editable(e.target))e.preventDefault()});document.addEventListener('copy',function(e){if(!editable(e.target))e.preventDefault()});document.addEventListener('cut',function(e){if(!editable(e.target))e.preventDefault()});document.addEventListener('keydown',function(e){if(editable(e.target))return;var k=(e.key||'').toLowerCase();if((e.ctrlKey||e.metaKey)&&['c','x','u','s','p'].includes(k)){e.preventDefault();e.stopPropagation()}if(e.key==='PrintScreen'){e.preventDefault()}} ,true)})();</script>
<script src="js/live-visitors.js?v=20261026-live2"></script>
</body></html>
