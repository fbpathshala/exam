<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dashboard</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f7fb;font-family:Arial,sans-serif;color:#172033}header{background:#1769aa;color:#fff;padding:14px 16px;display:flex;align-items:center}h1{font-size:20px;margin:0}.menu{margin-left:auto;position:relative}.menu>button{background:none;border:0;color:#fff;font-size:28px}.panel{position:absolute;right:0;top:40px;background:#fff;width:230px;padding:8px;border-radius:12px;box-shadow:0 8px 25px #0002;z-index:5}.panel button{display:block;width:100%;padding:12px;border:0;background:#fff;color:#172033;text-align:left}main{max-width:1100px;margin:auto;padding:18px}.card{background:#fff;border:1px solid #e2e8f0;border-radius:15px;padding:18px;margin-bottom:15px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.stat span{color:#64748b;font-size:14px}.stat strong{display:block;font-size:30px;margin-top:8px}@media(max-width:700px){.stats{grid-template-columns:repeat(2,1fr)}}</style></head><body><header><h1>ফেইসবুক পাঠশালা</h1><div class="menu"><button id="mb">☰</button><div id="mp" class="panel" hidden><button onclick="go('dashboard.html')">ড্যাশবোর্ড</button><button onclick="go('question-bank.html')">প্রশ্ন ব্যাংক</button><button onclick="go('exam-management.html')">পরীক্ষা পরিচালনা</button><button onclick="logout()">লগ আউট</button></div></div></header><main><div class="card"><h2>ড্যাশবোর্ড</h2><div id="adminEmail"></div></div><div class="stats"><div class="card stat"><span>মোট যুক্ত হওয়া প্রশ্ন</span><strong id="qc">0</strong></div><div class="card stat"><span>মোট পরীক্ষা</span><strong id="ec">0</strong></div><div class="card stat"><span>মোট পরীক্ষার্থী</span><strong id="pc">0</strong></div><div class="card stat"><span>সাইট ভিজিটর সংখ্যা</span><strong id="vc">—</strong></div></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const sb=supabase.createClient("https://ydvbnalhcnfqpxkkmywr.supabase.co","sb_publishable_xCbSWDkASsbUPl-WmygyMw_eVrJY_9a");async function init(){const {data:{session}}=await sb.auth.getSession();if(!session){location.href="admin.html";return}adminEmail.textContent=session.user.email||"";let r=await sb.from("questions").select("id",{count:"exact",head:true});qc.textContent=r.count??0;r=await sb.from("exams").select("id",{count:"exact",head:true});ec.textContent=r.count??0;r=await sb.from("participants").select("id",{count:"exact",head:true});pc.textContent=r.count??0}async function logout(){await sb.auth.signOut();location.href="admin.html"}function go(x){location.href=x}mb.onclick=()=>mp.hidden=!mp.hidden;init();</script></body></html>
