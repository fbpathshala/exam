<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ফেইসবুক পাঠশালা — ড্যাশবোর্ড</title><link rel="stylesheet" href="css/admin.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style> .dashboard-wrap{max-width:1100px;margin:auto;padding:18px}.dashboard-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}.dashboard-brand h1{margin:0;font-size:24px}.dashboard-brand p{margin:4px 0;color:#64748b;font-size:13px}.admin-menu{position:relative}.admin-menu-btn{width:46px!important;height:46px!important;padding:0!important;font-size:27px!important;background:#111827!important;color:#fff!important;border:0!important;border-radius:12px!important;cursor:pointer}.admin-menu-panel{position:absolute;right:0;top:54px;width:240px;background:#fff;border:1px solid #e5e7eb;border-radius:14px;box-shadow:0 16px 40px rgba(15,23,42,.18);padding:8px;z-index:10}.admin-menu-panel button{display:block;width:100%;margin:3px 0;text-align:left}.admin-menu-panel .logout{background:#dc2626}.smart-date{background:linear-gradient(135deg,#0f172a,#1e3a5f);color:#fff;border-radius:20px;padding:22px;margin-bottom:16px}.smart-date .label{font-size:12px;opacity:.72}.smart-date .today{font-size:25px;font-weight:800;margin:5px 0 12px}.smart-lines{display:flex;flex-wrap:wrap;gap:8px}.smart-pill{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.12);border-radius:999px;padding:7px 11px;font-size:13px}.smart-clock{font-size:30px;font-weight:800;margin-top:15px}.smart-zone{font-size:12px;opacity:.7}.dashboard-cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}.dashboard-stat{background:#fff;border:1px solid #e5e7eb;border-radius:18px;padding:18px;box-shadow:0 8px 22px rgba(15,23,42,.06)}.dashboard-stat .icon{font-size:25px}.dashboard-stat b{display:block;font-size:30px;margin:10px 0 3px}.dashboard-stat span{color:#64748b;font-size:13px;font-weight:700}.dashboard-stat small{display:block;color:#94a3b8;font-size:11px;margin-top:6px}.hidden{display:none!important}.status{margin-top:12px;color:#64748b;font-size:12px}.error{color:#b91c1c}@media(max-width:800px){.dashboard-cards{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:480px){.dashboard-wrap{padding:12px}.dashboard-brand h1{font-size:20px}.smart-date{padding:18px}.smart-date .today{font-size:21px}.smart-clock{font-size:26px}.dashboard-stat{padding:14px}.dashboard-stat b{font-size:25px}}</style></head><body><div id="login" class="center"><div class="card login"><h1>ফেইসবুক পাঠশালা</h1><h2>ড্যাশবোর্ড</h2><input id="email" type="email" placeholder="Admin Email"><input id="password" type="password" placeholder="Password"><button id="loginBtn">Login</button><p id="loginMsg" class="msg"></p></div></div><div id="app" class="hidden"><div class="dashboard-wrap"><header class="dashboard-top"><div class="dashboard-brand"><h1>ফেইসবুক পাঠশালা</h1><p>Admin Dashboard</p></div><div class="admin-menu"><button class="admin-menu-btn" id="adminMenuBtn" aria-label="মেনু">☰</button><div class="admin-menu-panel hidden" id="adminMenuPanel"><button onclick="location.href='dashboard.html'">🏠 ড্যাশবোর্ড</button><button onclick="location.href='admin.html'">🗂️ প্রশ্ন ব্যাংক / পরীক্ষা পরিচালনা</button><button class="logout" id="logoutBtn">🚪 লগ আউট</button></div></div></header><section class="smart-date"><div class="label">আজকের দিন • বাংলাদেশ সময়</div><div class="today" id="smartToday">লোড হচ্ছে...</div><div class="smart-lines"><span class="smart-pill" id="smartBangla">🌾 বাংলা: লোড হচ্ছে...</span><span class="smart-pill" id="smartHijri">🌙 হিজরি: লোড হচ্ছে...</span></div><div class="smart-clock" id="smartClock">--:--:--</div><div class="smart-zone">Asia/Dhaka • UTC+6</div></section><div class="dashboard-cards"><div class="dashboard-stat"><div class="icon">📝</div><b id="sQuestions">০</b><span>মোট প্রশ্ন</span></div><div class="dashboard-stat"><div class="icon">📋</div><b id="sExams">০</b><span>মোট পরীক্ষা</span></div><div class="dashboard-stat"><div class="icon">👨‍🎓</div><b id="sStudents">০</b><span>মোট পরীক্ষার্থী</span></div><div class="dashboard-stat"><div class="icon">👁️</div><b id="sVisitors">০</b><span>মোট ভিজিটর</span><small>একটি ব্রাউজার/ডিভাইসকে একজন ইউনিক ভিজিটর হিসেবে গণনা করা হয়।</small></div></div><div id="status" class="status"></div></div></div><script src="js/supabase.js"></script><script>(function(){const bn=n=>String(n??'').replace(/\d/g,d=>'০১২৩৪৫৬৭৮৯'[d]),m=['বৈশাখ','জ্যৈষ্ঠ','আষাঢ়','শ্রাবণ','ভাদ্র','আশ্বিন','কার্তিক','অগ্রহায়ণ','পৌষ','মাঘ','ফাল্গুন','চৈত্র'];function bd(d){let y=d.getFullYear(),s=new Date(y,3,14),by=y-593;if(d<s){by=y-594;s=new Date(y-1,3,14)}let i=Math.floor((d-s)/86400000),l=[31,31,31,31,31,30,30,30,30,30,30,30],x=0;while(x<11&&i>=l[x]){i-=l[x];x++}return bn(i+1)+' '+m[x]+' '+bn(by)}function clock(){let n=new Date(),p=new Intl.DateTimeFormat('en-US',{timeZone:'Asia/Dhaka',weekday:'long',month:'long',day:'numeric',year:'numeric',hour:'numeric',minute:'2-digit',second:'2-digit',hour12:true}).formatToParts(n),v=t=>p.find(x=>x.type===t)?.value||'',d=new Date(n.toLocaleString('en-US',{timeZone:'Asia/Dhaka'}));$('smartToday').textContent=v('month')+' '+v('day')+', '+v('year')+' • '+new Intl.DateTimeFormat('bn-BD',{timeZone:'Asia/Dhaka',weekday:'long'}).format(n);$('smartClock').textContent=v('hour')+':'+v('minute')+':'+v('second')+' '+v('dayPeriod');$('smartBangla').textContent='🌾 বাংলা: '+bd(d);try{$('smartHijri').textContent='🌙 হিজরি: '+new Intl.DateTimeFormat('bn-BD-u-ca-islamic',{timeZone:'Asia/Dhaka',day:'numeric',month:'long',year:'numeric'}).format(n)}catch(e){$('smartHijri').textContent='🌙 হিজরি: —'}}function $(id){return document.getElementById(id)}function set(id,v){$(id).textContent=bn(v||0)}async function stats(){let [q,e,s,v]=await Promise.all([db.from('questions').select('id',{count:'exact',head:true}),db.from('exams').select('id',{count:'exact',head:true}),db.from('students').select('id',{count:'exact',head:true}),db.from('site_visitors').select('id',{count:'exact',head:true})]);[q,e,s,v].forEach((x,i)=>{if(!x.error)set(['sQuestions','sExams','sStudents','sVisitors'][i],x.count)});let bad=[q,e,s,v].find(x=>x.error);if(bad) $('status').innerHTML='<span class="error">ডেটা লোডে সমস্যা: '+bad.error.message+'</span>'}async function init(){let {data,error}=await db.auth.getSession();if(error){$('loginMsg').textContent=error.message;return}if(data.session){$('login').classList.add('hidden');$('app').classList.remove('hidden');clock();setInterval(clock,1000);stats()}}$('loginBtn').onclick=async()=>{let {error}=await db.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(error){$('loginMsg').textContent=error.message;return}init()};$('logoutBtn').onclick=async()=>{await db.auth.signOut();location.reload()};$('adminMenuBtn').onclick=e=>{e.stopPropagation();$('adminMenuPanel').classList.toggle('hidden')};document.addEventListener('click',e=>{if(!e.target.closest('.admin-menu'))$('adminMenuPanel').classList.add('hidden')});init()})();</script></body></html>
