<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#102a43">
<title>প্রশ্ন ব্যাংক</title>
<style>
:root{font-family:system-ui,-apple-system,"Noto Sans Bengali",sans-serif;color:#102a43;background:#f3f7fb;--line:#dbe5ef}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:flex;flex-direction:column}
header{background:linear-gradient(125deg,#102a43,#0f766e);color:#fff;padding:28px 20px}
header h1{width:min(760px,100%);margin:0 auto;font-size:clamp(24px,4vw,32px)}
main{width:min(760px,100%);margin:auto;padding:28px 20px}
.division-picker{max-width:520px;margin:8px auto;padding:20px;background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:0 6px 20px #102a4308}
.division-picker label{display:block;font-weight:800;margin-bottom:10px}
.division-picker select{width:100%;min-height:50px;padding:12px;border:1px solid #b8c9d8;border-radius:10px;background:#fff;color:#102a43;font:inherit;font-weight:700}
.division-picker p{margin:12px 0 0;color:#607086;font-size:14px;line-height:1.6}
@media(max-width:520px){main{padding:20px 14px}}
</style>
</head>
<body>
<header><h1>🗂️ প্রশ্ন ব্যাংক</h1></header>
<main>
<section class="division-picker">
<label for="careDivision">বিভাগ নির্বাচন করুন</label>
<select id="careDivision" required>
<option value="" selected>বিভাগ নির্বাচন করুন</option>
<option value="job">Job Care</option>
<option value="academic">Academic Care</option>
</select>
<p id="divisionHint" aria-live="polite">বিভাগ নির্বাচন করলে শুধু সেই বিভাগের প্রশ্ন ব্যাংক খুলবে।</p>
</section>
<script>
document.getElementById('careDivision').addEventListener('change', function(){
  if(this.value === 'job') location.href = 'question-bank-type.html?care=job';
  else if(this.value === 'academic') location.href = 'https://fbpathshala.github.io/academic/admin.html?view=questionBank';
});
</script>
</main>
</body>
</html>
