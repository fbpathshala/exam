<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#102a43">
<title>প্রশ্ন ব্যাংক</title>
<style>
:root{font-family:system-ui,-apple-system,"Noto Sans Bengali",sans-serif;color:#102a43;background:#f3f7fb;--line:#dbe5ef}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:flex;flex-direction:column}
header{background:linear-gradient(125deg,#102a43,#0f766e);color:#fff;padding:28px 20px}
header h1{width:min(760px,100%);margin:0 auto;font-size:clamp(24px,4vw,32px)}
main{width:min(760px,100%);margin:auto;padding:28px 20px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.card{display:flex;align-items:center;justify-content:center;gap:14px;min-height:150px;padding:22px;background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:0 6px 20px #102a4308;text-decoration:none;color:#102a43;font-size:clamp(19px,3vw,23px);font-weight:800}
.card:focus-visible{outline:3px solid #0f766e;outline-offset:3px}.card.job{border-bottom:4px solid #2458d3}.card.academic{border-bottom:4px solid #0f766e}
.icon{font-size:34px}
@media(max-width:520px){main{padding:20px 14px}.grid{grid-template-columns:1fr}.card{min-height:105px}}
</style>
</head>
<body>
<header><h1>🗂️ প্রশ্ন ব্যাংক</h1></header>
<main>
<nav class="grid" aria-label="প্রশ্ন ব্যাংক নির্বাচন">
<a class="card job" href="question-bank-type.html?care=job"><span class="icon" aria-hidden="true">💼</span><span>Job Care</span></a>
<a class="card academic" href="question-bank-type.html?care=academic"><span class="icon" aria-hidden="true">🎓</span><span>Academic Care</span></a>
</nav>
</main>
</body>
</html>
