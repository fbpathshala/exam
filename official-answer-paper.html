<!doctype html>
<html lang="bn">
<head>
<link rel="stylesheet" href="css/admin.css">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>সঠিক উত্তরপত্র</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/docx@8.5.0/build/index.umd.js"></script>
<style>
body{margin:0;background:#eee;font-family:Arial,sans-serif;color:#172033}
.toolbar{text-align:center;background:#183c63;padding:12px;position:sticky;top:0;z-index:5}
.toolbar button{padding:10px;margin:4px;cursor:pointer}
.paper{width:210mm;min-height:297mm;background:white;margin:16px auto;padding:15mm;box-sizing:border-box}
.head{text-align:center;border-bottom:1px solid #555;padding-bottom:10px}
.meta{display:flex;justify-content:space-between;gap:8px;font-size:12px;flex-wrap:wrap}
.questions{column-count:2;column-gap:9mm;column-rule:1px solid #ddd;font-size:12px;line-height:1.5}
.q{break-inside:avoid;margin:0 0 12px}
.qt{font-weight:bold}
.opt{line-height:1.5}
.correct{font-weight:700}
.explanation{margin-top:5px;font-size:11px;line-height:1.5}
@page{size:A4;margin:0}
@media(max-width:800px){.paper{width:100%;padding:18px}.questions{column-gap:16px}}
@media print{.toolbar,#status{display:none}.paper{margin:0;width:auto;min-height:0;box-shadow:none;padding:15mm}.questions{column-count:2;font-size:11pt}}
</style>
<style id="direct-dashboard-navigation">.direct-dashboard-nav{position:fixed;right:16px;bottom:16px;z-index:9999;display:inline-flex;align-items:center;gap:8px;padding:11px 16px;border-radius:999px;background:#1d4ed8;color:#fff!important;text-decoration:none!important;font:700 15px/1.2 Arial,sans-serif;box-shadow:0 5px 18px #0003;border:2px solid #fff}.direct-dashboard-nav:hover{background:#1e40af;transform:translateY(-1px)}@media print{.direct-dashboard-nav{display:none!important}}</style><style id="site-copy-deterrent">html,body{-webkit-user-select:none!important;user-select:none!important;-webkit-touch-callout:none!important}input,textarea,select,[contenteditable="true"],[contenteditable=""]{-webkit-user-select:text!important;user-select:text!important;-webkit-touch-callout:default!important}html.admin-copy-enabled,html.admin-copy-enabled body,html.admin-copy-enabled body *{-webkit-user-select:text!important;user-select:text!important;-webkit-touch-callout:default!important}@media print{body{display:none!important}}</style></head>
<body data-fp-theme="premium">
<div class="toolbar"><button onclick="history.back()">← ফিরে যান</button><button onclick="downloadDocx()">📝 DOCX ডাউনলোড</button><button onclick="downloadPDF()">PDF ডাউনলোড</button><button onclick="window.print()">প্রিন্ট</button></div>
<p id="status" style="text-align:center">সঠিক উত্তরপত্র লোড হচ্ছে…</p>
<main class="paper"><header class="head"><h2 id="title">সঠিক উত্তরপত্র</h2><div class="meta"><span id="duration"></span><span id="total"></span><span id="marks"></span></div><p>সঠিক উত্তরে ✓ চিহ্নিত করা হয়েছে।</p></header><section id="questions" class="questions"></section></main>
<script src="js/supabase.js"></script>
<script>
const $=id=>document.getElementById(id),BN='০১২৩৪৫৬৭৮৯',LET={A:'ক',B:'খ',C:'গ',D:'ঘ'};
const bn=x=>String(x??'').replace(/\d/g,d=>BN[+d]);
const esc=x=>String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
let data=null,settings={};
function correct(q){const v=String(q.correct_answer??'').trim().toUpperCase();const m=v.match(/[ABCD]/);if(m)return m[0];const bnmap={'ক':'A','খ':'B','গ':'C','ঘ':'D','১':'A','২':'B','৩':'C','৪':'D'};return bnmap[v.charAt(0)]||''}
async function init(){
 try{
  const session=await db.auth.getSession();if(!session.data.session){location.href='admin.html';return}
  const id=Number(new URLSearchParams(location.search).get('exam'));if(!id)throw Error('Exam ID পাওয়া যায়নি।');
  const [er,lr,ir]=await Promise.all([
   db.from('exams').select('id,exam_name').eq('id',id).single(),
   db.from('exam_questions').select('question_id,question_order').eq('exam_id',id).order('question_order',{ascending:true}),
   db.from('exam_question_items').select('id,source_question_id,question_order,question_text,option_a,option_b,option_c,option_d,correct_answer,explanation').eq('exam_id',id).order('question_order',{ascending:true})
  ]);
  if(er.error)throw er.error;if(lr.error)throw lr.error;if(ir.error)throw ir.error;
  const sr=await db.from('exam_settings').select('*').eq('exam_id',id).maybeSingle();if(sr.error)throw sr.error;settings=sr.data||{};
  const legacy=lr.data||[],items=ir.data||[];
  // Use the saved exam snapshot when it is complete; otherwise fall back to the legacy exam_questions mapping.
  if(items.length && (!legacy.length || items.length>=legacy.length)){
   data={exam:er.data,questions:items.map(x=>({question_text:x.question_text,option_a:x.option_a,option_b:x.option_b,option_c:x.option_c,option_d:x.option_d,correct_answer:x.correct_answer,explanation:x.explanation,question_order:x.question_order}))};
  }else{
   if(!legacy.length)throw Error('এই পরীক্ষায় কোনো প্রশ্ন নেই।');
   const ids=legacy.map(x=>x.question_id);
   const qr=await db.from('questions').select('id,question_text,option_a,option_b,option_c,option_d,correct_answer,explanation').in('id',ids);
   if(qr.error)throw qr.error;
   const map=new Map((qr.data||[]).map(q=>[String(q.id),q]));
   data={exam:er.data,questions:legacy.map(x=>map.get(String(x.question_id))).filter(Boolean)};
  }
  if(!data.questions.length)throw Error('প্রশ্নের তথ্য পাওয়া যায়নি।');
  render();
 }catch(e){$('status').textContent='সঠিক উত্তরপত্র লোড হয়নি: '+(e.message||e);$('status').style.color='#b42318'}
}
function qtext(q){return q.question_text||q.question||''}
function opttext(q,k){return q['option_'+k.toLowerCase()]??q['option'+({A:1,B:2,C:3,D:4}[k])]??''}
function render(){
 $('title').textContent=data.exam.exam_name+' — সঠিক উত্তরপত্র';document.title=data.exam.exam_name+' — সঠিক উত্তরপত্র';
 $('duration').textContent='সময়: '+bn(settings.duration_minutes??20)+' মিনিট';
 $('total').textContent='প্রশ্ন: '+bn(data.questions.length);
 $('marks').textContent='পূর্ণমান: '+bn(settings.total_marks??data.questions.length*Number(settings.marks_per_question??1));
 $('questions').innerHTML=data.questions.map((q,i)=>{
  const c=correct(q);
  const opts=['A','B','C','D'].map(k=>'<div class="opt '+(c===k?'correct':'')+'">'+LET[k]+'. '+esc(opttext(q,k))+(c===k?' <b>✓</b>':'')+'</div>').join('');
  const exp=String(q.explanation||'').trim();
  return '<article class="q"><div class="qt">'+bn(i+1)+'. '+esc(qtext(q))+'</div>'+opts+(exp?'<div class="explanation"><b>ব্যাখ্যা:</b> '+esc(exp)+'</div>':'')+'</article>';
 }).join('');
 $('status').textContent='সঠিক উত্তরপত্র প্রস্তুত';
}
async function loadScript(src){return new Promise((resolve,reject)=>{const s=document.createElement('script');s.src=src;s.onload=resolve;s.onerror=reject;document.head.appendChild(s)})}
async function downloadPDF(){try{if(!window.html2canvas)await loadScript('https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js');if(!window.jspdf)await loadScript('https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js');const canvas=await html2canvas(document.querySelector('.paper'),{scale:2,backgroundColor:'#ffffff'});const{jsPDF}=window.jspdf;const pdf=new jsPDF('p','mm','a4');const pageH=Math.floor(canvas.width*297/210);let y=0,n=0;while(y<canvas.height){const h=Math.min(pageH,canvas.height-y),slice=document.createElement('canvas');slice.width=canvas.width;slice.height=h;slice.getContext('2d').drawImage(canvas,0,y,canvas.width,h,0,0,canvas.width,h);if(n)pdf.addPage();pdf.addImage(slice.toDataURL('image/png'),'PNG',0,0,210,h*210/canvas.width);y+=h;n++}pdf.save((document.title||'answer-paper')+'.pdf')}catch(e){alert('PDF তৈরি করা যায়নি: '+e.message)}}
async function downloadDocx(){try{if(!data)return;const{Document,Packer,Paragraph,TextRun,AlignmentType}=window.docx;const children=[new Paragraph({text:data.exam.exam_name,heading:'Heading1',alignment:AlignmentType.CENTER}),new Paragraph({text:'সঠিক উত্তর ও ব্যাখ্যাসহ সঠিক উত্তরপত্র',alignment:AlignmentType.CENTER}),new Paragraph({text:'সময়: '+(settings.duration_minutes??20)+' মিনিট   প্রশ্ন: '+data.questions.length+'   পূর্ণমান: '+(settings.total_marks??data.questions.length*Number(settings.marks_per_question??1)),alignment:AlignmentType.CENTER})];data.questions.forEach((q,i)=>{children.push(new Paragraph({spacing:{before:140,after:60},children:[new TextRun({text:bn(i+1)+'. '+qtext(q),bold:true})]}));const c=correct(q);['A','B','C','D'].forEach(k=>{const ok=c===k;children.push(new Paragraph({children:[new TextRun({text:LET[k]+'. '+opttext(q,k)+(ok?' ✓':''),bold:ok})]}));});if(String(q.explanation||'').trim())children.push(new Paragraph({spacing:{before:60,after:100},children:[new TextRun({text:'ব্যাখ্যা: '+q.explanation})]}));});const doc=new Document({sections:[{properties:{page:{size:{width:11906,height:16838},margin:{top:720,right:720,bottom:720,left:720}},columns:{count:2,space:360}},children}]});const blob=await Packer.toBlob(doc),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=(document.title||'answer-paper')+'.docx';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}catch(e){alert('DOCX তৈরি করা যায়নি: '+e.message)}}
init();
</script><a class="direct-dashboard-nav" href="dashboard.html" aria-label="ড্যাশবোর্ডে ফিরে যান">🏠 ড্যাশবোর্ড</a><script id="site-copy-deterrent-script">(function(){var admin=false,copyButton=null;function editable(t){return !!(t&&t.closest&&t.closest('input,textarea,select,[contenteditable="true"],[contenteditable=""]'))}function apply(){document.documentElement.classList.toggle('admin-copy-enabled',admin);if(admin)ensureCopyButton()}function stop(e){if(!admin&&!editable(e.target)){e.preventDefault();e.stopPropagation()}}function target(){var file=location.pathname.split('/').pop().toLowerCase();if(file==='question-paper.html')return document.querySelector('#questions');if(file==='answer-paper.html'||file==='official-answer-paper.html'||file==='result-answer-paper.html')return document.querySelector('#page,.paper');if(file==='index.html'||file==='index_visitor_enabled.html')return document.querySelector('#review');if(file==='results-review.html')return document.querySelector('#app');if(file==='admin.html')return document.querySelector('main,.container,#app');return null}function ensureCopyButton(){if(copyButton||!document.body)return;copyButton=document.createElement('button');copyButton.type='button';copyButton.textContent='📋 পুরো লেখা কপি';copyButton.setAttribute('aria-label','প্রশ্ন নম্বরসহ পুরো লেখা কপি করুন');copyButton.style.cssText='position:fixed;right:16px;top:16px;z-index:100000;padding:10px 14px;border:0;border-radius:9px;background:#0f766e;color:#fff;font:700 14px Arial,sans-serif;box-shadow:0 3px 12px #0003;cursor:pointer;display:none';copyButton.addEventListener('click',async function(){var el=target();var text=el?(el.innerText||el.textContent||'').trim():'';if(!text){alert('কপি করার মতো লেখা পাওয়া যায়নি।');return}try{await navigator.clipboard.writeText(text);copyButton.textContent='✓ কপি হয়েছে';setTimeout(function(){if(copyButton)copyButton.textContent='📋 পুরো লেখা কপি'},1800)}catch(e){var ta=document.createElement('textarea');ta.value=text;ta.style.cssText='position:fixed;left:-9999px;top:0';document.body.appendChild(ta);ta.select();var ok=false;try{ok=document.execCommand('copy')}catch(_){}ta.remove();if(ok){copyButton.textContent='✓ কপি হয়েছে';setTimeout(function(){if(copyButton)copyButton.textContent='📋 পুরো লেখা কপি'},1800)}else alert('কপি করা যায়নি। ব্রাউজারের অনুমতি যাচাই করুন।')}});document.body.appendChild(copyButton);var update=function(){var el=target();copyButton.style.display=admin&&el&&((el.innerText||el.textContent||'').trim().length>0)?'inline-block':'none'};update();new MutationObserver(update).observe(document.body,{childList:true,subtree:true,characterData:true})}document.addEventListener('contextmenu',stop,true);document.addEventListener('selectstart',stop,true);document.addEventListener('copy',stop,true);document.addEventListener('cut',stop,true);document.addEventListener('keydown',function(e){if(admin||editable(e.target))return;var k=(e.key||'').toLowerCase();if((e.ctrlKey||e.metaKey)&&['c','x','u','s','p'].includes(k)){e.preventDefault();e.stopPropagation()}if(e.key==='PrintScreen')e.preventDefault()},true);(async function(){try{var client=window.db;if(!client&&window.supabase&&window.FBPATHSHALA_SUPABASE_URL&&window.FBPATHSHALA_SUPABASE_KEY){client=window.supabase.createClient(window.FBPATHSHALA_SUPABASE_URL,window.FBPATHSHALA_SUPABASE_KEY,{auth:{storageKey:'sb-ydvbnalhcnfqpxkkmywr-auth-token',persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}})}if(client&&client.auth){var r=await client.auth.getSession();admin=!!(r&&r.data&&r.data.session&&r.data.session.user)} }catch(_){admin=false}apply()})();})();</script></body></html>
