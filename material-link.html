<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>স্টাডি ম্যাটেরিয়াল খোঁজা হচ্ছে — FbPathshala</title>
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;box-sizing:border-box;font-family:system-ui,sans-serif;background:#f3f6fb;color:#172033}
main{width:min(100%,440px);box-sizing:border-box;padding:28px;border-radius:14px;background:#fff;box-shadow:0 8px 30px #17203312;text-align:center}
h1{font-size:1.3rem;margin:0 0 12px}p{line-height:1.65;color:#526174}
a{display:inline-block;margin-top:8px;padding:11px 18px;border-radius:9px;background:#1459c7;color:#fff;text-decoration:none}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<main>
<h1 id="title">স্টাডি ম্যাটেরিয়াল খোঁজা হচ্ছে…</h1>
<p id="message">একটু অপেক্ষা করুন।</p>
<a href="/exam/study-materials.html" id="home">স্টাডি ম্যাটেরিয়াল সূচিতে ফিরুন</a>
</main>
<script>
(async function(){
 const id=new URLSearchParams(location.search).get('id');
 const title=document.getElementById('title'),message=document.getElementById('message');
 if(!id||!/^\\d+$/.test(id)){title.textContent='লিংকটি সঠিক নয়';message.textContent='স্টাডি ম্যাটেরিয়ালের লিংকটি পরীক্ষা করুন।';return}
 try{
  const sb=supabase.createClient('https://ydvbnalhcnfqpxkkmywr.supabase.co','sb_publishable_xCbSWDkASsbUPl-WmygyMw_eVrJY_9a');
  const {data,error}=await sb.from('study_materials').select('id,department').eq('id',id).eq('published',true).maybeSingle();
  if(error)throw error;
  if(!data){title.textContent='উপকরণটি পাওয়া যায়নি';message.textContent='লিংকটি ভুল হতে পারে অথবা উপকরণটি আর প্রকাশিত নেই।';return}
  const page=data.department==='academic_care'?'academic-study-materials.html':'study-materials.html';
  location.replace('/exam/'+page+'#material-'+encodeURIComponent(data.id));
 }catch(e){title.textContent='লিংক খোলা যাচ্ছে না';message.textContent='ইন্টারনেট সংযোগ পরীক্ষা করে আবার চেষ্টা করুন।'}
})();
</script>
</body>
</html>
