<!doctype html>
<html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>নতুন পরীক্ষা তৈরি — ফেইসবুক পাঠশালা</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>*{box-sizing:border-box}body{margin:0;background:#f4f7fb;color:#172033;font-family:"Noto Sans Bengali",Arial,sans-serif}.top{background:#0f3d91;color:#fff;padding:18px}.wrap{max-width:1000px;margin:18px auto;padding:0 14px}.card{background:#fff;border:1px solid #e2e8f0;border-radius:16px;padding:18px;margin-bottom:16px;box-shadow:0 7px 24px #0f172a0d}h1,h2,h3{margin-top:0}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.sourceCards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.sourceCard{border:2px solid #dbe3ef;border-radius:14px;padding:15px;cursor:pointer}.sourceCard.active{border-color:#2563eb;background:#eff6ff}.sourceCard input{margin-right:8px}.toolbar{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.q{border:1px solid #e2e8f0;border-radius:11px;padding:10px;margin:7px 0}.q label{display:flex;gap:8px}.q input{width:auto}.btn{border:0;border-radius:9px;padding:10px 14px;cursor:pointer}.primary{background:#2563eb;color:#fff}.secondary{background:#e2e8f0}.success{background:#16a34a;color:#fff}.status{padding:10px;border-radius:9px;margin-top:10px;background:#eff6ff;color:#1d4ed8}.error{background:#fef2f2;color:#b91c1c}.ok{background:#f0fdf4;color:#15803d}.right{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}.muted{color:#64748b}.hidden{display:none!important}select,input{width:100%;padding:10px;border:1px solid #cbd5e1;border-radius:9px;font-size:15px}@media(max-width:700px){.grid,.sourceCards,.toolbar{grid-template-columns:1fr}}
</style></head><body><header class="top"><div class="wrap" style="margin:0 auto"><h1>➕ নতুন পরীক্ষা তৈরি</h1><div>প্রথমে প্রশ্নের উৎস নির্বাচন করুন, তারপর প্রশ্ন নির্বাচন করে পরীক্ষা তৈরি করুন।</div></div></header>
<main class="wrap"><div class="card"><label><b>পরীক্ষার নাম</b></label><input id="title" placeholder="যেমন: ৫০তম বিসিএস যাচাই পরীক্ষা"></div>
<div class="card"><h2>প্রশ্ন নির্বাচন পদ্ধতি</h2><div class="sourceCards"><label class="sourceCard active" id="bankCard"><input type="radio" name="method" value="bank" checked> <b>প্রশ্ন ব্যাংক থেকে নির্বাচন</b><div class="muted">Category → Folder → Set → প্রশ্ন</div></label><label class="sourceCard" id="subjectCard"><input type="radio" name="method" value="subject"> <b>বিষয়ভিত্তিক ক্যাটাগরি থেকে নির্বাচন</b><div class="muted">বিষয় নির্বাচন করে প্রশ্ন বাছাই</div></label></div></div>
<div class="card"><h2>প্রশ্ন নির্বাচন</h2><div id="bankPanel"><div class="toolbar"><select id="cat"><option value="">Category নির্বাচন করুন</option></select><select id="folder"><option value="">Folder নির্বাচন করুন</option></select><select id="set"><option value="">Set নির্বাচন করুন</option></select></div></div><div id="subjectPanel" class="hidden"><select id="subject"><option value="">বিষয় নির্বাচন করুন</option></select></div><div class="right" style="margin-top:12px"><button class="btn secondary" onclick="selectAll(true)">☑️ সব নির্বাচন</button><button class="btn secondary" onclick="selectAll(false)">☐ সব বাতিল</button></div><div id="count" class="muted" style="margin:8px 0">কোনো প্রশ্ন নির্বাচন করা হয়নি।</div><div id="list"></div></div>
<div class="card"><h2>পরীক্ষার প্রাথমিক সেটিংস</h2><div class="grid"><input id="duration" type="number" min="1" value="20" placeholder="সময় (মিনিট)"><input id="marks" type="number" min="0" step="0.01" value="1" placeholder="প্রতি প্রশ্নের মার্ক"><input id="negative" type="number" min="0" step="0.01" value="0" placeholder="নেগেটিভ মার্ক"><input id="showAnswers" type="checkbox" style="width:auto;align-self:center"><label style="align-self:center">পরীক্ষার পর সঠিক উত্তর দেখাবে</label></div><div class="right" style="margin-top:12px"><button class="btn success" id="createBtn">✅ প্রশ্ন নিশ্চিত করে পরীক্ষা তৈরি করুন</button></div><div id="status"></div></div></main>
<script>
const CFG={SUPABASE_URL:"https://ydvbnalhcnfqpxkkmywr.supabase.co",SUPABASE_KEY:"sb_publishable_xCbSWDkASsbUPl-WmygyMw_eVrJY_9a"};const db=supabase.createClient(CFG.SUPABASE_URL,CFG.SUPABASE_KEY);const $=id=>document.getElementById(id),bn=n=>String(n).replace(/\d/g,d=>"০১২৩৪৫৬৭৮৯"[d]),esc=v=>String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));let questions=[];
async function auth(){const {data}=await db.auth.getSession();if(!data.session){location.href="admin.html";return false}return true}
async function loadCats(){const r=await db.from("question_bank_folders").select("id,sub_category,folder_name").order("id");if(r.error){setStatus(r.error.message,true);return}const cats=[...new Set((r.data||[]).map(x=>x.sub_category).filter(Boolean))];$("cat").innerHTML='<option value="">Category নির্বাচন করুন</option>'+cats.map(x=>`<option value="${esc(x)}">${esc(x)}</option>`).join("")}
async function loadSubjects(){const r=await db.from("subjects").select("id,name").order("id");if(!r.error)$("subject").innerHTML='<option value="">বিষয় নির্বাচন করুন</option>'+(r.data||[]).map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join("")}
async function loadFolders(){const c=$("cat").value;$("folder").innerHTML='<option value="">Folder নির্বাচন করুন</option>';$("set").innerHTML='<option value="">Set নির্বাচন করুন</option>';if(!c)return;const r=await db.from("question_bank_folders").select("id,folder_name").eq("sub_category",c).order("id");if(r.error){setStatus(r.error.message,true);return}$("folder").innerHTML+=[...(r.data||[])].map(x=>`<option value="${x.id}">${esc(x.folder_name)}</option>`).join("")}
async function loadSets(){const f=$("folder").value;$("set").innerHTML='<option value="">Set নির্বাচন করুন</option>';if(!f)return;const r=await db.from("question_bank_sets").select("id,set_name").eq("folder_id",Number(f)).order("id");if(r.error){setStatus(r.error.message,true);return}$("set").innerHTML+=[...(r.data||[])].map(x=>`<option value="${x.id}">${esc(x.set_name)}</option>`).join("");}
async function loadQuestions(){const method=document.querySelector('input[name="method"]:checked').value;let q=db.from("questions").select("id,question_text,option_a,option_b,option_c,option_d,correct_answer,subject_id,question_number,folder_id,set_id,question_bank_folders(folder_name),question_bank_sets(set_name)").order("question_number",{ascending:true}).order("id",{ascending:true}).limit(5000);if(method==='bank'){if(!$("set").value){questions=[];render();return}q=q.eq("set_id",Number($("set").value))}else{if(!$("subject").value){questions=[];render();return}q=q.eq("subject_id",Number($("subject").value))}const r=await q;if(r.error){setStatus(r.error.message,true);return}questions=r.data||[];render()}
function render(){
 $("list").innerHTML=questions.length?questions.map((x,i)=>`<div class="q"><label><input class="qpick" type="checkbox" value="${x.id}" onchange="updateCount()"><span><b>${bn(i+1)}. ${esc(x.question_text)}</b><br><span class="muted">${esc(x.question_bank_folders?.folder_name||"")} → ${esc(x.question_bank_sets?.set_name||"")} → প্রশ্ন ${x.question_number??i+1}</span></span></label></div>`).join(""):'<div class="muted">এই নির্বাচনে কোনো প্রশ্ন পাওয়া যায়নি।</div>';updateCount()}
function selectAll(v){document.querySelectorAll('.qpick').forEach(x=>x.checked=v);updateCount()}function updateCount(){const n=document.querySelectorAll('.qpick:checked').length;$("count").textContent=n?`নির্বাচিত প্রশ্ন: ${bn(n)}টি`:'কোনো প্রশ্ন নির্বাচন করা হয়নি।'}
function setStatus(t,error=false){$("status").className='status '+(error?'error':'');$("status").textContent=t}
async function createExam(){const title=$("title").value.trim(),ids=[...document.querySelectorAll('.qpick:checked')].map(x=>Number(x.value));if(!title)return setStatus('পরীক্ষার নাম দিন।',true);if(!ids.length)return setStatus('কমপক্ষে একটি প্রশ্ন নির্বাচন করুন।',true);setStatus('পরীক্ষা তৈরি হচ্ছে...');$("createBtn").disabled=true;try{const e=await db.from('exams').insert({title,is_active:true,total_questions:ids.length,duration_minutes:Number($("duration").value)||20}).select('id').single();if(e.error)throw e.error;const rows=ids.map((id,i)=>({exam_id:e.data.id,question_id:id,question_order:i+1}));const link=await db.from('exam_questions').insert(rows);if(link.error)throw link.error;const s=await db.from('exam_settings').upsert({exam_id:e.data.id,total_questions:ids.length,total_marks:ids.length*(Number($("marks").value)||1),marks_per_question:Number($("marks").value)||1,negative_mark:Number($("negative").value)||0,duration_minutes:Number($("duration").value)||20,show_answers:$("showAnswers").checked},{onConflict:'exam_id'});if(s.error)throw s.error;const url=new URL('index.html?exam='+encodeURIComponent(e.data.id),location.href).href;setStatus('পরীক্ষা সফলভাবে তৈরি হয়েছে।');$("status").className='status ok';$("status").innerHTML=`পরীক্ষা তৈরি হয়েছে।<br>লিংক: <a href="${esc(url)}" target="_blank">${esc(url)}</a>`;setTimeout(()=>location.href='exam-manager.html?exam='+encodeURIComponent(e.data.id),700)}catch(err){setStatus('❌ '+(err.message||err),true);$("createBtn").disabled=false}}

document.querySelectorAll('input[name="method"]').forEach(x=>x.onchange=()=>{const bank=x.value==='bank'&&x.checked;$("bankPanel").classList.toggle('hidden',!bank);$("subjectPanel").classList.toggle('hidden',bank);$("bankCard").classList.toggle('active',bank);$("subjectCard").classList.toggle('active',!bank);questions=[];render()});$("cat").onchange=async()=>{await loadFolders();await loadQuestions()};$("folder").onchange=async()=>{await loadSets();await loadQuestions()};$("set").onchange=loadQuestions;$("subject").onchange=loadQuestions;$("createBtn").onclick=createExam;(async()=>{if(await auth()){await loadCats();await loadSubjects()}})();
</script></body></html>
