<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>স্টাডি ম্যাটেরিয়াল কাঠামো</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/exam/js/supabase.js?v=20261104-auth-fallback1"></script><style>*{box-sizing:border-box}body{margin:0;padding:14px;background:#f1f5f9;color:#102a43;font-family:system-ui,"Noto Sans Bengali",sans-serif}.wrap{max-width:900px;margin:auto}.card{background:white;border:1px solid #dbe5ef;border-radius:12px;padding:16px;margin-bottom:12px}h1{font-size:21px;margin:0 0 8px}label{display:block;font-weight:700;margin:10px 0 5px}input,select{width:100%;padding:10px;border:1px solid #bdcddd;border-radius:8px;font:inherit}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}button{border:0;border-radius:8px;background:#0f766e;color:white;padding:10px 13px;margin:8px 5px 0 0;font:inherit;font-weight:700;cursor:pointer}.secondary{background:#e2e8f0;color:#102a43}.danger{background:#b91c1c}.item{border:1px solid #dbe5ef;border-radius:9px;padding:11px;margin-top:8px}.muted{font-size:13px;color:#64748b}.status{white-space:pre-wrap;padding:9px;background:#eff6ff;border-radius:8px}.hidden{display:none!important}@media(max-width:560px){.grid{grid-template-columns:1fr}}</style><style id="premium-study-taxonomy">
:root{--navy:#173f5f;--deep:#102a43;--teal:#0f766e;--muted:#64748b;--line:#dce5ee}
*{box-sizing:border-box}body{padding:20px!important;background:#f3f6fa!important;color:#243b53!important;font-family:system-ui,"Noto Sans Bengali",sans-serif!important}
.wrap{max-width:1080px!important}.card{border:1px solid var(--line)!important;border-radius:15px!important;padding:clamp(15px,2.5vw,22px)!important;margin-bottom:15px!important;box-shadow:0 3px 12px #102a4308!important}
h1{font-size:clamp(20px,3vw,26px)!important;color:var(--deep)!important;margin-bottom:8px!important}h2{color:var(--deep)!important;font-size:20px!important}
.card:first-child{background:linear-gradient(145deg,#fff,#f8fbff)!important}
label{margin:13px 0 6px!important;color:#334e68!important;font-size:13px!important}
input,select{min-height:45px!important;padding:10px 12px!important;border:1px solid #cbd7e3!important;border-radius:9px!important;background:#fff!important;color:var(--deep)!important;font:inherit!important}
input:focus,select:focus{outline:3px solid #14b8a626!important;border-color:var(--teal)!important}
.grid{gap:12px!important}.item{border:1px solid #e1e9f0!important;border-radius:11px!important;padding:13px!important;margin-top:9px!important;background:#fff!important}
button{min-height:40px!important;padding:9px 15px!important;border-radius:9px!important;background:var(--teal)!important;font-size:13px!important;font-weight:750!important}
button.secondary{background:#edf2f7!important;color:#334e68!important;border:1px solid #d5e0e9!important}
button.danger{background:#fff1f2!important;color:#b42318!important;border:1px solid #fecdd3!important}
.muted{color:var(--muted)!important}.status{border:1px solid #dbeafe!important;border-radius:9px!important;background:#f1f7ff!important;color:#31506b!important;padding:11px 13px!important}
.card:first-child>p{color:var(--muted);font-size:13px;line-height:1.6}
.card:first-child h1:before{content:"▦";display:inline-grid;place-items:center;width:42px;height:42px;margin-right:11px;border-radius:11px;background:#e7f4f2;color:var(--teal);vertical-align:middle;font-size:22px}
.card:nth-child(2)>h2{display:flex;align-items:center;gap:9px}.card:nth-child(2)>h2:before{content:"☷";display:grid;place-items:center;width:34px;height:34px;border-radius:9px;background:#e7f4f2;color:var(--teal)}
@media(max-width:650px){body{padding:9px!important}.card{padding:13px!important;border-radius:12px!important}.grid{grid-template-columns:1fr!important}button{width:auto;max-width:100%}}
</style></head><body><main class="wrap"><section class="card"><h1>📚 স্টাডি ম্যাটেরিয়াল কাঠামো ব্যবস্থাপনা</h1><p>নতুন নাম যোগ করতে স্তর ও প্রয়োজনে তার অভিভাবক নির্বাচন করুন। আগের কোনো নাম বদলাতে তালিকা থেকে “সম্পাদনা” চাপুন।</p><div id="departmentControl"><label for="department">বিভাগ</label><select id="department"><option value="job_care">Job Care — ক্যাটাগরি → সাব-ক্যাটাগরি → সেট</option><option value="academic_care">Academic Care — শ্রেণি → বিষয় → অধ্যায়/সেট</option></select></div><div class="grid"><div><label for="level">কোন ধরনের নাম যোগ করবেন?</label><select id="level"><option value="category">প্রথম স্তর</option><option value="subcategory">দ্বিতীয় স্তর</option><option value="set">সেট</option></select></div><div id="parentWrap"><label id="parentLabel" for="parent">কোনটির অধীনে যোগ হবে?</label><select id="parent"></select></div></div><label for="name">নাম</label><input id="name" maxlength="160" placeholder="নাম লিখুন"><label for="order">প্রদর্শনের ক্রম</label><input id="order" type="number" value="0" min="0" step="1"><button id="save">নতুন নাম যোগ করুন</button><div id="status" class="status">লোড হচ্ছে…</div></section><section class="card"><h2>বর্তমান কাঠামো</h2><p class="muted">কোনো স্তর মুছলে সেটি ব্যবহৃত উপকরণের সংযোগ থেকে আলাদা হতে পারে; তাই ব্যবহৃত স্তর মুছতে বাধা দেওয়া হবে।</p><div id="list"></div></section></main><script>
const db=window.db||(window.supabase?.createClient?window.supabase.createClient('https://ydvbnalhcnfqpxkkmywr.supabase.co','sb_publishable_xCbSWDkASsbUPl-WmygyMw_eVrJY_9a',{auth:{storageKey:'sb-ydvbnalhcnfqpxkkmywr-auth-token',persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}}):null);
const $=id=>document.getElementById(id);
let session=null,nodes=[],editingId=null,busy=false;
function say(s){$('status').textContent=s}
function levels(){return $('department').value==='job_care'?[['category','ক্যাটাগরি'],['subcategory','সাব-ক্যাটাগরি'],['set','সেট']]:[['category','শ্রেণি'],['subcategory','বিষয়'],['chapter','অধ্যায়'],['set','সেট']]}
function currentNode(){return nodes.find(n=>String(n.id)===String(editingId))||null}
function parentOptions(type){const ls=levels(),ix=ls.findIndex(x=>x[0]===type);if(ix<=0)return [];const parentType=ls[ix-1][0];return nodes.filter(n=>n.node_type===parentType).sort((a,b)=>(a.display_order-b.display_order)||a.name.localeCompare(b.name,'bn'))}
function updateForm(){
 const oldLevel=$('level').value, node=currentNode(), ls=levels();
 $('level').replaceChildren();
 ls.forEach(([v,l])=>{const o=document.createElement('option');o.value=v;o.textContent=l;$('level').append(o)});
 $('level').value=node?node.node_type:(ls.some(x=>x[0]===oldLevel)?oldLevel:ls[0][0]);
 const type=$('level').value, ix=ls.findIndex(x=>x[0]===type), parents=parentOptions(type);
 $('parentWrap').classList.toggle('hidden',ix===0);
 $('parentLabel').textContent=(ls[ix-1]?.[1]||'অভিভাবক')+' নির্বাচন করুন';
 $('parent').replaceChildren();
 const first=document.createElement('option');first.value='';first.textContent='— নির্বাচন করুন —';$('parent').append(first);
 parents.forEach(n=>{const o=document.createElement('option');o.value=String(n.id);o.textContent=n.name;$('parent').append(o)});
 if(node?.parent_id)$('parent').value=String(node.parent_id);
 $('name').value=node?.name||'';
 $('order').value=node?.display_order??0;
 $('save').textContent=node?'পরিবর্তন সংরক্ষণ করুন':'নতুন নাম যোগ করুন';
}
function trail(n){const a=[n.name];let p=n.parent_id,guard=0;while(p&&guard++<10){const x=nodes.find(z=>String(z.id)===String(p));if(!x)break;a.unshift(x.name);p=x.parent_id}return a.join(' › ')}
function typeLabel(type){return levels().find(x=>x[0]===type)?.[1]||type}
function makeButton(label,cls,handler){const b=document.createElement('button');b.type='button';b.className=cls;b.textContent=label;b.addEventListener('click',handler);return b}
async function load(){
 $('list').replaceChildren();say('কাঠামো লোড হচ্ছে…');
 const {data,error}=await db.from('study_material_taxonomy').select('id,department,node_type,parent_id,name,display_order').eq('department',$('department').value).order('display_order').order('name');
 if(error){say('কাঠামো লোড হয়নি: '+error.message);return}
 nodes=data||[];updateForm();
 if(!nodes.length){const p=document.createElement('p');p.textContent='এখনো কোনো কাঠামো নেই। প্রথম স্তর যোগ করে শুরু করুন।';$('list').append(p)}
 for(const n of nodes){
  const el=document.createElement('div');el.className='item';
  const title=document.createElement('strong');title.textContent=trail(n);el.append(title);
  const meta=document.createElement('div');meta.className='muted';meta.textContent=typeLabel(n.node_type)+' · ক্রম '+n.display_order;el.append(meta);
  el.append(makeButton('সম্পাদনা','secondary',()=>{editingId=n.id;updateForm();say('নির্বাচিত: '+trail(n)+'। পরিবর্তন করে সংরক্ষণ করুন।');window.scrollTo({top:0,behavior:'smooth'})}));
  el.append(makeButton('মুছুন','danger',()=>deleteNode(n)));
  $('list').append(el);
 }
 say('মোট '+nodes.length+'টি স্তর লোড হয়েছে।');
}
async function deleteNode(n){
 if(busy)return;
 const children=nodes.filter(x=>String(x.parent_id)===String(n.id));
 if(children.length){say('এই স্তরের অধীনে '+children.length+'টি স্তর আছে। আগে সেগুলো সরান বা অন্য অভিভাবকের অধীনে নিন।');return}
 const {count,error:checkError}=await db.from('study_materials').select('id',{count:'exact',head:true}).or('category_id.eq.'+n.id+',subcategory_id.eq.'+n.id+',chapter_id.eq.'+n.id+',set_id.eq.'+n.id);
 if(checkError){say('ব্যবহৃত উপকরণ যাচাই করা যায়নি: '+checkError.message);return}
 if(count>0){say('এই স্তরটি '+count+'টি উপকরণে ব্যবহৃত হচ্ছে। উপকরণের সংযোগ না সরিয়ে এটি মোছা যাবে না।');return}
 if(!confirm('“'+n.name+'” মুছে ফেলবেন? এই কাজ ফিরিয়ে আনা যাবে না।'))return;
 busy=true;const {error}=await db.from('study_material_taxonomy').delete().eq('id',n.id).eq('department',$('department').value);busy=false;
 if(error){say('মুছতে সমস্যা: '+error.message);return}
 if(String(editingId)===String(n.id))editingId=null;say('স্তরটি মুছে ফেলা হয়েছে।');await load();
}
$('department').addEventListener('change',()=>{editingId=null;load()});
$('level').addEventListener('change',()=>{if(editingId){editingId=null;say('নতুন স্তর যোগের মোডে ফিরে এসেছেন।')}updateForm()});
$('save').addEventListener('click',async()=>{
 if(!session){say('অ্যাডমিন লগইন প্রয়োজন।');return}if(busy)return;
 const type=$('level').value,name=$('name').value.trim(),ls=levels(),ix=ls.findIndex(x=>x[0]===type),parent_id=ix===0?null:Number($('parent').value);
 if(!name){say('নাম লিখুন।');$('name').focus();return}
 if(ix>0&&!parent_id){say('আগের স্তর নির্বাচন করুন।');$('parent').focus();return}
 const parent=ix>0?nodes.find(n=>String(n.id)===String(parent_id)):null;
 if(ix>0&&(!parent||parent.node_type!==ls[ix-1][0])){say('সঠিক অভিভাবক স্তর নির্বাচন করুন।');return}
 const payload={department:$('department').value,node_type:type,parent_id,name,display_order:Number($('order').value)||0,updated_at:new Date().toISOString()};
 busy=true;$('save').disabled=true;say(editingId?'পরিবর্তন সংরক্ষণ হচ্ছে…':'নতুন নাম যোগ হচ্ছে…');
 const result=editingId
  ?await db.from('study_material_taxonomy').update(payload).eq('id',editingId).eq('department',$('department').value).select('id').maybeSingle()
  :await db.from('study_material_taxonomy').insert(payload).select('id').maybeSingle();
 busy=false;$('save').disabled=false;
 if(result.error){say('সংরক্ষণ হয়নি: '+result.error.message);return}
 if(!result.data){say('কোনো রেকর্ড পরিবর্তন হয়নি। লগইন/অনুমতি যাচাই করুন।');return}
 editingId=null;$('name').value='';$('order').value='0';say('সফলভাবে সংরক্ষণ হয়েছে।');await load();
});
async function init(){
 try{
  const requested=new URLSearchParams(location.search).get('department');
  if(requested==='job_care'||requested==='academic_care'){$('department').value=requested;$('departmentControl').classList.add('hidden')}
  if(!db){say('Supabase লাইব্রেরি লোড হয়নি। পেজটি রিফ্রেশ করুন।');$('save').disabled=true;return}
  const result=await Promise.race([db.auth.getSession(),new Promise((_,reject)=>setTimeout(()=>reject(new Error('লগইন যাচাইয়ের সময়সীমা শেষ হয়েছে।')),12000))]);session=result.data?.session||null;
  if(result.error)throw result.error;
  if(!session){say('অ্যাডমিন সেশন পাওয়া যায়নি। home.html থেকে লগইন করে আবার খুলুন।');$('save').disabled=true;return}
  await load();
 }catch(e){say('অ্যাডমিন যাচাই সম্পন্ন হয়নি: '+(e?.message||String(e)));$('save').disabled=true;}
}
init();
</script></body></html>
