<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>স্টাডি ম্যাটেরিয়াল কাঠামো</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box}body{margin:0;padding:14px;background:#f1f5f9;color:#102a43;font-family:system-ui,"Noto Sans Bengali",sans-serif}.wrap{max-width:900px;margin:auto}.card{background:white;border:1px solid #dbe5ef;border-radius:12px;padding:16px;margin-bottom:12px}h1{font-size:21px;margin:0 0 8px}label{display:block;font-weight:700;margin:10px 0 5px}input,select{width:100%;padding:10px;border:1px solid #bdcddd;border-radius:8px;font:inherit}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}button{border:0;border-radius:8px;background:#0f766e;color:white;padding:10px 13px;margin:8px 5px 0 0;font:inherit;font-weight:700;cursor:pointer}.secondary{background:#e2e8f0;color:#102a43}.danger{background:#b91c1c}.item{border:1px solid #dbe5ef;border-radius:9px;padding:11px;margin-top:8px}.muted{font-size:13px;color:#64748b}.status{white-space:pre-wrap;padding:9px;background:#eff6ff;border-radius:8px}.hidden{display:none!important}@media(max-width:560px){.grid{grid-template-columns:1fr}}</style></head><body><main class="wrap"><section class="card"><h1>📚 স্টাডি ম্যাটেরিয়াল কাঠামো ব্যবস্থাপনা</h1><p>এই তালিকা শুধু স্টাডি ম্যাটেরিয়ালের জন্য। প্রশ্ন ব্যাংকের বিভাগ/সেট এতে বদলাবে না।</p><label for="department">বিভাগ</label><select id="department"><option value="job_care">Job Care — ক্যাটাগরি → সাব-ক্যাটাগরি → সেট</option><option value="academic_care">Academic Care — শ্রেণি → বিষয় → অধ্যায়/সেট</option></select><div class="grid"><div><label for="level">স্তর</label><select id="level"><option value="category">প্রথম স্তর</option><option value="subcategory">দ্বিতীয় স্তর</option><option value="set">সেট</option></select></div><div id="parentWrap"><label id="parentLabel" for="parent">যার অধীনে যোগ হবে</label><select id="parent"></select></div></div><label for="name">নাম</label><input id="name" maxlength="160" placeholder="নতুন নাম লিখুন"><label for="order">প্রদর্শনের ক্রম</label><input id="order" type="number" value="0"><button id="save">সংরক্ষণ</button><button id="cancel" class="secondary">নতুন এন্ট্রি</button><div id="status" class="status">লোড হচ্ছে…</div></section><section class="card"><h2>বর্তমান কাঠামো</h2><p class="muted">কোনো স্তর মুছলে সেটি ব্যবহৃত উপকরণের সংযোগ থেকে আলাদা হতে পারে; তাই ব্যবহৃত স্তর মুছতে বাধা দেওয়া হবে।</p><div id="list"></div></section></main><script>
const db=supabase.createClient('https://ydvbnalhcnfqpxkkmywr.supabase.co','sb_publishable_xCbSWDkASsbUPl-WmygyMw_eVrJY_9a');const $=x=>document.getElementById(x);let session=null,nodes=[],editing=null;
function say(s){$('status').textContent=s}
function levels(){return $('department').value==='job_care'?[['category','ক্যাটাগরি'],['subcategory','সাব-ক্যাটাগরি'],['set','সেট']]:[['category','শ্রেণি'],['subcategory','বিষয়'],['chapter','অধ্যায়'],['set','সেট']]}
function parentsFor(type){const ix=levels().findIndex(x=>x[0]===type);return ix<=0?[]:nodes.filter(n=>n.department===$('department').value&&n.node_type===levels()[ix-1][0]).sort((a,b)=>a.display_order-b.display_order||a.name.localeCompare(b.name))}
function updateForm(){const ls=levels();$('level').innerHTML='';ls.forEach(([v,l])=>{const o=document.createElement('option');o.value=v;o.textContent=l;$('level').append(o)});if(editing)$('level').value=editing.node_type;const type=$('level').value;const ps=parentsFor(type);$('parentWrap').classList.toggle('hidden',type==='category');$('parentLabel').textContent=ls[Math.max(0,ls.findIndex(x=>x[0]===type)-1)]?.[1]+' নির্বাচন করুন';$('parent').innerHTML='';ps.forEach(n=>{const o=document.createElement('option');o.value=n.id;o.textContent=n.name;$('parent').append(o)});if(editing?.parent_id)$('parent').value=editing.parent_id;$('name').value=editing?.name||'';$('order').value=editing?.display_order??0}
function trail(n){let a=[n.name],p=n.parent_id;while(p){const x=nodes.find(z=>z.id===p);if(!x)break;a.unshift(x.name);p=x.parent_id}return a.join(' › ')}
async function load(){const {data,error}=await db.from('study_material_taxonomy').select('*').eq('department',$('department').value).order('display_order').order('name');if(error){say('লোড করা যায়নি: '+error.message);return}nodes=data||[];updateForm();$('list').replaceChildren();if(!nodes.length){$('list').textContent='এখনো কোনো কাঠামো তৈরি হয়নি। উপরের ফর্ম থেকে প্রথম স্তর তৈরি করুন।';say('প্রস্তুত।');return}for(const n of nodes){const el=document.createElement('div');el.className='item';const title=document.createElement('strong');title.textContent=trail(n);el.append(title);const m=document.createElement('div');m.className='muted';m.textContent=levels().find(x=>x[0]===n.node_type)?.[1]||n.node_type;el.append(m);const e=document.createElement('button');e.className='secondary';e.textContent='সম্পাদনা';e.onclick=()=>{editing=n;updateForm();window.scrollTo({top:0,behavior:'smooth'})};el.append(e);const d=document.createElement('button');d.className='danger';d.textContent='মুছুন';d.onclick=async()=>{if(nodes.some(x=>x.parent_id===n.id)){alert('আগে এর অধীনের স্তরগুলো সরান।');return}const {count,error:checkErr}=await db.from('study_materials').select('id',{count:'exact',head:true}).or('category_id.eq.'+n.id+',subcategory_id.eq.'+n.id+',chapter_id.eq.'+n.id+',set_id.eq.'+n.id);if(checkErr){alert('ব্যবহার যাচাই করা যায়নি: '+checkErr.message);return}if(count){alert('এই স্তরটি উপকরণে ব্যবহৃত হচ্ছে, তাই মুছতে দেওয়া হয়নি।');return}if(!confirm('এই স্তর মুছবেন?'))return;const {error}=await db.from('study_material_taxonomy').delete().eq('id',n.id);if(error)alert('মুছতে সমস্যা: '+error.message);else{editing=null;await load()}};el.append(d);$('list').append(el)}say('মোট '+nodes.length+'টি স্তর।')}
$('department').onchange=()=>{editing=null;load()};$('level').onchange=()=>{editing=null;updateForm()};$('cancel').onclick=()=>{editing=null;updateForm();say('নতুন এন্ট্রির জন্য প্রস্তুত।')};$('save').onclick=async()=>{if(!session){say('অ্যাডমিন লগইন প্রয়োজন।');return}const type=$('level').value,name=$('name').value.trim();if(!name){say('নাম লিখুন।');return}const ix=levels().findIndex(x=>x[0]===type);const parent_id=ix===0?null:Number($('parent').value);if(ix>0&&!parent_id){say('আগের স্তর নির্বাচন করুন।');return}const payload={department:$('department').value,node_type:type,parent_id,name,display_order:Number($('order').value)||0,updated_at:new Date().toISOString()};const q=editing?db.from('study_material_taxonomy').update(payload).eq('id',editing.id):db.from('study_material_taxonomy').insert(payload);const {error}=await q;if(error){say('সংরক্ষণ হয়নি: '+error.message);return}editing=null;$('name').value='';say('সংরক্ষণ সফল হয়েছে।');await load()};async function init(){const requested=new URLSearchParams(location.search).get('department');if(requested==='job_care'||requested==='academic_care')$('department').value=requested;const {data,error}=await db.auth.getSession();session=data?.session||null;if(error||!session){say('অ্যাডমিন হিসেবে লগইন করুন, তারপর পেজটি আবার খুলুন।');$('save').disabled=true;return}await load()}init();
</script></body></html>
