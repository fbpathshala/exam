<!doctype html>
<html lang="bn">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ফেইসবুক পাঠশালা — প্রশ্ন তৈরি</title><link rel="stylesheet" href="css/admin.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script></head>
<body>
<div id="login" class="center"><div class="card login"><h1>ফেইসবুক পাঠশালা</h1><h2>প্রশ্ন তৈরি</h2><input id="email" type="email" placeholder="Admin Email"><input id="password" type="password" placeholder="Password"><button onclick="login()">Login</button><p id="loginMsg" class="msg"></p></div></div>
<div id="app" class="hidden"><header class="dashboard-top"><div class="dashboard-brand"><h1>ফেইসবুক পাঠশালা</h1><p>প্রশ্ন তৈরি</p></div><div class="admin-menu"><button type="button" class="admin-menu-btn" id="adminMenuBtn">☰</button><div class="admin-menu-panel hidden" id="adminMenuPanel"><button onclick="location.href='dashboard.html'">🏠 ড্যাশবোর্ড</button><button onclick="location.href='question_create.html'">➕ প্রশ্ন তৈরি</button><button onclick="location.href='question_bank.html'">🗂️ প্রশ্ন ব্যাংক</button><button onclick="location.href='admin_dashboard_split.html?section=exam'">📋 পরীক্ষা পরিচালনা</button><button class="logout" onclick="logout()">🚪 লগ আউট</button></div></div></header>
<main><div class="card"><h2>১. Category → Folder → Set</h2><div class="cats"><button id="cat-recruitment" onclick="selectCategory('recruitment')">নিয়োগ পরীক্ষা</button><button id="cat-verification_test" onclick="selectCategory('verification_test')">যাচাই পরীক্ষা</button><button id="cat-recent" onclick="selectCategory('recent')">সাম্প্রতিক প্রশ্ন</button></div><div id="currentCat" class="notice"></div><div class="grid"><div><label>Folder</label><select id="folder"></select><div class="bank-actions"><button type="button" class="secondary" onclick="renameSelectedFolder()">✏️ Folder Rename</button><button type="button" class="secondary" onclick="deleteSelectedFolder()">🗑️ Folder Delete</button></div></div><div><label>Set</label><select id="set"></select><div class="bank-actions"><button type="button" class="secondary" onclick="renameSelectedSet()">✏️ Set Rename</button><button type="button" class="secondary" onclick="deleteSelectedSet()">🗑️ Set Delete</button></div></div></div><div class="grid"><input id="newFolder" placeholder="নতুন Folder-এর নাম"><button type="button" onclick="createFolder()">＋ Folder তৈরি</button></div><div class="grid"><input id="newSet" placeholder="নতুন Set-এর নাম"><button type="button" onclick="createSet()">＋ Set তৈরি</button></div><p id="folderMsg" class="msg"></p></div>
<div class="card"><h2>২. Manual প্রশ্ন তৈরি</h2><div class="grid"><div><label>বিষয়</label><select id="subject"></select></div><div><label>প্রশ্ন নম্বর</label><input id="questionNumber" type="number"></div></div><textarea id="question" placeholder="প্রশ্ন"></textarea><div class="grid"><input id="optionA" placeholder="ক. অপশন"><input id="optionB" placeholder="খ. অপশন"><input id="optionC" placeholder="গ. অপশন"><input id="optionD" placeholder="ঘ. অপশন"></div><div class="grid"><select id="correctAnswer"><option value="">সঠিক উত্তর</option><option value="A">ক</option><option value="B">খ</option><option value="C">গ</option><option value="D">ঘ</option></select><input id="explanation" placeholder="ব্যাখ্যা (ঐচ্ছিক)"></div><button type="button" onclick="addManual()">প্রশ্ন Question Bank-এ যোগ করুন</button><p id="manualMsg" class="msg"></p></div>
<div class="card"><h2>৩. CSV / Excel Upload</h2><p class="muted">Required: question, option_a, option_b, option_c, option_d, correct_answer. Optional: question_number, subject, explanation, category.</p><button type="button" class="secondary" onclick="template()">Template ডাউনলোড</button><input id="importFile" type="file" accept=".csv,.xlsx,.xls"><button type="button" onclick="previewImport()">Preview</button><div id="importPreview"></div><button id="importBtn" class="hidden" type="button" onclick="importRows()">Database-এ Import করুন</button></div></main></div>
<script src="js/supabase.js"></script><script src="js/question_create.js"></script></body></html>
