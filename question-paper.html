<!doctype html><html lang="bn"><head>
<link rel="stylesheet" href="css/admin.css"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>প্রশ্নপত্র</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="https://cdn.jsdelivr.net/npm/docx@8.5.0/build/index.umd.js"></script><style>body{margin:0;background:#eee;font-family:Arial,sans-serif}.toolbar{text-align:center;background:#183c63;padding:12px;position:sticky;top:0}.toolbar button{padding:10px;margin:4px;cursor:pointer}.paper{width:210mm;min-height:297mm;background:white;margin:16px auto;padding:15mm;box-sizing:border-box}.head{text-align:center;border-bottom:1px solid #555;padding-bottom:10px}.meta{display:flex;justify-content:space-between;font-size:12px}.questions{column-count:2;column-gap:9mm;column-rule:1px solid #ddd;font-size:12px;line-height:1.5}.q{break-inside:avoid;margin:0 0 12px}.qt{font-weight:bold}@page{size:A4;margin:0}@media(max-width:800px){.paper{width:100%;padding:18px}.questions{column-gap:16px}}@media print{.toolbar,#status{display:none}.paper{margin:0;width:auto;min-height:0;box-shadow:none;padding:15mm}.questions{column-count:2;font-size:11pt}}</style><style id="direct-dashboard-navigation">.direct-dashboard-nav{position:fixed;right:16px;bottom:16px;z-index:9999;display:inline-flex;align-items:center;gap:8px;padding:11px 16px;border-radius:999px;background:#1d4ed8;color:#fff!important;text-decoration:none!important;font:700 15px/1.2 Arial,sans-serif;box-shadow:0 5px 18px #0003;border:2px solid #fff}.direct-dashboard-nav:hover{background:#1e40af;transform:translateY(-1px)}@media print{.direct-dashboard-nav{display:none!important}}</style><style id="site-copy-deterrent">html,body{-webkit-user-select:none!important;user-select:none!important;-webkit-touch-callout:none!important}input,textarea,select,[contenteditable="true"],[contenteditable=""]{-webkit-user-select:text!important;user-select:text!important;-webkit-touch-callout:default!important}html.admin-copy-enabled,html.admin-copy-enabled body,html.admin-copy-enabled body *{-webkit-user-select:text!important;user-select:text!important;-webkit-touch-callout:default!important}@media print{body{display:none!important}}</style></head><body data-fp-theme="premium"><div class="toolbar"><button onclick="history.back()">ফিরে যান</button><button onclick="downloadDocx()">DOCX ডাউনলোড</button><button onclick="print()">PDF ডাউনলোড / প্রিন্ট</button></div><p id="status" style="text-align:center">লোড হচ্ছে…</p><main class="paper"><header class="head"><h2 id="title">পরীক্ষার প্রশ্নপত্র</h2><div class="meta"><span id="duration"></span><span id="total"></span><span id="marks"></span></div></header><p>প্রতিটি প্রশ্নের সঠিক উত্তর নির্বাচন করুন।</p><section id="questions" class="questions"></section></main><script src="js/supabase.js"></script><script>let exam,settings={},qs=[];const $=x=>document.getElementById(x),bn=x=>String(x??"").replace(/\\d/g,d=>"০১২৩৪৫৬৭৮৯"[+d]),esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));async function init(){try{const id=new URLSearchParams(location.search).get("exam");if(!id)throw Error("Exam ID পাওয়া যায়নি");let r=await db.from("exams").select("id,exam_name").eq("id",id).single();if(r.error)throw r.error;exam=r.data;r=await db.from("exam_settings").select("*").eq("exam_id",id).maybeSingle();if(r.error)throw r.error;settings=r.data||{};r=await db.from("exam_questions").select("question_id,question_order").eq("exam_id",id).order("question_order");if(r.error)throw r.error;const ids=(r.data||[]).map(x=>x.question_id);if(!ids.length)throw Error("এই পরীক্ষায় প্রশ্ন নেই");r=await db.from("questions").select("*").in("id",ids);if(r.error)throw r.error;const map=new Map((r.data||[]).map(q=>[String(q.id),q]));qs=ids.map(id=>map.get(String(id))).filter(Boolean);$("title").textContent=exam.exam_name;$("duration").textContent="সময়: "+bn(settings.duration_minutes??20)+" মিনিট";$("total").textContent="প্রশ্ন: "+bn(qs.length);$("marks").textContent="পূর্ণমান: "+bn(settings.total_marks??qs.length*Number(settings.marks_per_question??1));$("questions").innerHTML=qs.map((q,i)=>'<article class="q"><div class="qt">'+bn(i+1)+'. '+esc(q.question_text||q.question||"")+'</div>'+[q.option_a??q.option1,q.option_b??q.option2,q.option_c??q.option3,q.option_d??q.option4].filter(v=>v!==null&&v!==undefined&&String(v)!=="").map((v,j)=>'<div>'+["ক","খ","গ","ঘ"][j]+". "+esc(v)+'</div>').join("")+'</article>').join("");$("status").textContent="প্রশ্নপত্র প্রস্তুত"}catch(e){$("status").textContent="প্রশ্নপত্র লোড হয়নি: "+e.message}}async function downloadDocx(){if(!exam||!qs.length)return alert("প্রশ্নপত্র লোড হয়নি");if(!window.docx)return alert("DOCX লাইব্রেরি পাওয়া যায়নি; প্রিন্ট/PDF ব্যবহার করুন");try{const{Document,Packer,Paragraph,TextRun,AlignmentType}=docx;const children=[new Paragraph({text:exam.exam_name,heading:"Heading1",alignment:AlignmentType.CENTER}),new Paragraph({text:"সময়: "+(settings.duration_minutes??20)+" মিনিট   প্রশ্ন: "+qs.length+"   পূর্ণমান: "+(settings.total_marks??qs.length),alignment:AlignmentType.CENTER})];qs.forEach((q,i)=>{children.push(new Paragraph({children:[new TextRun({text:(i+1)+". "+(q.question_text||q.question||""),bold:true})],spacing:{before:100,after:50}}));[q.option_a??q.option1,q.option_b??q.option2,q.option_c??q.option3,q.option_d??q.option4].filter(v=>v!==null&&v!==undefined&&String(v)!=="").forEach((v,j)=>children.push(new Paragraph({text:["ক","খ","গ","ঘ"][j]+". "+v,indent:{left:240}})))});const d=new Document({sections:[{properties:{page:{size:{width:11906,height:16838},margin:{top:720,right:720,bottom:720,left:720}},columns:{count:2,space:360}},children}]});const blob=await Packer.toBlob(d),a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=(exam.exam_name||"question-paper")+".docx";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}catch(e){alert("DOCX তৈরি হয়নি: "+e.message)}}init();</script><a class="direct-dashboard-nav" href="dashboard.html" aria-label="ড্যাশবোর্ডে ফিরে যান">🏠 ড্যাশবোর্ড</a><script id="site-copy-deterrent-script">(function(){var admin=false,copyButton=null;function editable(t){return !!(t&&t.closest&&t.closest('input,textarea,select,[contenteditable="true"],[contenteditable=""]'))}function apply(){document.documentElement.classList.toggle('admin-copy-enabled',admin);if(admin)ensureCopyButton()}function stop(e){if(!admin&&!editable(e.target)){e.preventDefault();e.stopPropagation()}}function target(){var file=location.pathname.split('/').pop().toLowerCase();if(file==='question-paper.html')return document.querySelector('#questions');if(file==='answer-paper.html'||file==='official-answer-paper.html'||file==='result-answer-paper.html')return document.querySelector('#page,.paper');if(file==='index.html'||file==='index_visitor_enabled.html')return document.querySelector('#review');if(file==='results-review.html')return document.querySelector('#app');if(file==='admin.html')return document.querySelector('main,.container,#app');return null}function ensureCopyButton(){if(copyButton||!document.body)return;copyButton=document.createElement('button');copyButton.type='button';copyButton.textContent='📋 পুরো লেখা কপি';copyButton.setAttribute('aria-label','প্রশ্ন নম্বরসহ পুরো লেখা কপি করুন');copyButton.style.cssText='position:fixed;right:16px;top:16px;z-index:100000;padding:10px 14px;border:0;border-radius:9px;background:#0f766e;color:#fff;font:700 14px Arial,sans-serif;box-shadow:0 3px 12px #0003;cursor:pointer;display:none';copyButton.addEventListener('click',async function(){var el=target();var text=el?(el.innerText||el.textContent||'').trim():'';if(!text){alert('কপি করার মতো লেখা পাওয়া যায়নি।');return}try{await navigator.clipboard.writeText(text);copyButton.textContent='✓ কপি হয়েছে';setTimeout(function(){if(copyButton)copyButton.textContent='📋 পুরো লেখা কপি'},1800)}catch(e){var ta=document.createElement('textarea');ta.value=text;ta.style.cssText='position:fixed;left:-9999px;top:0';document.body.appendChild(ta);ta.select();var ok=false;try{ok=document.execCommand('copy')}catch(_){}ta.remove();if(ok){copyButton.textContent='✓ কপি হয়েছে';setTimeout(function(){if(copyButton)copyButton.textContent='📋 পুরো লেখা কপি'},1800)}else alert('কপি করা যায়নি। ব্রাউজারের অনুমতি যাচাই করুন।')}});document.body.appendChild(copyButton);var update=function(){var el=target();copyButton.style.display=admin&&el&&((el.innerText||el.textContent||'').trim().length>0)?'inline-block':'none'};update();new MutationObserver(update).observe(document.body,{childList:true,subtree:true,characterData:true})}document.addEventListener('contextmenu',stop,true);document.addEventListener('selectstart',stop,true);document.addEventListener('copy',stop,true);document.addEventListener('cut',stop,true);document.addEventListener('keydown',function(e){if(admin||editable(e.target))return;var k=(e.key||'').toLowerCase();if((e.ctrlKey||e.metaKey)&&['c','x','u','s','p'].includes(k)){e.preventDefault();e.stopPropagation()}if(e.key==='PrintScreen')e.preventDefault()},true);(async function(){try{var client=window.db;if(!client&&typeof db!=='undefined')client=db;if(!client&&typeof sb!=='undefined')client=sb;if(!client&&window.supabase&&window.FBPATHSHALA_SUPABASE_URL&&window.FBPATHSHALA_SUPABASE_KEY){client=window.supabase.createClient(window.FBPATHSHALA_SUPABASE_URL,window.FBPATHSHALA_SUPABASE_KEY,{auth:{storageKey:'sb-ydvbnalhcnfqpxkkmywr-auth-token',persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}})}if(client&&client.auth){var r=await client.auth.getSession();admin=!!(r&&r.data&&r.data.session&&r.data.session.user)} }catch(_){admin=false}apply()})();})();</script></body></html>
