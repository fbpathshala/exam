<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>প্রশ্নপত্র</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="https://cdn.jsdelivr.net/npm/docx@8.5.0/build/index.umd.js"></script><style>body{margin:0;background:#eee;font-family:Arial,sans-serif}.toolbar{text-align:center;background:#183c63;padding:12px;position:sticky;top:0}.toolbar button{padding:10px;margin:4px;cursor:pointer}.paper{width:210mm;min-height:297mm;background:white;margin:16px auto;padding:15mm;box-sizing:border-box}.head{text-align:center;border-bottom:1px solid #555;padding-bottom:10px}.meta{display:flex;justify-content:space-between;font-size:12px}.questions{column-count:2;column-gap:9mm;column-rule:1px solid #ddd;font-size:12px;line-height:1.5}.q{break-inside:avoid;margin:0 0 12px}.qt{font-weight:bold}@page{size:A4;margin:0}@media(max-width:800px){.paper{width:100%;padding:18px}.questions{column-gap:16px}}@media print{.toolbar,#status{display:none}.paper{margin:0;width:auto;min-height:0;box-shadow:none;padding:15mm}.questions{column-count:2;font-size:11pt}}</style></head><body><div class="toolbar"><button onclick="history.back()">ফিরে যান</button><button onclick="downloadDocx()">DOCX ডাউনলোড</button><button onclick="print()">PDF ডাউনলোড / প্রিন্ট</button></div><p id="status" style="text-align:center">লোড হচ্ছে…</p><main class="paper"><header class="head"><h2 id="title">পরীক্ষার প্রশ্নপত্র</h2><div class="meta"><span id="duration"></span><span id="total"></span><span id="marks"></span></div></header><p>প্রতিটি প্রশ্নের সঠিক উত্তর নির্বাচন করুন।</p><section id="questions" class="questions"></section></main><script src="js/supabase.js"></script><script>let exam,settings={},qs=[];const $=x=>document.getElementById(x),bn=x=>String(x??"").replace(/\\d/g,d=>"০১২৩৪৫৬৭৮৯"[+d]),esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));async function init(){try{const id=new URLSearchParams(location.search).get("exam");if(!id)throw Error("Exam ID পাওয়া যায়নি");let r=await db.from("exams").select("id,exam_name").eq("id",id).single();if(r.error)throw r.error;exam=r.data;r=await db.from("exam_settings").select("*").eq("exam_id",id).maybeSingle();if(r.error)throw r.error;settings=r.data||{};r=await db.from("exam_questions").select("question_id,question_order").eq("exam_id",id).order("question_order");if(r.error)throw r.error;const ids=(r.data||[]).map(x=>x.question_id);if(!ids.length)throw Error("এই পরীক্ষায় প্রশ্ন নেই");r=await db.from("questions").select("*").in("id",ids);if(r.error)throw r.error;const map=new Map((r.data||[]).map(q=>[String(q.id),q]));qs=ids.map(id=>map.get(String(id))).filter(Boolean);$("title").textContent=exam.exam_name;$("duration").textContent="সময়: "+bn(settings.duration_minutes??20)+" মিনিট";$("total").textContent="প্রশ্ন: "+bn(qs.length);$("marks").textContent="পূর্ণমান: "+bn(settings.total_marks??qs.length*Number(settings.marks_per_question??1));$("questions").innerHTML=qs.map((q,i)=>'<article class="q"><div class="qt">'+bn(i+1)+'. '+esc(q.question_text||q.question||"")+'</div>'+[q.option_a??q.option1,q.option_b??q.option2,q.option_c??q.option3,q.option_d??q.option4].filter(v=>v!==null&&v!==undefined&&String(v)!=="").map((v,j)=>'<div>'+["ক","খ","গ","ঘ"][j]+". "+esc(v)+'</div>').join("")+'</article>').join("");$("status").textContent="প্রশ্নপত্র প্রস্তুত"}catch(e){$("status").textContent="প্রশ্নপত্র লোড হয়নি: "+e.message}}async function downloadDocx(){if(!exam||!qs.length)return alert("প্রশ্নপত্র লোড হয়নি");if(!window.docx)return alert("DOCX লাইব্রেরি পাওয়া যায়নি; প্রিন্ট/PDF ব্যবহার করুন");try{const{Document,Packer,Paragraph,TextRun,AlignmentType}=docx;const children=[new Paragraph({text:exam.exam_name,heading:"Heading1",alignment:AlignmentType.CENTER}),new Paragraph({text:"সময়: "+(settings.duration_minutes??20)+" মিনিট   প্রশ্ন: "+qs.length+"   পূর্ণমান: "+(settings.total_marks??qs.length),alignment:AlignmentType.CENTER})];qs.forEach((q,i)=>{children.push(new Paragraph({children:[new TextRun({text:(i+1)+". "+(q.question_text||q.question||""),bold:true})],spacing:{before:100,after:50}}));[q.option_a??q.option1,q.option_b??q.option2,q.option_c??q.option3,q.option_d??q.option4].filter(v=>v!==null&&v!==undefined&&String(v)!=="").forEach((v,j)=>children.push(new Paragraph({text:["ক","খ","গ","ঘ"][j]+". "+v,indent:{left:240}})))});const d=new Document({sections:[{properties:{page:{size:{width:11906,height:16838},margin:{top:720,right:720,bottom:720,left:720}},columns:{count:2,space:360}},children}]});const blob=await Packer.toBlob(d),a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=(exam.exam_name||"question-paper")+".docx";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}catch(e){alert("DOCX তৈরি হয়নি: "+e.message)}}init();</script></body></html>
