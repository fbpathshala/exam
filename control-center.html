<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#102a43">
<title>ফেইসবুক পাঠশালা — কেন্দ্রীয় ব্যবস্থাপনা</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f1f5f9;color:#102a43;font-family:system-ui,-apple-system,"Noto Sans Bengali",sans-serif}
header{position:sticky;top:0;z-index:20;background:#102a43;color:#fff;padding:14px 18px;box-shadow:0 4px 18px #102a4320}.header-row{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}.header-links{display:flex;gap:8px;flex-wrap:wrap}.header-link{display:inline-flex;align-items:center;padding:8px 11px;border:1px solid #7c91a8;border-radius:9px;color:#fff;text-decoration:none;font-size:13px;font-weight:750}.header-link:hover{background:#244660}.public-link{background:#0f766e;border-color:#0f766e}@media(max-width:520px){header{padding:12px}.header-link{font-size:12px;padding:7px 9px}}
.brand{font-size:19px;font-weight:850}.sub{font-size:12px;color:#c7d9e8;margin-top:3px}
.layout{display:block;min-height:calc(100vh - 65px)}
aside{padding:0 18px;background:#fff;border-bottom:1px solid #dbe5ef;position:relative}
.menu-toggle{display:flex;align-items:center;gap:8px;border:1px solid #cbd5e1;border-radius:9px;background:#fff;color:#102a43;padding:10px 13px;font:700 14px system-ui;cursor:pointer;margin:12px 0}
.nav{display:none;position:absolute;top:58px;left:18px;right:18px;z-index:30;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;padding:10px;background:#fff;border:1px solid #dbe5ef;border-radius:12px;box-shadow:0 12px 28px #102a4320}
.nav.open{display:grid}.nav[hidden]{display:none!important}.nav button{width:100%;border:0;border-radius:8px;background:transparent;color:#334e68;text-align:left;padding:12px;font:700 14px system-ui;cursor:pointer}
.nav button.active,.nav button:hover{background:#e5f3f5;color:#0f766e}
main{padding:18px;min-width:0}.toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}.management-options{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 12px}.management-options[hidden]{display:none!important}.management-options button{border:1px solid #cbd8e5;border-radius:9px;background:#fff;color:#163047;padding:10px 13px;font:700 14px system-ui;cursor:pointer}.management-options button.active,.management-options button:hover{background:#e5f3f5;border-color:#0f766e;color:#0f766e}
select{min-height:42px;padding:8px 12px;border:1px solid #b8c8d8;border-radius:9px;background:#fff;color:#102a43;font:inherit}
.title{font-size:21px;font-weight:800;margin-right:auto}.note{font-size:13px;color:#52677d;margin:0 0 12px}
.framewrap{height:calc(100vh - 150px);min-height:540px;background:#fff;border:1px solid #dbe5ef;border-radius:13px;overflow:hidden}
iframe{display:block;width:100%;height:100%;border:0;background:#fff}
@media(max-width:760px){aside{padding:0 10px}.nav{left:10px;right:10px;grid-template-columns:1fr 1fr}.nav button{font-size:12px;padding:10px}main{padding:10px}.framewrap{height:calc(100vh - 205px);min-height:460px}.title{width:100%}}
</style>
<script>
(function(){
  const params=new URLSearchParams(location.search);
  if(params.get("section")==="question-create"){
    const division=params.get("division");
    location.replace("question_create.html"+(division?"?division="+encodeURIComponent(division):""));
  }
})();
</script>
<style id="central-bottom-return">
.central-return-wrap{max-width:1080px;margin:0 auto;padding:0 18px 22px}
.central-return{display:flex;align-items:center;justify-content:center;min-height:46px;padding:11px 16px;border:1px solid #c2d5e6;border-radius:10px;background:#e8f1f8;color:#173f5f;text-decoration:none;font-weight:750;font-size:14px}
.central-return:hover{background:#dce8f1}
@media(max-width:760px){.central-return-wrap{padding:0 10px 18px}.central-return{width:100%;min-height:48px}}
</style></head>
<body>
<header><div class="header-row"><div><div class="brand">🎓 ফেইসবুক পাঠশালা — কেন্দ্রীয় অ্যাডমিন</div><div class="sub">একটি প্যানেল • দশটি সেকশন • বিভাগভিত্তিক আলাদা তথ্য</div></div></div></header>
<div class="layout">
<aside><button class="menu-toggle" id="menuToggle" type="button" aria-expanded="false" aria-controls="nav">☰ সব সেকশন</button><nav class="nav" id="nav" aria-label="কেন্দ্রীয় সেকশন" hidden>
<button class="active" data-section="management">১. ব্যবস্থাপনা</button>
<button data-section="question-create">২. প্রশ্ন তৈরি</button>
<button data-section="question-bank">৩. প্রশ্ন ব্যাংক</button>
<button data-section="exam-create">৪. পরীক্ষা তৈরি</button>
<button data-section="exam-manage">৫. পরীক্ষা পরিচালনা</button>
<button data-section="results">৬. ফলাফল পর্যালোচনা</button>
<button data-section="materials">৭. স্টাডি ম্যাটেরিয়ালস</button>
<button data-section="important-links">৮. গুরুত্বপূর্ণ তথ্য ও পোস্ট লিংক</button>
<button data-section="breaking-news">৯. ব্রেকিং নিউজ</button>
<button data-section="social-links">১০. ফেইসবুক পাঠশালা লিংক</button>
</nav></aside>
<main>
<div class="toolbar"><div class="title" id="sectionTitle">ব্যবস্থাপনা</div><label for="care">বিভাগ:</label><select id="care"><option value="">বিভাগ নির্বাচন করুন</option><option value="job">Job Care</option><option value="academic">Academic Care</option></select></div>
<div class="management-options" id="managementOptions" hidden aria-label="ব্যবস্থাপনার ধরন"></div>
<p class="note" id="sectionNote">বিভাগ অনুযায়ী ব্যবস্থাপনার ধরন নির্বাচন করুন।</p>
<div class="framewrap"><iframe id="workspace" title="নির্বাচিত ব্যবস্থাপনা সেকশন" src="taxonomy.html"></iframe></div>
</main>
</div>
<div class="central-return-wrap"><a class="central-return" href="https://fbpathshala.github.io/home.html">⌂ মূল মেনু / হোম পেইজে ফিরুন</a></div>
<script>
const routes={
management:{title:"ব্যবস্থাপনা",note:"ক্যাটাগরি, সাব-ক্যাটাগরি, সেট, বিষয় এবং Academic Care-এর শ্রেণি/অধ্যায় পরিচালনা করুন।",job:"taxonomy.html?section=job",academic:"taxonomy.html?section=academic"},
"question-create":{title:"প্রশ্ন তৈরি",note:"নির্বাচিত বিভাগের জন্য MCQ/CQ প্রশ্ন হাতে লিখে বা CSV/Excel থেকে Question Bank-এ যোগ করুন।",job:"question_create.html?embedded=1&division=job",academic:"question_create.html?embedded=1&division=academic"},
"question-bank":{title:"প্রশ্ন ব্যাংক",note:"এখানে শুধু প্রশ্ন দেখা, সার্চ/ফিল্টার, প্রশ্ন সম্পাদনা ও প্রয়োজন হলে স্থানান্তর করুন। ক্যাটাগরি, সাব-ক্যাটাগরি, সেট ও বিষয় তৈরি/পরিবর্তন/মুছে ফেলার কাজ শুধু ‘ব্যবস্থাপনা’ সেকশনে হবে।",job:"question_bank.html?embedded=1",academic:"https://fbpathshala.github.io/academic/question-bank.html?embedded=1"},
"exam-create":{title:"পরীক্ষা তৈরি",note:"নির্বাচিত বিভাগের প্রশ্ন ব্যাংক থেকে প্রশ্ন নিয়ে পরীক্ষা তৈরি করুন।",job:"create-exam.html",academic:"https://fbpathshala.github.io/academic/admin.html?central=1&view=exams"},
"exam-manage":{title:"পরীক্ষা পরিচালনা",note:"নির্বাচিত বিভাগের পরীক্ষা পরিচালনা করুন।",job:"exam-manager.html",academic:"https://fbpathshala.github.io/academic/admin.html?central=1&view=exams"},
results:{title:"ফলাফল পর্যালোচনা",note:"MCQ ফলাফল পর্যালোচনা এবং CQ মূল্যায়নের ব্যবস্থা খুলুন।",job:"results-manager.html",academic:"https://fbpathshala.github.io/academic/admin.html?central=1&view=reviews"},
materials:{title:"স্টাডি ম্যাটেরিয়ালস",note:"নির্বাচিত বিভাগের নোট, ছবি ও PDF পরিচালনার ব্যবস্থা খুলুন।",job:"study-materials.html?admin=1",academic:"https://fbpathshala.github.io/academic/admin.html?central=1&view=materials"},
"important-links":{title:"গুরুত্বপূর্ণ তথ্য ও পোস্ট লিংক",note:"এটি কোনো বিভাগের অধীন নয়। গুরুত্বপূর্ণ পোস্টের লিংক ও নোট পরিচালনা করুন।",universal:true,url:"site-content-admin.html?section=important-links"},
"breaking-news":{title:"ব্রেকিং নিউজ",note:"পাবলিক হোমপেজে লিংকসহ বা লিংক ছাড়া সংবাদ প্রকাশ করুন।",universal:true,url:"site-content-admin.html?section=breaking-news"},
"social-links":{title:"ফেইসবুক পাঠশালা লিংক",note:"ফেইসবুক পাঠশালা পেইজ ও গ্রুপের লিংক পরিচালনা করুন।",universal:true,url:"site-content-admin.html?section=social-links"}
};
let active="management";
let activeManagementLevel=0;
const managementLevels={job:[{level:0,label:"ক্যাটাগরি ব্যবস্থাপনা"},{level:1,label:"সাব ক্যাটাগরি ব্যবস্থাপনা"},{level:2,label:"সেট ব্যবস্থাপনা"},{level:3,label:"বিষয় ব্যবস্থাপনা",view:"subjects"}],academic:[{level:0,label:"শ্রেণি ব্যবস্থাপনা"},{level:1,label:"বিষয় ব্যবস্থাপনা"},{level:2,label:"অধ্যায় ব্যবস্থাপনা"},{level:3,label:"সেট ব্যবস্থাপনা"}]};
function renderManagementOptions(){const box=document.getElementById("managementOptions"),care=document.getElementById("care").value;box.innerHTML="";if(active!=="management"||!care){box.hidden=true;return}box.hidden=false;managementLevels[care].forEach(item=>{const b=document.createElement("button");b.type="button";b.textContent=item.label;b.dataset.managementLevel=String(item.level);b.classList.toggle("active",item.level===activeManagementLevel);b.addEventListener("click",()=>{activeManagementLevel=item.level;renderManagementOptions();document.getElementById("sectionNote").textContent="নির্বাচিত ব্যবস্থাপনা: "+item.label;document.getElementById("workspace").src=item.view==="subjects"?"taxonomy.html?section=job&view=subjects":"taxonomy.html?section="+care+"&level="+item.level});box.append(b)})}
function render(){if(active==="question-create"){const care=document.getElementById("care").value;location.replace("question_create.html"+(care?"?division="+encodeURIComponent(care):""));return}const r=routes[active];document.getElementById("sectionTitle").textContent=r.title;const careLabel=document.querySelector("label[for=care]");const careSelect=document.getElementById("care");careLabel.hidden=!!r.universal;careSelect.hidden=!!r.universal;if(active==="management"&&careSelect.value&&!managementLevels[careSelect.value].some(x=>x.level===activeManagementLevel))activeManagementLevel=0;const workspace=document.getElementById("workspace");renderManagementOptions();if(r.universal){document.getElementById("sectionNote").textContent=r.note;workspace.src=r.url}else if(!careSelect.value){document.getElementById("sectionNote").textContent="কাজ শুরু করতে আগে বিভাগ নির্বাচন করুন। বিভাগ নির্বাচন না করা পর্যন্ত কোনো বিভাগের তথ্য লোড হবে না।";workspace.removeAttribute("src");workspace.src="about:blank"}else if(active==="management"){const list=managementLevels[careSelect.value];const item=list.find(x=>x.level===activeManagementLevel);document.getElementById("sectionNote").textContent="নিচ থেকে প্রয়োজনীয় ব্যবস্থাপনা নির্বাচন করুন: "+item.label;workspace.src=item.view==="subjects"?"taxonomy.html?section=job&view=subjects":"taxonomy.html?section="+careSelect.value+"&level="+activeManagementLevel}else{document.getElementById("sectionNote").textContent=r.note;workspace.src=r[careSelect.value]}document.querySelectorAll("[data-section]").forEach(b=>b.classList.toggle("active",b.dataset.section===active));}
// Keep embedded section pages free of legacy home/menu navigation.
const workspaceFrame=document.getElementById("workspace");
function cleanEmbeddedSection(){
  try{
    const doc=workspaceFrame.contentDocument;
    if(!doc)return;
    if(!doc.getElementById("central-legacy-navigation-cleanup")){
      const style=doc.createElement("style");
      style.id="central-legacy-navigation-cleanup";
      style.textContent=`
        .dashboard-top,.admin-menu,.direct-dashboard-nav,.central-home-nav,.central-section-nav,
        .taxonomy-manager-link{display:none!important}
        a[href*="home.html"],a[href*="index.html"],a[href*="control-center.html"]{display:none!important}
        .return-home-wrap:has(a[href*="home.html"]),.return-home:has(+ a[href*="home.html"]){display:none!important}
      `;
      doc.head.appendChild(style);
    }
    doc.querySelectorAll('a[href*="home.html"],a[href*="index.html"],a[href*="control-center.html"]').forEach(a=>{
      const parent=a.parentElement;
      if(parent && /^(P|NAV)$/.test(parent.tagName) && parent.querySelectorAll("a").length===1 && !parent.textContent.replace(a.textContent,"").trim()) parent.style.display="none";
    });
  }catch(_){}
}
workspaceFrame.addEventListener("load",cleanEmbeddedSection);
document.getElementById("nav").addEventListener("click",e=>{const b=e.target.closest("[data-section]");if(!b)return;active=b.dataset.section;document.getElementById("nav").classList.remove("open");document.getElementById("nav").hidden=true;document.getElementById("menuToggle").setAttribute("aria-expanded","false");render()});
document.getElementById("menuToggle").addEventListener("click",()=>{const nav=document.getElementById("nav");const opened=nav.hidden;nav.hidden=!opened;nav.classList.toggle("open",opened);document.getElementById("menuToggle").setAttribute("aria-expanded",String(opened))});
document.getElementById("care").addEventListener("change",()=>{activeManagementLevel=0;render()});
if(new URLSearchParams(location.search).has("section")&&routes[new URLSearchParams(location.search).get("section")])active=new URLSearchParams(location.search).get("section");
render();
</script>
</body></html>
