<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#102a43">
<title>ফেইসবুক পাঠশালা — কেন্দ্রীয় ব্যবস্থাপনা</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f1f5f9;color:#102a43;font-family:system-ui,-apple-system,"Noto Sans Bengali",sans-serif}
header{position:sticky;top:0;z-index:20;background:#102a43;color:#fff;padding:14px 18px;box-shadow:0 4px 18px #102a4320}.header-row{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}.header-links{display:flex;gap:8px;flex-wrap:wrap}.header-link{display:inline-flex;align-items:center;padding:8px 11px;border:1px solid #7c91a8;border-radius:9px;color:#fff;text-decoration:none;font-size:13px;font-weight:750}.header-link:hover{background:#244660}.public-link{background:#0f766e;border-color:#0f766e}@media(max-width:520px){header{padding:12px}.header-link{font-size:12px;padding:7px 9px}}
.brand{font-size:19px;font-weight:850}.sub{font-size:12px;color:#c7d9e8;margin-top:3px}
.layout{display:block;min-height:calc(100vh - 65px)}
aside{padding:0 18px;background:#fff;border-bottom:1px solid #dbe5ef;position:relative}
.menu-toggle{display:none!important}
.nav{display:none!important}
.nav.open{display:grid}.nav[hidden]{display:none!important}.nav button{width:100%;border:0;border-radius:8px;background:transparent;color:#334e68;text-align:left;padding:12px;font:700 14px system-ui;cursor:pointer}
.nav button.active,.nav button:hover{background:#e5f3f5;color:#0f766e}
main{padding:18px;min-width:0}.toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}.management-options{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 12px;padding:10px;border:1px solid #c7d2fe;border-radius:13px;background:linear-gradient(120deg,#eff6ff 0%,#f5f3ff 48%,#ecfeff 100%);box-shadow:0 3px 10px #102a4308}.management-options[hidden]{display:none!important}.management-options button{flex:1 1 155px;min-height:44px;border:1px solid #102a43;border-radius:9px;background:#102a43;color:#fff;padding:10px 13px;font:700 14px system-ui;cursor:pointer;transition:background .15s,border-color .15s,transform .15s}.management-options button.active,.management-options button:hover{background:#244660;border-color:#0ea5e9;color:#fff;box-shadow:0 3px 9px #0f766e12}.management-options button:active{transform:translateY(1px)}
select{min-height:42px;padding:8px 12px;border:1px solid #b8c8d8;border-radius:9px;background:#fff;color:#102a43;font:inherit}
.toolbar{position:relative;isolation:isolate;gap:12px;padding:16px 18px;border:1px solid #c7d2fe;border-radius:16px;background:linear-gradient(120deg,#eff6ff 0%,#f5f3ff 48%,#ecfeff 100%);box-shadow:0 8px 22px rgba(49,46,129,.09);margin-bottom:12px}
.toolbar:before{content:"";position:absolute;inset:0 auto 0 0;width:6px;border-radius:16px 0 0 16px;background:linear-gradient(180deg,#4f46e5,#0ea5e9,#14b8a6);z-index:-1}
.toolbar #sectionTitle.title{display:inline-flex;align-items:center;min-height:48px;font-size:23px;font-weight:900;margin-right:auto;color:#fff!important;-webkit-text-fill-color:#fff!important;letter-spacing:-.3px;background:#1d4ed8!important;background:linear-gradient(110deg,#312e81 0%,#1d4ed8 58%,#0e7490 100%)!important;border:2px solid #0e7490;border-radius:11px;padding:10px 16px;box-shadow:0 5px 14px rgba(29,78,216,.35)}
.toolbar label{font-size:13px;font-weight:800;color:#4338ca;background:#e0e7ff;border:1px solid #c7d2fe;border-radius:999px;padding:7px 11px}
#care{min-width:190px;min-height:46px;border:2px solid #a5b4fc;border-radius:12px;background:linear-gradient(180deg,#fff 0%,#eef2ff 100%);color:#312e81;font-weight:750;box-shadow:0 3px 9px rgba(79,70,229,.09);cursor:pointer}
#care:focus{outline:3px solid #c4b5fd;outline-offset:2px}
#care option{background:#fff;color:#172554}
.note{font-size:13px;color:#475569;margin:0 0 12px;padding:10px 13px;border-left:4px solid #38bdf8;border-radius:0 10px 10px 0;background:linear-gradient(90deg,#f0f9ff,#f8fafc)}
.framewrap{height:calc(100vh - 300px);min-height:350px;background:#fff;border:1px solid #dbe5ef;border-radius:13px;overflow:hidden}
iframe{display:block;width:100%;height:100%;border:0;background:#fff}
@media(max-width:760px){aside{padding:0 10px}.nav{left:10px;right:10px;grid-template-columns:1fr 1fr}.nav button{font-size:12px;padding:10px}main{padding:10px}.toolbar{padding:14px;gap:8px;border-radius:13px}.toolbar .title{width:100%;font-size:21px;margin:0 0 3px}.toolbar label{margin-right:0}#care{flex:1;min-width:0;width:100%}.framewrap{height:calc(100vh - 340px);min-height:300px}}
</style>
<style id="central-nearby-return">
.toolbar a#centralReturn.central-return{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:42px;max-width:100%;padding:9px 13px;border:1px solid #1d4ed8;border-radius:11px;background:linear-gradient(110deg,#312e81 0%,#1d4ed8 55%,#0891b2 100%)!important;color:#fff!important;-webkit-text-fill-color:#fff!important;text-decoration:none;font-weight:900;font-size:13px;white-space:normal;text-align:center;box-shadow:0 4px 12px rgba(37,99,235,.24);transition:filter .15s,transform .15s}
.central-return:hover{color:#fff!important;background:linear-gradient(110deg,#3730a3,#1d4ed8)!important;filter:saturate(1.12);transform:translateY(-1px)}
.central-return:focus-visible{outline:3px solid #a5f3fc;outline-offset:3px}
.toolbar .central-return{margin-left:auto}
@media(max-width:760px){.toolbar .central-return{width:100%;margin:4px 0 0;min-height:44px}}
</style>


</head>
<body>

<div class="layout">
<aside><button class="menu-toggle" id="menuToggle" type="button" aria-expanded="false" aria-controls="nav" hidden>☰ সব সেকশন</button><nav class="nav" id="nav" aria-label="কেন্দ্রীয় সেকশন" hidden>
<button class="active" data-section="management">১. ব্যবস্থাপনা</button>
<button data-section="question-create">২. প্রশ্ন তৈরি</button>
<button data-section="question-bank">৩. প্রশ্ন ব্যাংক</button>
<button data-section="exam-create">৪. পরীক্ষা তৈরি</button>
<button data-section="exam-manage">৫. পরীক্ষা পরিচালনা</button>
<button data-section="results">৬. ফলাফল পর্যালোচনা</button>
<button data-section="materials">৭. স্টাডি ম্যাটেরিয়ালস</button>
<button data-section="important-links">৮. গুরুত্বপূর্ণ তথ্য ও পোস্ট লিংক</button>
<button data-section="breaking-news">৯. ব্রেকিং নিউজ</button>
<button data-section="social-links">১০. ফেইসবুক পাঠশালা লিংক</button>
</nav></aside>
<main>
<div class="toolbar"><div class="title" id="sectionTitle">ব্যবস্থাপনা</div><label for="care">বিভাগ:</label><select id="care"><option value="">বিভাগ নির্বাচন করুন</option><option value="job">Job Care</option><option value="academic">Academic Care</option></select><a class="central-return" id="centralReturn" href="https://fbpathshala.github.io/home.html">⌂ মূল মেনু / হোম পেইজে ফিরুন</a></div>
<div class="management-options" id="managementOptions" hidden aria-label="ব্যবস্থাপনার ধরন"></div>
<p class="note" id="sectionNote">বিভাগ অনুযায়ী ব্যবস্থাপনার ধরন নির্বাচন করুন।</p>
<div class="framewrap"><iframe id="workspace" title="নির্বাচিত ব্যবস্থাপনা সেকশন" src="taxonomy.html"></iframe></div>
</main>
</div>

<script>
const routes={
management:{title:"ব্যবস্থাপনা",note:"ক্যাটাগরি, সাব-ক্যাটাগরি, সেট, বিষয় এবং Academic Care-এর শ্রেণি/অধ্যায় পরিচালনা করুন।",job:"taxonomy.html?section=job",academic:"taxonomy.html?section=academic"},
"question-create":{title:"প্রশ্ন তৈরি",note:"নির্বাচিত বিভাগের জন্য MCQ/CQ প্রশ্ন হাতে লিখে বা CSV/Excel থেকে Question Bank-এ যোগ করুন।",job:"question_create.html?embedded=1&division=job",academic:"question_create.html?embedded=1&division=academic"},
"question-bank":{title:"প্রশ্ন ব্যাংক",note:"এখানে শুধু প্রশ্ন দেখা, সার্চ/ফিল্টার, প্রশ্ন সম্পাদনা ও প্রয়োজন হলে স্থানান্তর করুন। ক্যাটাগরি, সাব-ক্যাটাগরি, সেট ও বিষয় তৈরি/পরিবর্তন/মুছে ফেলার কাজ শুধু ‘ব্যবস্থাপনা’ সেকশনে হবে।",job:"question_bank.html?embedded=1",academic:"question_bank.html?embedded=1&division=academic"},
"exam-create":{title:"পরীক্ষা তৈরি",note:"নির্বাচিত বিভাগের প্রশ্ন ব্যাংক থেকে প্রশ্ন নিয়ে পরীক্ষা তৈরি করুন।",job:"create-exam.html",academic:"https://fbpathshala.github.io/academic/exam-create.html"},
"exam-manage":{title:"পরীক্ষা পরিচালনা",note:"নির্বাচিত বিভাগের পরীক্ষা পরিচালনা করুন।",job:"exam-manager.html",academic:"https://fbpathshala.github.io/academic/exam-management.html?central=1&view=exams"},
results:{title:"ফলাফল পর্যালোচনা",note:"MCQ ফলাফল পর্যালোচনা এবং CQ মূল্যায়নের ব্যবস্থা খুলুন।",job:"results-manager.html",academic:"https://fbpathshala.github.io/academic/exam-management.html?central=1&view=reviews"},
materials:{title:"স্টাডি ম্যাটেরিয়ালস",note:"নির্বাচিত বিভাগের নোট, ছবি ও PDF পরিচালনার ব্যবস্থা খুলুন।",job:"study-materials.html?admin=1",academic:"https://fbpathshala.github.io/academic/admin.html?central=1&view=materials"},
"important-links":{title:"গুরুত্বপূর্ণ তথ্য ও পোস্ট লিংক",note:"এটি কোনো বিভাগের অধীন নয়। গুরুত্বপূর্ণ পোস্টের লিংক ও নোট পরিচালনা করুন।",universal:true,url:"site-content-admin.html?section=important-links"},
"breaking-news":{title:"ব্রেকিং নিউজ",note:"পাবলিক হোমপেজে লিংকসহ বা লিংক ছাড়া সংবাদ প্রকাশ করুন।",universal:true,url:"site-content-admin.html?section=breaking-news"},
"social-links":{title:"ফেইসবুক পাঠশালা লিংক",note:"ফেইসবুক পাঠশালা পেইজ ও গ্রুপের লিংক পরিচালনা করুন।",universal:true,url:"site-content-admin.html?section=social-links"}
};
let active="management";
let activeManagementLevel=0;
const managementLevels={job:[{level:0,label:"ক্যাটাগরি ব্যবস্থাপনা"},{level:1,label:"সাব ক্যাটাগরি ব্যবস্থাপনা"},{level:2,label:"সেট ব্যবস্থাপনা"},{level:3,label:"বিষয় ব্যবস্থাপনা",view:"subjects"}],academic:[{level:0,label:"শ্রেণি ব্যবস্থাপনা"},{level:1,label:"বিষয় ব্যবস্থাপনা"},{level:2,label:"অধ্যায় ব্যবস্থাপনা"},{level:3,label:"সেট ব্যবস্থাপনা"}]};
function freshSectionUrl(url){const u=new URL(url,location.href);u.searchParams.set("uiVersion","20261020-color-refresh1");return u.href}
function renderManagementOptions(){const box=document.getElementById("managementOptions"),care=document.getElementById("care").value;box.innerHTML="";if(active!=="management"||!care){box.hidden=true;return}box.hidden=false;managementLevels[care].forEach(item=>{const b=document.createElement("button");b.type="button";b.textContent=item.label;b.dataset.managementLevel=String(item.level);b.classList.toggle("active",item.level===activeManagementLevel);b.addEventListener("click",()=>{activeManagementLevel=item.level;renderManagementOptions();document.getElementById("sectionNote").textContent="নির্বাচিত ব্যবস্থাপনা: "+item.label;document.getElementById("workspace").src=freshSectionUrl(item.view==="subjects"?"taxonomy.html?section=job&view=subjects":"taxonomy.html?section="+care+"&level="+item.level)});box.append(b)})}
function render(){const r=routes[active];document.getElementById("sectionTitle").textContent=r.title;const careLabel=document.querySelector("label[for=care]");const careSelect=document.getElementById("care");careLabel.hidden=!!r.universal;careSelect.hidden=!!r.universal;if(active==="management"&&careSelect.value&&!managementLevels[careSelect.value].some(x=>x.level===activeManagementLevel))activeManagementLevel=0;const workspace=document.getElementById("workspace");renderManagementOptions();if(r.universal){document.getElementById("sectionNote").textContent=r.note;workspace.src=freshSectionUrl(r.url)}else if(!careSelect.value){document.getElementById("sectionNote").textContent="কাজ শুরু করতে আগে বিভাগ নির্বাচন করুন। বিভাগ নির্বাচন না করা পর্যন্ত কোনো বিভাগের তথ্য লোড হবে না।";workspace.removeAttribute("src");workspace.src="about:blank"}else if(active==="management"){const list=managementLevels[careSelect.value];const item=list.find(x=>x.level===activeManagementLevel);document.getElementById("sectionNote").textContent="নিচ থেকে প্রয়োজনীয় ব্যবস্থাপনা নির্বাচন করুন: "+item.label;workspace.src=freshSectionUrl(item.view==="subjects"?"taxonomy.html?section=job&view=subjects":"taxonomy.html?section="+careSelect.value+"&level="+activeManagementLevel)}else{document.getElementById("sectionNote").textContent=r.note;workspace.src=freshSectionUrl(r[careSelect.value])}document.querySelectorAll("[data-section]").forEach(b=>b.classList.toggle("active",b.dataset.section===active));const back=document.getElementById("centralReturn");if(r.universal||!careSelect.value){back.href="https://fbpathshala.github.io/home.html";back.textContent="⌂ মূল মেনু / হোম পেইজে ফিরুন"}else if(active==="management"&&activeManagementLevel>0){back.href="#";back.textContent="← ব্যবস্থাপনার আগের ধাপে ফিরুন"}else{back.href="#";back.textContent="← "+r.title+" সেকশনে ফিরুন"}}
// Keep embedded section pages free of legacy home/menu navigation.
const workspaceFrame=document.getElementById("workspace");
function cleanEmbeddedSection(){
  try{
    const doc=workspaceFrame.contentDocument;
    if(!doc)return;
    if(!doc.getElementById("central-legacy-navigation-cleanup")){
      const style=doc.createElement("style");
      style.id="central-legacy-navigation-cleanup";
      style.textContent=`
        .dashboard-top,.admin-menu,.direct-dashboard-nav,.central-home-nav,.central-section-nav,
        .taxonomy-manager-link{display:none!important}
        .central-section-return{display:none!important}
      `;
      doc.head.appendChild(style);
    }
    doc.querySelectorAll('a[href*="home.html"],a[href*="index.html"],a[href*="control-center.html"],a[href*="question-bank-select.html"]').forEach(a=>{
      a.style.setProperty("display","none","important");
      const parent=a.parentElement;
      if(parent && /^(P|NAV)$/.test(parent.tagName) && parent.querySelectorAll("a").length===1) parent.style.setProperty("display","none","important");
    });
    const path=(new URL(workspaceFrame.src,location.href)).pathname;
    if(/\/(exam-manager|results-manager)\.html$/.test(path)){
      const header=doc.querySelector("header");
      if(header && /ফেইসবুক পাঠশালা/.test(header.textContent)) header.style.setProperty("display","none","important");
    }
  }catch(_){}
}
workspaceFrame.addEventListener("load",cleanEmbeddedSection);
document.getElementById("nav").addEventListener("click",e=>{const b=e.target.closest("[data-section]");if(!b)return;active=b.dataset.section;document.getElementById("nav").classList.remove("open");document.getElementById("nav").hidden=true;document.getElementById("menuToggle").setAttribute("aria-expanded","false");render()});
document.getElementById("menuToggle").addEventListener("click",()=>{const nav=document.getElementById("nav");const opened=nav.hidden;nav.hidden=!opened;nav.classList.toggle("open",opened);document.getElementById("menuToggle").setAttribute("aria-expanded",String(opened))});
document.getElementById("care").addEventListener("change",()=>{activeManagementLevel=0;render()});
document.getElementById("centralReturn").addEventListener("click",e=>{
  const r=routes[active], care=document.getElementById("care");
  if(r.universal){return;}
  if(active==="management"&&care.value&&activeManagementLevel>0){
    e.preventDefault();activeManagementLevel--;render();return;
  }
  if(care.value){
    e.preventDefault();care.value="";activeManagementLevel=0;render();return;
  }
});

const initialParams=new URLSearchParams(location.search);
if(initialParams.has("section")&&routes[initialParams.get("section")])active=initialParams.get("section");
// Do not auto-select any department. Only honour an explicit ?care=job or ?care=academic.
const requestedCare=initialParams.get("care");
if(requestedCare==="job"||requestedCare==="academic")document.getElementById("care").value=requestedCare;
else document.getElementById("care").value="";
render();
</script>
</body></html>
