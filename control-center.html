<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#102a43">
<title>ফেইসবুক পাঠশালা — কেন্দ্রীয় ব্যবস্থাপনা</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f1f5f9;color:#102a43;font-family:system-ui,-apple-system,"Noto Sans Bengali",sans-serif}
header{position:sticky;top:0;z-index:20;background:#102a43;color:#fff;padding:14px 18px;box-shadow:0 4px 18px #102a4320}
.brand{font-size:19px;font-weight:850}.sub{font-size:12px;color:#c7d9e8;margin-top:3px}
.layout{display:grid;grid-template-columns:250px minmax(0,1fr);min-height:calc(100vh - 65px)}
aside{padding:14px;background:#fff;border-right:1px solid #dbe5ef}
.nav{display:flex;flex-direction:column;gap:6px}.nav button{width:100%;border:0;border-radius:10px;background:transparent;color:#334e68;text-align:left;padding:12px;font:700 14px inherit;cursor:pointer}
.nav button.active,.nav button:hover{background:#e5f3f5;color:#0f766e}
main{padding:18px;min-width:0}.toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
select{min-height:42px;padding:8px 12px;border:1px solid #b8c8d8;border-radius:9px;background:#fff;color:#102a43;font:inherit}
.title{font-size:21px;font-weight:800;margin-right:auto}.note{font-size:13px;color:#52677d;margin:0 0 12px}
.framewrap{height:calc(100vh - 150px);min-height:540px;background:#fff;border:1px solid #dbe5ef;border-radius:13px;overflow:hidden}
iframe{display:block;width:100%;height:100%;border:0;background:#fff}
@media(max-width:760px){.layout{grid-template-columns:1fr}aside{border-right:0;border-bottom:1px solid #dbe5ef;padding:9px}.nav{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}.nav button{font-size:12px;padding:10px}main{padding:10px}.framewrap{height:calc(100vh - 235px);min-height:460px}.title{width:100%}}
</style>
</head>
<body>
<header><div class="brand">🎓 ফেইসবুক পাঠশালা — কেন্দ্রীয় অ্যাডমিন</div><div class="sub">একটি প্যানেল • দশটি সেকশন • বিভাগভিত্তিক আলাদা তথ্য</div></header>
<div class="layout">
<aside><nav class="nav" id="nav" aria-label="কেন্দ্রীয় সেকশন">
<button class="active" data-section="management">১. ব্যবস্থাপনা</button>
<button data-section="question-create">২. প্রশ্ন তৈরি</button>
<button data-section="question-bank">৩. প্রশ্ন ব্যাংক</button>
<button data-section="exam-create">৪. পরীক্ষা তৈরি</button>
<button data-section="exam-manage">৫. পরীক্ষা পরিচালনা</button>
<button data-section="results">৬. ফলাফল পর্যালোচনা</button>
<button data-section="materials">৭. স্টাডি ম্যাটেরিয়ালস</button>
<button data-section="important-links">৮. গুরুত্বপূর্ণ তথ্য ও পোস্ট লিংক</button>
<button data-section="breaking-news">৯. ব্রেকিং নিউজ</button>
<button data-section="social-links">১০. ফেইসবুক পাঠশালা লিংক</button>
</nav></aside>
<main>
<div class="toolbar"><div class="title" id="sectionTitle">ব্যবস্থাপনা</div><label for="care">বিভাগ:</label><select id="care"><option value="job">Job Care</option><option value="academic">Academic Care</option></select></div>
<p class="note" id="sectionNote">বিভাগ অনুযায়ী ক্যাটাগরি/শ্রেণি, সাব-ক্যাটাগরি/বিষয়, অধ্যায় ও সেট পরিচালনা করুন।</p>
<div class="framewrap"><iframe id="workspace" title="নির্বাচিত ব্যবস্থাপনা সেকশন" src="taxonomy.html"></iframe></div>
</main>
</div>
<script>
const routes={
management:{title:"ব্যবস্থাপনা",note:"Job Care: ক্যাটাগরি, সাব ক্যাটাগরি, সেট ও বিষয়। Academic Care: শ্রেণি, বিষয়, অধ্যায় ও সেট।",job:"taxonomy.html",academic:"taxonomy.html?section=academic"},
"question-create":{title:"প্রশ্ন তৈরি",note:"ম্যানুয়াল বা CSV/Excel প্রশ্ন যোগ করার জন্য বিভাগ নির্বাচন করে সংশ্লিষ্ট প্রশ্ন তৈরির ব্যবস্থা ব্যবহার করুন।",job:"question_create.html",academic:"https://fbpathshala.github.io/academic/admin.html"},
"question-bank":{title:"প্রশ্ন ব্যাংক",note:"বিভাগ নির্বাচন করে নিজস্ব MCQ/CQ প্রশ্ন ব্যাংক খুলুন।",job:"question-bank-type.html?care=job",academic:"question-bank-type.html?care=academic"},
"exam-create":{title:"পরীক্ষা তৈরি",note:"নির্বাচিত বিভাগের প্রশ্ন ব্যাংক থেকে প্রশ্ন নিয়ে পরীক্ষা তৈরি করুন।",job:"create-exam.html",academic:"https://fbpathshala.github.io/academic/admin.html"},
"exam-manage":{title:"পরীক্ষা পরিচালনা",note:"নির্বাচিত বিভাগের পরীক্ষা পরিচালনা করুন।",job:"exam-manager.html",academic:"https://fbpathshala.github.io/academic/admin.html"},
results:{title:"ফলাফল পর্যালোচনা",note:"MCQ ফলাফল পর্যালোচনা এবং CQ মূল্যায়নের ব্যবস্থা খুলুন।",job:"results-manager.html",academic:"https://fbpathshala.github.io/academic/admin.html"},
materials:{title:"স্টাডি ম্যাটেরিয়ালস",note:"নির্বাচিত বিভাগের নোট, ছবি ও PDF পরিচালনার ব্যবস্থা খুলুন।",job:"study-materials.html?admin=1",academic:"https://fbpathshala.github.io/academic/admin.html"},
"important-links":{title:"গুরুত্বপূর্ণ তথ্য ও পোস্ট লিংক",note:"এটি কোনো বিভাগের অধীন নয়। গুরুত্বপূর্ণ পোস্টের লিংক ও নোট পরিচালনা করুন।",universal:true,url:"site-content-admin.html?section=important-links"},
"breaking-news":{title:"ব্রেকিং নিউজ",note:"পাবলিক হোমপেজে লিংকসহ বা লিংক ছাড়া সংবাদ প্রকাশ করুন।",universal:true,url:"site-content-admin.html?section=breaking-news"},
"social-links":{title:"ফেইসবুক পাঠশালা লিংক",note:"ফেইসবুক পাঠশালা পেইজ ও গ্রুপের লিংক পরিচালনা করুন।",universal:true,url:"site-content-admin.html?section=social-links"}
};
let active="management";
function render(){const r=routes[active];document.getElementById("sectionTitle").textContent=r.title;document.getElementById("sectionNote").textContent=r.note;const careLabel=document.querySelector("label[for=care]");const careSelect=document.getElementById("care");careLabel.hidden=!!r.universal;careSelect.hidden=!!r.universal;document.getElementById("workspace").src=r.universal?r.url:r[careSelect.value];document.querySelectorAll("[data-section]").forEach(b=>b.classList.toggle("active",b.dataset.section===active));}
document.getElementById("nav").addEventListener("click",e=>{const b=e.target.closest("[data-section]");if(!b)return;active=b.dataset.section;render()});
document.getElementById("care").addEventListener("change",render);
if(new URLSearchParams(location.search).has("section")&&routes[new URLSearchParams(location.search).get("section")])active=new URLSearchParams(location.search).get("section");
render();
</script>
</body></html>
