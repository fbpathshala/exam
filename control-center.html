}
window.addEventListener('pageshow',enforceCentralPalette);

function render(){const r=routes[active];document.getElementById("sectionTitle").textContent=r.title;const careLabel=document.querySelector("label[for=care]");const careSelect=document.getElementById("care");const areaLabel=document.getElementById("managementAreaLabel");const areaSelect=document.getElementById("managementAreaFilter");areaLabel.hidden=active!=="management";areaSelect.hidden=active!=="management";careLabel.hidden=!!r.universal||(active==="management"&&!selectedManagementArea);careSelect.hidden=!!r.universal||(active==="management"&&!selectedManagementArea);if(active==="management"&&careSelect.value&&!managementLevels[careSelect.value].some(x=>x.level===activeManagementLevel))activeManagementLevel=0;const workspace=document.getElementById("workspace");const typeCards=document.getElementById("resultsTypeOptions");renderManagementOptions();typeCards.hidden=!(active==="results"&&!!careSelect.value);const typeSelect=document.getElementById("reviewTypeFilter");if(typeSelect)typeSelect.value=selectedReviewType||"ALL";if(r.universal){document.getElementById("sectionNote").textContent=r.note;workspace.src=freshSectionUrl(r.url)}else if(active==="management"&&!selectedManagementArea){document.getElementById("sectionNote").textContent="আগে প্রশ্ন তৈরি অথবা স্টাডি ম্যাটেরিয়ালস নির্বাচন করুন।";workspace.src="about:blank"}else if(!careSelect.value){document.getElementById("sectionNote").textContent="কাজ শুরু করতে আগে বিভাগ নির্বাচন করুন। বিভাগ নির্বাচন না করা পর্যন্ত কোনো বিভাগের তথ্য লোড হবে না।";workspace.src="about:blank"}else if(active==="management"&&selectedManagementArea==="study-materials"){document.getElementById("sectionNote").textContent="স্টাডি ম্যাটেরিয়ালের নিজস্ব কাঠামো";workspace.src=freshSectionUrl("taxonomy.html?mode=study-materials&department="+(careSelect.value==="job"?"job_care":"academic_care"))}else if(active==="management"){const list=managementLevels[careSelect.value].filter(x=>!x.url);const item=list.find(x=>x.level===activeManagementLevel)||list[0];document.getElementById("sectionNote").textContent="নিচ থেকে প্রয়োজনীয় ব্যবস্থাপনা নির্বাচন করুন: "+item.label;workspace.src=freshSectionUrl(item.url?item.url:(item.view==="subjects"?"taxonomy.html?section=job&view=subjects":"taxonomy.html?section="+careSelect.value+"&level="+item.level))}else if(active==="results"){document.getElementById("sectionNote").textContent=r.note+" — "+({MCQ:"MCQ পরীক্ষা",CQ:"CQ পরীক্ষা",MCQ_CQ:"MCQ + CQ পরীক্ষা",ALL:"সকল পরীক্ষা"}[selectedReviewType]||"");let url=r[careSelect.value];const u=new URL(url,location.href);if(careSelect.value==="job"){u.searchParams.set("division","job");u.searchParams.set("central","1");if(selectedReviewType&&selectedReviewType!=="ALL")u.searchParams.set("examType",selectedReviewType)}else{u.searchParams.set("division","academic");u.searchParams.set("view","reviews");if(selectedReviewType!=="ALL")u.searchParams.set("examType",selectedReviewType)}workspace.src=freshSectionUrl(u.href)}else{document.getElementById("sectionNote").textContent=r.note;workspace.src=freshSectionUrl(r[careSelect.value])}document.querySelectorAll("[data-section]").forEach(b=>b.classList.toggle("active",b.dataset.section===active));const back=document.getElementById("centralReturn");if(r.universal||(!careSelect.value)){back.href="https://fbpathshala.github.io/home.html";back.textContent="⌂ মূল মেনু / হোম পেইজে ফিরুন"}else if(active==="results"&&selectedReviewType&&selectedReviewType!=="ALL"){back.href="#";back.textContent="← ফলাফলের ধরন ফিল্টার রিসেট"}else if(active==="results"){back.href="#";back.textContent="← বিভাগ নির্বাচন"}else if(active==="management"&&activeManagementLevel>0){back.href="#";back.textContent="← ব্যবস্থাপনার আগের ধাপে ফিরুন"}else{back.href="#";back.textContent="← "+r.title+" সেকশনে ফিরুন"}}
// Keep embedded section pages free of legacy home/menu navigation.
const workspaceFrame=document.getElementById("workspace");
function cleanEmbeddedSection(){
  try{
    const doc=workspaceFrame.contentDocument;
    if(!doc)return;
    if(!doc.getElementById("central-legacy-navigation-cleanup")){
      const style=doc.createElement("style");
      style.id="central-legacy-navigation-cleanup";
      style.textContent=`
        .dashboard-top,.admin-menu,.direct-dashboard-nav,.central-home-nav,.central-section-nav,
        .taxonomy-manager-link{display:none!important}
        .central-section-return{display:none!important}
      `;
      doc.head.appendChild(style);
    }
    doc.querySelectorAll('a[href*="home.html"],a[href*="index.html"],a[href*="control-center.html"],a[href*="question-bank-select.html"]').forEach(a=>{
      a.style.setProperty("display","none","important");
      const parent=a.parentElement;
      if(parent && /^(P|NAV)$/.test(parent.tagName) && parent.querySelectorAll("a").length===1) parent.style.setProperty("display","none","important");
    });
    const path=(new URL(workspaceFrame.src,location.href)).pathname;
    if(/\/(exam-manager|results-manager)\.html$/.test(path)){
      const header=doc.querySelector("header");
      if(header && /ফেইসবুক পাঠশালা/.test(header.textContent)) header.style.setProperty("display","none","important");
    }
  }catch(_){}
}
workspaceFrame.addEventListener("load",cleanEmbeddedSection);
document.getElementById("nav").addEventListener("click",e=>{const b=e.target.closest("[data-section]");if(!b)return;active=b.dataset.section;selectedReviewType="ALL";document.getElementById("nav").classList.remove("open");document.getElementById("nav").hidden=true;document.getElementById("menuToggle").setAttribute("aria-expanded","false");render()});
document.getElementById("reviewTypeFilter").addEventListener("change",e=>{selectedReviewType=e.target.value||"ALL";render()});
document.getElementById("menuToggle").addEventListener("click",()=>{const nav=document.getElementById("nav");const open=nav.hidden||!nav.classList.contains("open");nav.hidden=!open;nav.classList.toggle("open",open);document.getElementById("menuToggle").setAttribute("aria-expanded",String(open))});
document.getElementById("care").addEventListener("change",()=>{activeManagementLevel=0;selectedReviewType="ALL";render()});
document.getElementById("managementAreaFilter").addEventListener("change",()=>{selectedManagementArea=document.getElementById("managementAreaFilter").value;document.getElementById("care").value="";activeManagementLevel=0;render()});
document.getElementById("centralReturn").addEventListener("click",e=>{
  const r=routes[active], care=document.getElementById("care");
  if(r.universal){return;}
  if(active==="management"&&care.value&&activeManagementLevel>0){
    e.preventDefault();activeManagementLevel--;render();return;
  }
  if(active==="results"&&selectedReviewType&&selectedReviewType!=="ALL"){e.preventDefault();selectedReviewType="ALL";render();return;}
  if(care.value){
    e.preventDefault();care.value="";activeManagementLevel=0;selectedReviewType="";render();return;
  }
});

const initialParams=new URLSearchParams(location.search);
if(initialParams.has("section")&&routes[initialParams.get("section")])active=initialParams.get("section");
// Do not auto-select any department. Only honour an explicit ?care=job or ?care=academic.
const requestedCare=initialParams.get("care");
if(requestedCare==="job"||requestedCare==="academic")document.getElementById("care").value=requestedCare;
else document.getElementById("care").value="";
if(active==="management"){document.getElementById("managementAreaFilter").value="";document.getElementById("care").value="";}
render();
enforceCentralPalette();
</script>
