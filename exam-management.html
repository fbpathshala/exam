<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>পরীক্ষা পরিচালনা</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f7fb;font-family:Arial,sans-serif;color:#172033}header{background:#1769aa;color:#fff;padding:14px 16px;display:flex}header button{margin-left:auto;background:none;border:0;color:#fff}main{max-width:1100px;margin:auto;padding:16px}.card{background:#fff;border:1px solid #e2e8f0;border-radius:14px;padding:16px;margin-bottom:12px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}input,select,button{width:100%;padding:11px;border-radius:9px;font:inherit}input,select{border:1px solid #cbd5e1}button{border:0;background:#1769aa;color:#fff;font-weight:700}.q{border:1px solid #e2e8f0;border-radius:10px;padding:12px;margin-top:9px}.danger{background:#fee2e2;color:#991b1b}.muted{color:#64748b;font-size:13px}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style></head><body><header><b>পরীক্ষা পরিচালনা</b><button onclick="go('dashboard.html')">ড্যাশবোর্ড</button></header><main><div class="card"><h3>পরীক্ষা সেটিংস / পরীক্ষা তৈরি</h3><div class="grid"><input id="en" placeholder="পরীক্ষার নাম"><input id="pm" type="number" placeholder="Pass Mark"></div><button id="ce">পরীক্ষা তৈরি</button><div id="em" class="muted"></div></div><div class="card"><h3>পরীক্ষা তালিকা</h3><div id="el"></div></div><div class="card"><h3>Question Bank থেকে প্রশ্ন এড</h3><select id="es"><option value="">পরীক্ষা নির্বাচন করুন</option></select><select id="sets"><option value="">Set নির্বাচন করুন</option></select><button id="lq">প্রশ্ন দেখুন</button><div id="bq"></div></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const sb=supabase.createClient("https://ydvbnalhcnfqpxkkmywr.supabase.co","sb_publishable_xCbSWDkASsbUPl-WmygyMw_eVrJY_9a");let exams=[];async function auth(){const {data:{session}}=await sb.auth.getSession();if(!session){location.href="admin.html";return false}return true}function go(x){location.href=x}async function loadExams(){let r=await sb.from("exams").select("*").order("id",{ascending:false});exams=r.data||[];el.innerHTML=exams.map(x=>`<div class="q"><b>${x.exam_name}</b><div class="muted">ID: ${x.id} | Status: ${x.status||""}</div><button onclick="es.value=${x.id}">এই পরীক্ষায় প্রশ্ন এড</button><button class="danger" onclick="delExam(${x.id})">পরীক্ষা মুছুন</button></div>`).join("")||"কোনো পরীক্ষা নেই";es.innerHTML='<option value="">পরীক্ষা নির্বাচন করুন</option>'+exams.map(x=>`<option value="${x.id}">${x.exam_name}</option>`).join("")}async function loadSets(){let r=await sb.from("question_bank_sets").select("id,set_name").order("id");sets.innerHTML='<option value="">Set নির্বাচন করুন</option>'+(r.data||[]).map(x=>`<option value="${x.id}">${x.set_name}</option>`).join("")}ce.onclick=async()=>{if(!en.value.trim())return;let r=await sb.from("exams").insert({exam_name:en.value.trim(),pass_mark:Number(pm.value)||0,status:"draft"});em.textContent=r.error?r.error.message:"পরীক্ষা তৈরি হয়েছে";if(!r.error){en.value=pm.value="";loadExams()}};lq.onclick=async()=>{if(!es.value||!sets.value)return;let r=await sb.from("questions").select("*").eq("set_id",Number(sets.value)).order("question_number");bq.innerHTML=(r.data||[]).map(x=>`<div class="q"><b>${x.question_number||""}. ${x.question_text}</b><div class="muted">Subject: ${x.subject_id}</div><button onclick="addQ(${x.id})">এড করুন</button></div>`).join("")||"কোনো প্রশ্ন নেই"};async function addQ(qid){let examId=Number(es.value);let r=await sb.from("exam_questions").select("question_order",{count:"exact",head:true}).eq("exam_id",examId);let order=(r.count||0)+1;r=await sb.from("exam_questions").insert({exam_id:examId,question_id:qid,question_order:order,marks:1,negative_mark:0});alert(r.error?r.error.message:"প্রশ্ন এড হয়েছে")}async function delExam(id){if(!confirm("পরীক্ষাটি মুছবেন?"))return;let r=await sb.from("exams").delete().eq("id",id);if(r.error)alert(r.error.message);else loadExams()}(async()=>{if(await auth()){loadExams();loadSets()}})();</script></body></html>
