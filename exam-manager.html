
<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>পরীক্ষা সেটিংস ও ব্যবস্থাপনা</title>
<link rel="stylesheet" href="css/admin.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
.wrap{max-width:1100px;margin:24px auto;padding:12px}
.card{background:#fff;padding:17px;border-radius:12px;margin:12px 0;box-shadow:0 3px 14px #0001}
.exam-card{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.exam-title{font-weight:bold;color:#075985;cursor:pointer;text-decoration:underline}
.actions{display:flex;gap:6px;flex-wrap:wrap}
button,.btn{padding:9px 12px;border:0;border-radius:7px;background:#1769aa;color:#fff;cursor:pointer;text-decoration:none;display:inline-block}
.secondary{background:#64748b}.danger{background:#b91c1c}.green{background:#15803d}
.hidden{display:none}
label{display:inline-block;margin:8px}
input,select{padding:8px;max-width:100%}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pool{max-height:330px;overflow:auto;border:1px solid #ddd;padding:10px;border-radius:7px}
.qrow{display:block;padding:7px;border-bottom:1px solid #eee}
#pageMsg,#mapMsg{white-space:pre-wrap}
@media(max-width:650px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<main class="wrap">
  <section class="card">
    <h1>⚙️ পরীক্ষা সেটিংস ও ব্যবস্থাপনা</h1>
    <p>পরীক্ষার নাম চাপলে লিংক কপি হবে।</p>
    <a class="btn" href="create-exam.html">➕ পরীক্ষা তৈরি</a>
    <a class="btn secondary" href="dashboard.html">ড্যাশবোর্ড</a>
    <p id="pageMsg"></p>
  </section>

  <div id="exams">পরীক্ষার তালিকা লোড হচ্ছে…</div>

  <section id="mapping" class="card hidden">
    <h2>প্রশ্ন যোগ/বিয়োগ</h2>
    <p id="mappingExamName"></p>

    <div class="grid">
      <div>
        <label>ফোল্ডার
          <select id="folder"><option value="">নির্বাচন</option></select>
        </label>
        <label>সেট
          <select id="set"><option value="">নির্বাচন</option></select>
        </label>
        <button id="loadPool">প্রশ্ন দেখুন</button>
      </div>

      <div>
        <b>নির্বাচিত প্রশ্ন</b>
        <div id="selectedList" class="pool"></div>
      </div>
    </div>

    <p>
      <button id="selectAll" class="secondary">সব নির্বাচন</button>
      <button id="deselectAll" class="secondary">সব বাদ</button>
    </p>

    <div id="pool" class="pool"></div>

    <p>
      <button id="saveMap" class="green">প্রশ্ন সংরক্ষণ</button>
      <button id="closeMapping" class="secondary">বন্ধ</button>
    </p>
    <p id="mapMsg"></p>
  </section>
</main>

<script src="js/supabase.js"></script>
<script src="js/exam-manager.js"></script>
</body>
</html>
