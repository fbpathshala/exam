<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Exam Manager</title>
<link rel="stylesheet" href="css/admin.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
.wrap{max-width:1100px;margin:auto;padding:18px}.exam-card{background:#fff;border:1px solid #e5e7eb;border-radius:14px;padding:16px;margin:12px 0}.exam-card.mapping-open{border-color:#2563eb;box-shadow:0 0 0 2px #dbeafe}.exam-head{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}.exam-top-actions{display:flex;gap:7px;flex-wrap:wrap;align-items:center}.exam-top-actions button{margin:0}.exam-actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}.exam-actions button{margin:0}.danger{background:#dc2626!important}.secondary{background:#53657a!important}.linkbox{background:#f5f8fc;padding:9px;border-radius:8px;word-break:break-all;font-size:13px;margin-top:8px}.pool{margin-top:12px;max-height:480px;overflow:auto;border:1px solid #e5e7eb;border-radius:10px;padding:8px}.q{display:block;padding:12px;border-bottom:1px solid #eee}.q:last-child{border-bottom:0}.qhead{display:flex;gap:9px;align-items:flex-start}.qtext{font-weight:700;line-height:1.5}.opts{margin:7px 0 0 28px;line-height:1.6}.meta{margin:7px 0 0 28px;font-size:12px;color:#64748b}.map-tools{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin:12px 0}.mapping-inline{margin-top:12px}.mapping-inline h2{margin-top:0}.map-tools label{font-weight:700}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}@media(max-width:700px){.grid2{grid-template-columns:1fr}}
.mode-buttons{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.mode-buttons button.active{outline:2px solid #2563eb}.remove-note{background:#fff7ed;border:1px solid #fed7aa;border-radius:8px;padding:9px;margin:10px 0}.current-title{font-weight:700;margin-top:10px}
</style>
</head>
<body>
<main class="wrap">
<div class="card">
 <div class="exam-head"><div><h1>📚 পরীক্ষা প্রশ্ন ম্যানেজমেন্ট</h1><p>পরীক্ষার প্রশ্ন যোগ ও বর্তমান প্রশ্ন সরানোর জন্য ব্যবহার করুন।</p></div><button onclick="location.href='admin_dashboard_split.html'">Admin</button></div>
 <button onclick="location.href='create-exam.html'">➕ নতুন পরীক্ষা তৈরি</button>
 <p id="msg" class="msg"></p>
</div>
<div id="exams"></div>
<div id="mapping" class="card hidden">
 <h2 id="mapHeading">➕ প্রশ্ন যোগ করুন</h2>
 <p id="mapTitle"></p>
 <div class="mode-buttons">
  <button type="button" id="addModeBtn" onclick="setMode('add')">➕ প্রশ্ন Add</button>
  <button type="button" class="secondary" id="removeModeBtn" onclick="setMode('remove')">➖ প্রশ্ন Remove</button>
 </div>
 <div id="addPanel">
  <div class="grid2"><select id="folder"><option value="">Folder নির্বাচন করুন</option></select><select id="set"><option value="">Set নির্বাচন করুন</option></select></div>
  <button id="loadPool">প্রশ্ন দেখান</button>
  <div class="map-tools"><label><input type="checkbox" id="selectAll"> সব প্রশ্ন Select All</label><button type="button" class="secondary" id="deselectAll">Deselect</button></div>
  <div id="pool" class="pool"></div>
  <button id="saveMap">➕ নির্বাচিত প্রশ্ন পরীক্ষায় যোগ করুন</button>
 </div>
 <div id="removePanel" class="hidden">
  <div class="remove-note">এখান থেকে প্রশ্ন সরালে শুধু এই পরীক্ষা থেকে প্রশ্নটি Remove হবে। Question Bank-এর মূল প্রশ্ন মুছে যাবে না।</div>
  <div class="map-tools"><label><input type="checkbox" id="removeSelectAll"> সব বর্তমান প্রশ্ন Select All</label><button type="button" class="secondary" id="removeDeselectAll">Deselect</button></div>
  <div id="currentPool" class="pool"></div>
  <button id="removeSelected" class="danger">➖ নির্বাচিত প্রশ্ন Remove করুন</button>
 </div>
 <button class="secondary" onclick="closeMapping()">বন্ধ করুন</button><p id="mapMsg" class="msg"></p>
</div>
</main>
<script src="js/supabase.js"></script><script src="js/exam-manager.js"></script>
</body>
</html>
