<!doctype html>
<html lang="bn">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ফেইসবুক পাঠশালা — পরীক্ষা ব্যবস্থাপনা</title>
  <link rel="stylesheet" href="css/admin.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    .exam,.panel{background:#fff;border:1px solid #dbe3ee;border-radius:12px;margin:12px 0;padding:14px}
    .head{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
    .name{flex:1;min-width:150px;text-align:left;color:#1756a9;background:#fff}
    .menu{width:auto;min-width:44px}
    .buttons{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:12px}
    .panel{border-top:1px solid #dbe3ee;margin-top:10px;padding-top:10px}
    .q{display:flex;gap:8px;padding:8px 0;border-bottom:1px solid #eee;align-items:center}
    .q input{width:auto}
    #message{overflow-wrap:anywhere;white-space:pre-wrap}
    @media(max-width:600px){.buttons{grid-template-columns:1fr}}
  </style>
<style id="direct-dashboard-navigation">.direct-dashboard-nav{position:fixed;right:16px;bottom:16px;z-index:9999;display:inline-flex;align-items:center;gap:8px;padding:11px 16px;border-radius:999px;background:#1d4ed8;color:#fff!important;text-decoration:none!important;font:700 15px/1.2 Arial,sans-serif;box-shadow:0 5px 18px #0003;border:2px solid #fff}.direct-dashboard-nav:hover{background:#1e40af;transform:translateY(-1px)}@media print{.direct-dashboard-nav{display:none!important}}</style></head>
<body>
  <header>
    <b>ফেইসবুক পাঠশালা — অ্যাডমিন</b>
    <span style="margin-left:auto"></span>
    <button type="button" class="secondary" onclick="location.href='dashboard.html'">🏠 ড্যাশবোর্ড</button>
  </header>
  <main class="wrap">
    <section class="card">
      <h1>পরীক্ষা ব্যবস্থাপনা</h1>
      <p>পরীক্ষার নাম চাপলে লিংক কপি হবে। পাশে ☰ চাপলে কাজের বাটন খুলবে।</p>
      <button type="button" onclick="location.href='create-exam.html'">＋ নতুন পরীক্ষা তৈরি</button>
      <p id="message" class="msg">লোড হচ্ছে…</p>
    </section>
    <div id="examList"></div>
  </main>
  <script src="js/supabase.js"></script>
  <script src="js/exam-manager.js"></script>
</body>
</html>
