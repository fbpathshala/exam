<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>পরীক্ষার সেটিংস</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      background: #f4f6f9;
      color: #222;
      font-family: Arial, sans-serif;
      line-height: 1.6;
    }

    .container {
      max-width: 760px;
      margin: 0 auto;
      padding: 24px;
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
    }

    h1 {
      margin-top: 0;
      text-align: center;
      font-size: 25px;
    }

    h2 {
      margin-top: 26px;
      padding-bottom: 8px;
      border-bottom: 1px solid #e5e7eb;
      font-size: 19px;
    }

    label {
      display: block;
      margin: 14px 0 6px;
      font-weight: bold;
    }

    input[type="text"],
    input[type="number"],
    input[type="url"],
    select,
    textarea {
      width: 100%;
      padding: 11px;
      border: 1px solid #cbd5e1;
      border-radius: 7px;
      font: inherit;
    }

    textarea {
      min-height: 90px;
      resize: vertical;
    }

    .checkbox-row {
      display: flex;
      align-items: flex-start;
      gap: 9px;
      margin: 14px 0;
    }

    .checkbox-row input {
      margin-top: 6px;
      transform: scale(1.15);
    }

    .checkbox-row label {
      margin: 0;
      font-weight: normal;
    }

    button {
      padding: 11px 17px;
      border: 0;
      border-radius: 7px;
      background: #087443;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    .load-button {
      margin-top: 12px;
      background: #175cd3;
    }

    .save-button {
      width: 100%;
      margin-top: 22px;
      font-weight: bold;
    }

    .message {
      margin-top: 12px;
      padding: 10px;
      border-radius: 7px;
      overflow-wrap: anywhere;
    }

    .message:empty {
      display: none;
    }

    .success {
      background: #e8f7ed;
      color: #176534;
    }

    .error {
      background: #fdecec;
      color: #a32121;
    }

    .hint {
      color: #555;
      font-size: 14px;
    }

    @media (max-width: 500px) {
      body {
        padding: 10px;
      }

      .container {
        padding: 16px;
      }
    }
  </style>
</head>

<body>
  <main class="container">
    <h1>পরীক্ষার সেটিংস</h1>

    <label for="examSelect">পরীক্ষা নির্বাচন করুন</label>
    <select id="examSelect">
      <option value="">পরীক্ষা নির্বাচন করুন</option>
    </select>

    <button type="button" id="loadExamSettings" class="load-button">
      সেটিংস লোড করুন
    </button>

    <div id="loadMessage" class="message" role="status"></div>

    <form id="examSettingsForm">
      <h2>পরীক্ষার মূল তথ্য</h2>

      <label for="examName">পরীক্ষার নাম</label>
      <input type="text" id="examName" required>

      <label for="duration">পরীক্ষার সময় (মিনিট)</label>
      <input type="number" id="duration" min="1" step="1" required>

      <label for="marks">প্রতি প্রশ্নের নম্বর</label>
      <input type="number" id="marks" min="0" step="any" required>

      <label for="negative">প্রতি ভুল উত্তরের নেগেটিভ মার্ক</label>
      <input type="number" id="negative" min="0" step="any" required>

      <label for="passMark">পাস নম্বর</label>
      <input type="number" id="passMark" min="0" step="any" required>

      <h2>ফলাফল ও উত্তরপত্র</h2>

      <div class="checkbox-row">
        <input type="checkbox" id="showResult">
        <label for="showResult">শিক্ষার্থীকে পরীক্ষার ফলাফল দেখান</label>
      </div>

      <div class="checkbox-row">
        <input type="checkbox" id="showPosition">
        <label for="showPosition">শিক্ষার্থীকে মেধাক্রম/অবস্থান দেখান</label>
      </div>

      <div class="checkbox-row">
        <input type="checkbox" id="showAnswerPaper">
        <label for="showAnswerPaper">শিক্ষার্থীকে উত্তরপত্র দেখার সুযোগ দিন</label>
      </div>

      <label for="thankYouMessage">পরীক্ষা শেষে ধন্যবাদ বার্তা</label>
      <textarea id="thankYouMessage" placeholder="পরীক্ষায় অংশগ্রহণ করার জন্য ধন্যবাদ।"></textarea>

      <h2>Facebook লিংক</h2>

      <label for="pageLink">Facebook Page URL</label>
      <input
        type="url"
        id="pageLink"
        placeholder="https://www.facebook.com/yourpage"
      >

      <div class="checkbox-row">
        <input type="checkbox" id="showPageLink">
        <label for="showPageLink">পরীক্ষা শেষে Facebook Page লিংক দেখান</label>
      </div>

      <label for="groupLink">Facebook Group URL</label>
      <input
        type="url"
        id="groupLink"
        placeholder="https://www.facebook.com/groups/yourgroup"
      >

      <div class="checkbox-row">
        <input type="checkbox" id="showGroupLink">
        <label for="showGroupLink">পরীক্ষা শেষে Facebook Group লিংক দেখান</label>
      </div>

      <p class="hint">
        এই সেটিংস নির্বাচিত পরীক্ষার জন্য প্রযোজ্য হবে। সেটিংস পরিবর্তন করলে
        আগের শিক্ষার্থীদের পরীক্ষার রেকর্ড মুছে ফেলার কথা নয়।
      </p>

      <button type="submit" id="saveSettings" class="save-button">
        সেটিংস সেভ করুন
      </button>

      <div id="settingsMessage" class="message" role="status"></div>
    </form>
  </main>

  <script src="js/supabase.js"></script>
  <script src="js/exam-manager.js"></script>
</body>
</html>
