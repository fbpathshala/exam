  <style>
    .exam,.panel{background:#fff;border:1px solid #dbe3ee;border-radius:12px;margin:12px 0;padding:14px}
    .head{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
    /* The global admin contrast guard makes all buttons white; override it for exam-name buttons. */
    button.name,.name{flex:1;min-width:150px;text-align:left;color:#1756a9!important;background:#fff!important;border:1px solid #dbe3ee!important}
    button.name:hover,.name:hover{color:#0f3d78!important;background:#f1f7ff!important}
    .menu{width:auto;min-width:44px}
    .buttons{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:12px}
    .panel{border-top:1px solid #dbe3ee;margin-top:10px;padding-top:10px}
    .q{display:flex;gap:8px;padding:8px 0;border-bottom:1px solid #eee;align-items:center}

    #message{overflow-wrap:anywhere;white-space:pre-wrap}
    @media(max-width:600px){.buttons{grid-template-columns:1fr}}
  </style><style id="premium-contrast-guard">

      <p>পরীক্ষার নাম চাপলে লিংক কপি হবে। পাশে ☰ চাপলে কাজের বাটন খুলবে।</p>
      <p class="muted">নতুন পরীক্ষা তৈরি করতে ড্যাশবোর্ডের “পরীক্ষা তৈরি” অপশন ব্যবহার করুন।</p>

<script id="site-copy-deterrent-script">(function(){function editable(t){return !!(t&&t.closest&&t.closest('input,textarea,select,[contenteditable="true"],[contenteditable=""]'))}document.addEventListener('contextmenu',function(e){if(!editable(e.target))e.preventDefault()});document.addEventListener('selectstart',function(e){if(!editable(e.target))e.preventDefault()});document.addEventListener('copy',function(e){if(!editable(e.target))e.preventDefault()});document.addEventListener('cut',function(e){if(!editable(e.target))e.preventDefault()});document.addEventListener('keydown',function(e){if(editable(e.target))return;var k=(e.key||'').toLowerCase();if((e.ctrlKey||e.metaKey)&&['c','x','u','s','p'].includes(k)){e.preventDefault();e.stopPropagation()}if(e.key==='PrintScreen'){e.preventDefault()}} ,true)})();</script><div class="central-section-return"><a href="https://fbpathshala.github.io/home.html">⌂ মূল মেনু / হোম পেইজে ফিরুন</a></div></body>
