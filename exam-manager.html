<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>পরীক্ষা ব্যবস্থাপনা | FB Pathshala</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 16px;
      font-family: Arial, sans-serif;
      background: #f3f6fa;
      color: #222;
    }

    .container {
      max-width: 850px;
      margin: 0 auto;
    }

    h2 {
      text-align: center;
      color: #176b43;
      margin-bottom: 20px;
    }

    .card {
      background: #fff;
      padding: 18px;
      margin-bottom: 18px;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
    }

    label {
      display: block;
      font-weight: bold;
      margin: 14px 0 6px;
    }

    input,
    select,
    textarea {
      width: 100%;
      padding: 11px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 16px;
      background: #fff;
    }

    textarea {
      min-height: 90px;
      resize: vertical;
    }

    .checkbox-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 14px 0;
    }

    .checkbox-row input {
      width: auto;
      transform: scale(1.2);
    }

    .checkbox-row label {
      margin: 0;
      font-weight: normal;
    }

    button {
      border: none;
      border-radius: 6px;
      padding: 12px 16px;
      margin-top: 14px;
      width: 100%;
      background: #176b43;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:disabled {
      background: #999;
      cursor: not-allowed;
    }

    .secondary-button {
      background: #2458a6;
    }

    .message {
      margin-top: 12px;
      padding: 10px;
      border-radius: 6px;
      display: none;
      overflow-wrap: anywhere;
    }

    .success {
      display: block;
      background: #e5f7eb;
      color: #176b43;
    }

    .error {
      display: block;
      background: #fdeaea;
      color: #b42318;
    }

    .hint {
      color: #666;
      font-size: 13px;
      line-height: 1.6;
    }

    .section-title {
      color: #176b43;
      margin-top: 0;
    }

    @media (min-width: 600px) {
      .two-columns {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 0 16px;
      }
    }
  </style>
</head>

<body>
  <div class="container">

    <h2>পরীক্ষা ব্যবস্থাপনা</h2>

    <div class="card">
      <h3 class="section-title">পরীক্ষা নির্বাচন</h3>

      <label for="examSelect">পরীক্ষার তালিকা</label>
      <select id="examSelect">
        <option value="">পরীক্ষা লোড হচ্ছে...</option>
      </select>

      <button type="button" id="loadExamSettings" class="secondary-button">
        পরীক্ষার সেটিংস লোড করুন
      </button>

      <div id="loadMessage" class="message" role="status"></div>
    </div>

    <form id="examSettingsForm" class="card">
      <h3 class="section-title">পরীক্ষার সেটিংস পরিবর্তন</h3>

      <p class="hint">
        পরীক্ষা নির্বাচন করে সেটিংস লোড করুন। পরিবর্তন করার পর সেভ করলে
        সংশ্লিষ্ট পরীক্ষার সেটিংস আপডেট হবে।
      </p>

      <div class="two-columns">
        <div>
          <label for="examName">পরীক্ষার নাম</label>
          <input
            type="text"
            id="examName"
            name="examName"
            required
          >
        </div>

        <div>
          <label for="duration">সময় (মিনিট)</label>
          <input
            type="number"
            id="duration"
            name="duration"
            min="1"
            required
          >
        </div>

        <div>
          <label for="marks">প্রতি প্রশ্নের নম্বর</label>
          <input
            type="number"
            id="marks"
            name="marks"
            min="0"
            step="any"
            required
          >
        </div>

        <div>
          <label for="negative">নেগেটিভ মার্ক</label>
          <input
            type="number"
            id="negative"
            name="negative"
            min="0"
            step="any"
            required
          >
        </div>

        <div>
          <label for="passMark">পাস নম্বর</label>
          <input
            type="number"
            id="passMark"
            name="passMark"
            min="0"
            step="any"
            required
          >
        </div>
      </div>

      <hr style="border:0;border-top:1px solid #eee;margin:22px 0;">

      <h3 class="section-title">পরীক্ষার ফলাফল ও উত্তরপত্র</h3>

      <div class="checkbox-row">
        <input type="checkbox" id="showResult" name="showResult">
        <label for="showResult">পরীক্ষা শেষে ফলাফল দেখাবে</label>
      </div>

      <div class="checkbox-row">
        <input type="checkbox" id="showPosition" name="showPosition">
        <label for="showPosition">শিক্ষার্থীর অবস্থান/মেধাক্রম দেখাবে</label>
      </div>

      <div class="checkbox-row">
        <input type="checkbox" id="showAnswerPaper" name="showAnswerPaper">
        <label for="showAnswerPaper">উত্তরপত্র দেখার সুযোগ থাকবে</label>
      </div>

      <label for="thankYouMessage">পরীক্ষা শেষে ধন্যবাদ বার্তা</label>
      <textarea
        id="thankYouMessage"
        name="thankYouMessage"
        placeholder="পরীক্ষায় অংশগ্রহণের জন্য ধন্যবাদ..."
      ></textarea>

      <label for="groupLink">ফেসবুক গ্রুপের লিংক</label>
      <input
        type="url"
        id="groupLink"
        name="groupLink"
        placeholder="https://www.facebook.com/groups/..."
      >

      <div class="checkbox-row">
        <input type="checkbox" id="showGroupLink" name="showGroupLink">
        <label for="showGroupLink">ফলাফল পৃষ্ঠায় গ্রুপে যোগ দেওয়ার লিংক দেখাবে</label>
      </div>

      <button type="submit" id="saveSettings">
        সেটিংস সেভ করুন
      </button>

      <div id="settingsMessage" class="message" role="status"></div>
    </form>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase.js"></script>
  <script src="js/exam-manager.js"></script>
</body>
</html>
